# Management overlay — publishes the config UI and RSS/Atom feed ports.
#
# Use with the base compose file:
#   docker compose -f docker-compose.yml -f docker-compose.management.yml up -d
#
# Or add to your .env file so it's always included:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.management.yml
#
# Security note
# -------------
# The config UI (outputs.config) has read+write access to config.yaml,
# including every API key and credential stored there. Do not expose port
# 8094 beyond your local machine without enabling auth first:
#   auth:
#     enabled: true
#     username: yourname
#     password: yourpassword
#
# The outputs.config.host setting (default: 127.0.0.1) controls which
# address the config UI server binds to inside the container. Change it to
# 0.0.0.0 in config.yaml if you want it reachable from the Docker host or
# other machines on your LAN.

services:
  mediainfo:
    ports:
      - "${CONFIG_PORT:-8094}:8094"     # outputs.config (config UI)
      - "${CONFIG_PORT_ALT:-8095}:8095" # outputs.config second instance, if configured
      - "${FEED_PORT:-8086}:8086"       # outputs.feed (RSS/Atom)
