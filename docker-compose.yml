services:
  pixoo-media-display:
    build: .
    restart: unless-stopped
    ports:
      - "8090:8090"
      - "8091:8091"
      - "8092:8092"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./cache:/app/cache
      - ./logs:/app/logs
      - ./adb_keys:/app/adb_keys
      - ./artwork:/app/artwork
