services:
  autoheal:
    # Optional service: restarts containers that fail their HEALTHCHECK.
    # Requires Docker socket access (read-only is sufficient for autoheal
    # but the image mounts it read-write by default).
    # Activate with: docker compose --profile autoheal up
    profiles: [autoheal]
    image: willfarrell/autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  mediainfo:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "mediainfo", "--config", "config/config.yaml"]
    ports:
      - "${WEB_PORT:-8090}:8090"
      - "${VIDEO_PORT:-8091}:8091"
      - "${NEST_HUB_PORT:-8092}:8092"
      - "${INFO_PORT:-8093}:8093"
      - "${CONFIG_PORT:-8094}:8094"    # outputs.config (config UI) - its documented default port
      - "${CONFIG_PORT_ALT:-8095}:8095" # outputs.config on an alternate port (e.g. second instance)
      - "${FEED_PORT:-8086}:8086"       # outputs.feed (RSS/Atom) - only needed if that output is enabled
    volumes:
      # A directory mount (not a single-file mount) so config.yaml stays
      # readable/writable across edits that replace the file via rename
      # (atomic saves - many editors and tools do this, including the
      # `config` output's own save path) without orphaning a stale inode,
      # which a single-file bind mount is prone to. Put config.yaml in
      # ./config/ (cp config.example.yaml config/config.yaml) - read-write
      # so the `config` output (see config.example.yaml) can save edits
      # made through its web UI; mount `:ro` instead if that output is
      # disabled and you only ever edit config.yaml by hand.
      - ./config:/app/config
      - ./cache:/app/cache
      - ./library:/app/library
      - ./logs:/app/logs
      - ./adb_keys:/app/adb_keys
      - ./artwork:/app/artwork
      - ./spotify_cache:/app/spotify_cache  # Spotify OAuth token; only needed if Spotify is enabled
      - ./overrides:/app/overrides  # Manual artwork overrides; only needed if overrides.enabled
      # idle.local: point this at your own pictures (each immediate
      # subdirectory of the host path is one "destination") - mounted
      # read-only since this output never needs to write to it. Only
      # needed if idle.local.enabled.
      - ./pictures:/app/pictures:ro
