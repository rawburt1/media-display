services:
  mediainfo:
    build: .
    restart: unless-stopped
    ports:
      - "8090:8090"
      - "8091:8091"
      - "8092:8092"
      - "8093:8093"
      - "8094:8094"
    volumes:
      # Read-write so the `config` output (see config.example.yaml) can save
      # edits made through its web UI. Mount `:ro` instead if that output is
      # disabled and you only ever edit config.yaml by hand.
      - ./config.yaml:/app/config.yaml
      - ./cache:/app/cache
      - ./logs:/app/logs
      - ./adb_keys:/app/adb_keys
      - ./artwork:/app/artwork
      - ./spotify_cache:/app/spotify_cache  # Spotify OAuth token; only needed if Spotify is enabled
