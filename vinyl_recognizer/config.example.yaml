# Copy this file to config.yaml and fill in your own values.
#
# Run `python -m vinyl_recognizer --list-devices` first to find the name (or
# index) of your Behringer UCA202 (or other USB audio interface).

# Which recognition API to use: "audd", "acrcloud", "acoustid", "shazam",
# or "vibra".
recognition_provider: audd

# API token from https://dashboard.audd.io/ (only used when
# recognition_provider is "audd").
audd_api_key: YOUR_AUDD_API_TOKEN

# ACRCloud project credentials (only used when recognition_provider is
# "acrcloud") - create a free "Audio & Video Recognition" project at
# https://console.acrcloud.com/ and copy these from its console page.
acrcloud_host: identify-eu-west-1.acrcloud.com
acrcloud_access_key: YOUR_ACRCLOUD_ACCESS_KEY
acrcloud_access_secret: YOUR_ACRCLOUD_ACCESS_SECRET

# Optional, "acrcloud" only: if ACRCloud reports it's rate-limiting us,
# temporarily fall back to matching against your own reference clips in
# this folder instead of giving up (see local_folder.py) - requires
# `fpcalc`. Leave empty (the default) to just treat a rate limit as a
# plain miss. Each file's name (minus extension) is used as the result,
# e.g. "Pink Floyd - Comfortably Numb - The Wall.flac".
local_folder_fallback_dir: ""

# API key from https://acoustid.org/my-applications (only used when
# recognition_provider is "acoustid"). Also requires the `fpcalc` binary
# (Chromaprint command-line tools) to be installed - see acoustid.py.
acoustid_api_key: YOUR_ACOUSTID_API_KEY

# "shazam" needs no API key at all (it talks to Shazam's own backend via
# the shazamio library, the same way the mobile app does) - just requires
# `ffmpeg` to be installed for shazamio's own audio decoding. Nothing to
# fill in here beyond setting recognition_provider: shazam above.

# "vibra" also needs no API key (same Shazam backend as above, but via
# the native `vibra` binary instead of shazamio - see vibra.py). Requires
# building https://github.com/BayernMuller/vibra from source and putting
# the resulting binary on PATH; nothing to fill in here beyond setting
# recognition_provider: vibra above.

# Substring of the input device's name (e.g. "UCA202"), or its numeric
# index. Leave empty to use the system default input device.
input_device: "UCA202"

sample_rate: 44100

# How often (in seconds) to record a short clip to check whether anything
# is playing.
poll_interval_seconds: 5

# Length (in seconds) of that signal-detection clip.
signal_clip_seconds: 1

# Length (in seconds) of the clip sent to AudD for recognition.
recognition_clip_seconds: 8

# Minimum time (in seconds) between recognition requests while audio keeps
# playing - keep this high enough to stay within your provider's free
# tier (AudD's default free tier is 300 requests/day).
recognition_interval_seconds: 60

# RMS amplitude (0-1) below which audio is considered silence.
silence_threshold: 0.01

# How long (in seconds) signal must be absent before the current track is
# cleared (i.e. "nothing playing").
silence_grace_seconds: 15

# HTTP server that mediainfo's "vinyl" source polls for the current
# recognition result.
host: 0.0.0.0
port: 8091
