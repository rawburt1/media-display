<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordklocka Griffeltavla</title>
<style>
  :root { --panel-bg: rgba(30, 38, 34, 0.92); --panel-fg: #eef2ec; --panel-accent: #eef2ec; --panel-bg-solid: #1e2622; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #6b4a2b; }
  /* Träramen runt tavlan och krithyllan nedtill */
  .frame { position: fixed; inset: 0; pointer-events: none;
           border: 3.4vmin solid #8a5a32; border-bottom-width: 6vmin;
           box-shadow: inset 0 0 0 0.5vmin #5e3b1d, inset 0 0 3vmin rgba(0, 0, 0, 0.6);
           border-image: linear-gradient(135deg, #a06a3c, #6e4524 40%, #9a6236 70%, #5e3b1d) 1; }
  .tray { position: fixed; left: 3.4vmin; right: 3.4vmin; bottom: 2.6vmin; height: 1.6vmin; background: linear-gradient(#b57c49, #7a4c28);
          box-shadow: 0 -0.4vmin 0.6vmin rgba(0, 0, 0, 0.4); }
  .chalk { position: fixed; bottom: 4vmin; left: 18vw; width: 7vmin; height: 1.4vmin; border-radius: 0.5vmin; background: linear-gradient(#fff, #ddd);
           transform: rotate(-4deg); }
  .chalk.b { left: 24vw; width: 4vmin; transform: rotate(6deg); background: linear-gradient(#f9e7a8, #e2c86e); }
  canvas { position: fixed; inset: 3.4vmin 3.4vmin 6vmin 3.4vmin; width: calc(100% - 6.8vmin); height: calc(100% - 9.4vmin); display: block; }
</style>
</head>
<body>
<canvas id="board" aria-hidden="true"></canvas>
<div class="frame" aria-hidden="true"></div>
<div class="tray" aria-hidden="true"></div>
<div class="chalk" aria-hidden="true"></div>
<div class="chalk b" aria-hidden="true"></div>

<div class="panel">
  <div class="readout" id="readout" aria-live="polite"></div>
  <div class="controls">
    <div class="group" role="group" aria-label="Uttryck för :20 och :40">
      <span class="label">20 / 40</span>
      <button data-style="tjugo">tjugo över</button>
      <button data-style="halv">tio i halv</button>
    </div>
    <div class="group"><button id="fs" aria-pressed="false">helskärm</button></div>
  </div>
</div>

<script src="/ordklocka/tid.js"></script>
<script src="/ordklocka/sida.js"></script>
<script src="/ordklocka/skrift.js"></script>
<script>
  const S = OrdklockaSida;
  const K = OrdklockaSkrift;
  const cv = document.getElementById("board"), ctx = cv.getContext("2d");
  const FONT = size => `${size}px ${K.HAND}`;
  const rnd = (a, b) => a + Math.random() * (b - a);
  let W = 0, H = 0, dpr = 1;
  let slate = null, ghost = null;   // tavlans yta, och gamla suddade rester
  let lines = null, L = null, art = null, progress = 0, writing = false;
  let erase = null;                 // {art, L, t0} medan svampen sveper

  function layer() {
    const c = document.createElement("canvas");
    c.width = W * dpr; c.height = H * dpr;
    const g = c.getContext("2d");
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    return [c, g];
  }

  function resize() {
    dpr = Math.min(2, devicePixelRatio || 1);
    const r = cv.getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // Skiffergrön tavla med fläckar efter tidigare suddningar
    let g;
    [slate, g] = layer();
    const grd = g.createLinearGradient(0, 0, W, H);
    grd.addColorStop(0, "#2f4a3f"); grd.addColorStop(1, "#24382f");
    g.fillStyle = grd; g.fillRect(0, 0, W, H);
    for (let i = 0; i < 60; i++) {
      const x = rnd(0, W), y = rnd(0, H), rr = rnd(0.05, 0.25) * W;
      const rg = g.createRadialGradient(x, y, 0, x, y, rr);
      rg.addColorStop(0, `rgba(255,255,255,${rnd(0.01, 0.035)})`); rg.addColorStop(1, "rgba(255,255,255,0)");
      g.fillStyle = rg; g.fillRect(x - rr, y - rr, rr * 2, rr * 2);
    }
    for (let i = 0; i < 2500; i++) { g.fillStyle = `rgba(255,255,255,${rnd(0.02, 0.07)})`; g.fillRect(rnd(0, W), rnd(0, H), 1, 1); }
    [ghost] = layer();
    art = null;
    draw();
  }

  // Kritskriften: vit text med korn - prickar stansas bort så att den
  // svarta tavlan lyser igenom, som när kritan hoppar över ojämnheter.
  function buildArt() {
    L = K.layout(ctx, lines, { x: W * 0.08, y: H * 0.1, w: W * 0.84, h: H * 0.8 }, FONT, { lineHeight: 1.2 });
    const [c, g] = layer();
    g.font = L.font; g.textBaseline = "middle"; g.lineJoin = g.lineCap = "round";
    for (const line of L.lines) {
      for (const [dx, dy, a] of [[0, 0, 0.92], [L.size * 0.012, L.size * 0.01, 0.4]]) {
        g.fillStyle = `rgba(245,245,238,${a})`; g.strokeStyle = g.fillStyle; g.lineWidth = L.size * 0.03;
        g.fillText(line.text, line.x + dx, line.y + dy);
        g.strokeText(line.text, line.x + dx, line.y + dy);
      }
    }
    g.globalCompositeOperation = "destination-out";
    const n = Math.round(W * H / 12);
    for (let i = 0; i < n; i++) {
      g.fillStyle = `rgba(0,0,0,${rnd(0.3, 0.9)})`;
      const s = rnd(0.6, 1.8);
      g.fillRect(rnd(0, W), rnd(0, H), s, s * rnd(0.4, 1));
    }
    return c;
  }

  // Klipper fram texten fram till kritans position (som skrift.js gör).
  function drawWritten() {
    if (!lines) return;
    if (!art) art = buildArt();
    K.drawPartial(ctx, L, progress, g => g.drawImage(art, 0, 0, W, H));
  }

  function draw(now = performance.now()) {
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(slate, 0, 0, W, H);
    ctx.drawImage(ghost, 0, 0, W, H);
    if (erase) {
      // Svampen sveper från vänster till höger; framför den finns den gamla
      // texten kvar, bakom den bara en grå smet.
      const p = Math.min(1, (now - erase.t0) / 1400);
      const x = -W * 0.1 + p * W * 1.2;
      ctx.save(); ctx.beginPath(); ctx.rect(x, 0, W, H); ctx.clip();
      ctx.drawImage(erase.art, 0, 0, W, H);
      ctx.restore();
      const y = H * 0.5 + Math.sin(p * Math.PI * 6) * H * 0.25;
      ctx.fillStyle = "#6b4a2b"; ctx.fillRect(x - W * 0.04, y - H * 0.09, W * 0.08, H * 0.12);
      ctx.fillStyle = "#3a3a3a"; ctx.fillRect(x - W * 0.04, y + H * 0.03, W * 0.08, H * 0.03);
      if (p >= 1) { erase = null; writing = true; }
      return;
    }
    drawWritten();
    tally();
  }

  // Extraminuterna som kritstreck i nedre högra hörnet
  let extra = 0;
  function tally() {
    ctx.save();
    ctx.strokeStyle = "rgba(245,245,238,0.8)"; ctx.lineCap = "round"; ctx.lineWidth = Math.max(2, H * 0.006);
    for (let i = 0; i < extra; i++) {
      const x = W * 0.9 + i * W * 0.018, y = H * 0.86;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + W * 0.004, y + H * 0.07); ctx.stroke();
    }
    ctx.restore();
  }

  let prev = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - prev) / 1000); prev = now;
    if (erase) draw(now);
    else if (writing && lines) {
      if (!art) art = buildArt();
      progress = Math.min(L.chars, progress + dt * 5);
      draw(now);
      if (progress >= L.chars) writing = false;
    }
    requestAnimationFrame(frame);
  }

  function write(newLines, animate) {
    if (animate && art) {
      // Det gamla suddas: kvar blir en svag, utsmetad skugga av det.
      const g = ghost.getContext("2d");
      g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
      g.globalCompositeOperation = "destination-out"; g.fillStyle = "rgba(0,0,0,0.55)"; g.fillRect(0, 0, ghost.width, ghost.height);
      g.globalCompositeOperation = "source-over"; g.globalAlpha = 0.09; g.filter = `blur(${6 * dpr}px)`;
      g.drawImage(art, 0, 0); g.restore();
      erase = { art, t0: performance.now() };
      lines = newLines; art = null; L = null; progress = 0;
      return;
    }
    lines = newLines; art = null; progress = animate ? 0 : 9999; writing = animate;
    draw();
  }

  addEventListener("resize", () => { resize(); progress = 9999; draw(); });
  resize();
  const clock = S.clock((t, info) => {
    extra = t.extra;
    if (info.wordsChanged) write(["Klockan är", ...S.lines(t).map(l => l.toLowerCase())], !info.first);
    else if (!erase && !writing) draw();
  });
  S.choice("style", "ordklocka-style", "tjugo", v => clock.setStyle(v));
  requestAnimationFrame(frame);
  S.setup("/ordklocka/griffeltavla/ws");
</script>
<script src="/ordklocka/meny.js"></script>
</body>
</html>
