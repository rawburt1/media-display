<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordklocka Duschvägg</title>
<style>
  :root {
    --panel-bg: rgba(240, 244, 246, 0.94); --panel-fg: #2b3640; --panel-accent: #2b3640;
    --panel-bg-solid: #f0f4f6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    /* Mörkt skifferkakel bakom glaset, så att det torkade syns mot imman */
    background:
      linear-gradient(90deg, rgba(0, 0, 0, 0.25), transparent 20%, transparent 80%, rgba(0, 0, 0, 0.3)),
      linear-gradient(#18262b 3px, transparent 3px) 0 0 / 12vmin 12vmin,
      linear-gradient(90deg, #18262b 3px, transparent 3px) 0 0 / 12vmin 12vmin,
      linear-gradient(160deg, #3d5a62, #2a4249);
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* Ånga som driver uppåt */
  .steam { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .steam i {
    position: absolute; bottom: -40vh; width: 60vmax; height: 60vmax; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255, 255, 255, 0.35), transparent);
    animation: rise 18s linear infinite;
  }
  @keyframes rise {
    from { transform: translateY(0) scale(0.8); opacity: 0; }
    15% { opacity: 1; }
    to { transform: translateY(-140vh) scale(1.3); opacity: 0; }
  }
  /* Glasets kant och blank list */
  .edge { position: fixed; inset: 0; pointer-events: none;
          box-shadow: inset 0 0 0 1.2vmin rgba(200, 210, 216, 0.9), inset 0 0 0 1.5vmin rgba(120, 130, 136, 0.6),
                      inset 2vmin 0 3vmin rgba(255, 255, 255, 0.3); }
  @media (prefers-reduced-motion: reduce) { .steam i { animation: none; opacity: 0.6; } }
</style>
</head>
<body>
<canvas id="fog"></canvas>
<div class="steam" aria-hidden="true">
  <i style="left:-10%;animation-delay:0s"></i><i style="left:25%;animation-delay:-6s"></i>
  <i style="left:55%;animation-delay:-12s"></i><i style="left:80%;animation-delay:-3s"></i>
</div>
<div class="edge"></div>

<div class="panel">
  <div class="readout" id="readout" aria-live="polite"></div>
  <div class="controls">
    <div class="group" role="group" aria-label="Uttryck för :20 och :40">
      <span class="label">20 / 40</span>
      <button data-style="tjugo">tjugo över</button>
      <button data-style="halv">tio i halv</button>
    </div>
    <div class="group"><button id="fs" aria-pressed="false">helskärm</button></div>
  </div>
</div>

<script src="/ordklocka/tid.js"></script>
<script src="/ordklocka/sida.js"></script>
<script src="/ordklocka/skrift.js"></script>
<script src="/ordklocka/imma.js"></script>
<script>
  const S = OrdklockaSida;
  const fog = OrdklockaImma.start({
    fog: "rgb(236, 241, 243)", alpha: 0.86, drips: 0.6, dripLength: 2.2, dripSpeed: 0.35,
    box: (w, h) => ({ x: w * 0.08, y: h * 0.08, w: w * 0.84, h: h * 0.62 }),
  });
  const clock = S.clock((t, info) => {
    if (info.wordsChanged) fog.show(["Klockan är", ...S.lines(t).map(l => l.toLowerCase())], true);
  });
  S.choice("style", "ordklocka-style", "tjugo", v => clock.setStyle(v));
  S.setup("/ordklocka/dusch/ws");
</script>
<script src="/ordklocka/meny.js"></script>
</body>
</html>
