<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordklocka Cirklar</title>
<style>
  :root {
    --bg: #0b0d14; --dim: rgba(190, 200, 230, 0.16); --lit: #ffe6a8; --glow: rgba(255, 196, 90, 0.75);
    --ring: rgba(190, 200, 230, 0.07);
    --panel-bg: rgba(16, 18, 28, 0.9); --panel-fg: #e6e9f5; --panel-accent: #ffe6a8;
    --panel-bg-solid: #10121c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden;
               background: radial-gradient(circle at 50% 50%, #161a29 0%, var(--bg) 70%); }
  svg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  text {
    font-family: "Futura", "Avenir Next", "Century Gothic", "DejaVu Sans", system-ui, sans-serif;
    font-weight: 600; letter-spacing: 0.12em; fill: var(--dim);
    transition: fill 1.2s, filter 1.2s;
  }
  text.lit { fill: var(--lit); filter: url(#glow); }
  .ring { animation: spin linear infinite; transform-origin: 0 0; }
  .guide { fill: none; stroke: var(--ring); stroke-width: 1; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .center { font-size: 34px; letter-spacing: 0.3em; fill: rgba(230, 235, 250, 0.75); filter: none; }
  .dot { fill: var(--dim); transition: fill 0.8s; }
  .dot.on { fill: var(--lit); }
  @media (prefers-reduced-motion: reduce) { .ring { animation: none; } }
</style>
</head>
<body>
<svg id="dial" viewBox="-500 -500 1000 1000" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <text class="center" text-anchor="middle" y="-6">KLOCKAN</text>
  <text class="center" text-anchor="middle" y="34">ÄR</text>
  <g id="dots"></g>
</svg>

<div class="panel">
  <div class="readout" id="readout" aria-live="polite"></div>
  <div class="controls">
    <div class="group" role="group" aria-label="Uttryck för :20 och :40">
      <span class="label">20 / 40</span>
      <button data-style="tjugo">tjugo över</button>
      <button data-style="halv">tio i halv</button>
    </div>
    <div class="group"><button id="fs" aria-pressed="false">helskärm</button></div>
  </div>
</div>

<script src="/ordklocka/tid.js"></script>
<script src="/ordklocka/sida.js"></script>
<script>
  const S = OrdklockaSida;
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("dial");

  // Ringarna inifrån och ut: vanliga timmar, digitala minuter, uttryck,
  // digitala timmar. Varje ring roterar sakta, varannan åt andra hållet.
  const RINGS = [
    { r: 150, size: 30, period: 420, words: ["ETT", "TVÅ", "TRE", "FYRA", "FEM", "SEX", "SJU", "ÅTTA", "NIO", "TIO", "ELVA", "TOLV"] },
    { r: 238, size: 30, period: -560, words: ["NOLL FEM", "TIO", "FEMTON", "TJUGO", "TJUGOFEM", "TRETTIO", "TRETTIOFEM", "FYRTIO", "FYRTIOFEM", "FEMTIO", "FEMTIOFEM"] },
    { r: 330, size: 30, period: 700, words: ["FEM ÖVER", "TIO ÖVER", "KVART ÖVER", "TJUGO ÖVER", "TIO I HALV", "FEM I HALV", "HALV", "FEM ÖVER HALV", "TIO ÖVER HALV", "TJUGO I", "KVART I", "TIO I", "FEM I"] },
    { r: 428, size: 34, period: -900, words: ["TRETTON", "FJORTON", "FEMTON", "SEXTON", "SJUTTON", "ARTON", "NITTON", "TJUGO", "TJUGOETT", "TJUGOTVÅ", "TJUGOTRE"] },
  ];

  const rings = RINGS.map((ring, k) => {
    const g = document.createElementNS(NS, "g");
    g.setAttribute("class", "ring");
    g.style.animationDuration = Math.abs(ring.period) + "s";
    g.style.animationDirection = ring.period < 0 ? "reverse" : "normal";
    // Börja på olika vinklar, så att orden inte står i rad.
    g.style.animationDelay = -Math.abs(ring.period) * (k * 0.27) + "s";
    const guide = document.createElementNS(NS, "circle");
    guide.setAttribute("class", "guide");
    guide.setAttribute("r", ring.r + ring.size * 0.95);
    g.appendChild(guide);
    // Cirkelbana medurs från toppen, som texten följer.
    const path = document.createElementNS(NS, "path");
    path.id = "ring" + k;
    path.setAttribute("fill", "none");
    path.setAttribute("d", `M 0 ${-ring.r} A ${ring.r} ${ring.r} 0 1 1 0 ${ring.r} A ${ring.r} ${ring.r} 0 1 1 0 ${-ring.r}`);
    g.appendChild(path);
    const texts = ring.words.map(word => {
      const t = document.createElementNS(NS, "text");
      t.setAttribute("font-size", ring.size);
      const tp = document.createElementNS(NS, "textPath");
      tp.setAttribute("href", "#ring" + k);
      tp.textContent = word;
      t.appendChild(tp);
      g.appendChild(t);
      return { word, t, tp };
    });
    svg.insertBefore(g, svg.querySelector(".center"));
    return { ...ring, texts };
  });

  // Fördela orden jämnt runt ringen, krymp texten om den inte ryms.
  function spread() {
    for (const ring of rings) {
      const circ = 2 * Math.PI * ring.r;
      let size = ring.size;
      ring.texts.forEach(x => x.t.setAttribute("font-size", size));
      let total = ring.texts.reduce((s, x) => s + x.tp.getComputedTextLength(), 0);
      const minGap = size * 1.2;
      if (total + minGap * ring.texts.length > circ) {
        size *= (circ - minGap * ring.texts.length) / total;
        ring.texts.forEach(x => x.t.setAttribute("font-size", size));
        total = ring.texts.reduce((s, x) => s + x.tp.getComputedTextLength(), 0);
      }
      const gap = (circ - total) / ring.texts.length;
      let at = gap / 2;
      for (const x of ring.texts) {
        x.tp.setAttribute("startOffset", at);
        at += x.tp.getComputedTextLength() + gap;
      }
    }
  }
  spread();
  document.fonts?.ready.then(spread);

  // Extraminuterna: fyra prickar under KLOCKAN ÄR.
  const dotGroup = document.getElementById("dots");
  const dots = [0, 1, 2, 3].map(i => {
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("class", "dot");
    c.setAttribute("cx", (i - 1.5) * 22);
    c.setAttribute("cy", 70);
    c.setAttribute("r", 5);
    dotGroup.appendChild(c);
    return c;
  });

  function light(k, word) {
    for (const x of rings[k].texts) if (x.word === word) x.t.classList.add("lit");
  }

  const clock = S.clock(t => {
    rings.forEach(ring => ring.texts.forEach(x => x.t.classList.remove("lit")));
    const hour = t.hourWords.join("");
    if (t.digital) {
      light(3, hour);
      t.minutes.length && light(1, t.minutes.map(p => p.join("")).join(" "));
    } else {
      light(0, hour);
      t.minuteWords.length && light(2, t.minuteWords.join(" "));
    }
    dots.forEach((d, i) => d.classList.toggle("on", i < t.extra));
  });
  S.choice("style", "ordklocka-style", "tjugo", v => clock.setStyle(v));
  S.setup("/ordklocka/cirklar/ws");
</script>
<script src="/ordklocka/meny.js"></script>
</body>
</html>
