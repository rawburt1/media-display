<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordklocka Typografi</title>
<style>
  :root {
    --bg: #0f0f10; --fg: #f2efe8; --accent: #ff7a45;
    --panel-bg: rgba(30, 30, 32, 0.9); --panel-fg: #f2efe8; --panel-accent: #f2efe8;
    --panel-bg-solid: #1e1e20;
  }
  [data-theme="ljus"] {
    --bg: #f3efe6; --fg: #151515; --accent: #d2491b;
    --panel-bg: rgba(255, 255, 255, 0.92); --panel-fg: #151515; --panel-accent: #151515;
    --panel-bg-solid: #fff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
               transition: background 0.6s, color 0.6s; }
  .words, .measure {
    font-family: "Inter", "Helvetica Neue", "Arial Black", "DejaVu Sans", system-ui, sans-serif;
    font-weight: 900; line-height: 0.92;
  }
  /* Spärrningen sätts på orden själva: em räknas annars om i förälderns storlek */
  .word, .measure span { letter-spacing: -0.045em; flex-shrink: 0; }
  /* Osynlig kopia där nästa uppställning mäts upp */
  .measure {
    position: fixed; left: 0; top: 0; visibility: hidden; pointer-events: none;
    display: flex; flex-wrap: wrap; justify-content: center; align-content: center;
    column-gap: 0.22em; row-gap: 0.04em; white-space: nowrap;
  }
  .words { position: fixed; inset: 0; }
  .word {
    position: absolute; left: 0; top: 0; white-space: nowrap; transform-origin: 0 0;
    transition: transform 1.1s cubic-bezier(.65, 0, .25, 1), opacity 0.9s, color 0.9s;
    will-change: transform, opacity;
  }
  .word.hour { color: var(--accent); }
  .word.leaving { opacity: 0; }
  .word.entering { opacity: 0; }
  .dots { position: fixed; left: 50%; bottom: 5vh; transform: translateX(-50%); display: flex; gap: 1.6vmin; }
  .dots i { width: 1.4vmin; height: 1.4vmin; border-radius: 50%; background: var(--fg); opacity: 0.12;
            transition: opacity 0.6s; }
  .dots i.on { opacity: 0.9; }
  @media (prefers-reduced-motion: reduce) { .word { transition-duration: 0.01s; } }
</style>
<link rel="stylesheet" href="/ordklocka/tillganglighet.css"></head>
<body>
<div class="measure" id="measure" aria-hidden="true"></div>
<div class="words" id="words" aria-hidden="true"></div>
<div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>

<div class="panel">
  <div class="readout" id="readout" aria-live="polite"></div>
  <div class="controls">
    <div class="group" role="group" aria-label="Uttryck för :20 och :40">
      <span class="label">20 / 40</span>
      <button data-style="tjugo">tjugo över</button>
      <button data-style="halv">tio i halv</button>
    </div>
    <div class="group" role="group" aria-label="Färger">
      <span class="label">Tema</span>
      <button data-theme="mörk">mörk</button>
      <button data-theme="ljus">ljus</button>
    </div>
    <div class="group"><button id="fs" aria-pressed="false">helskärm</button></div>
  </div>
</div>

<script src="/ordklocka/tid.js"></script>
<script src="/ordklocka/sida.js"></script>
<script>
  const S = OrdklockaSida;
  const measure = document.getElementById("measure");
  const stage = document.getElementById("words");
  const dots = [...document.querySelectorAll(".dots i")];
  let shown = [];     // [{text, el, hour}]
  let current = [];   // orden som ska visas: [{text, hour}]

  // Största teckenstorlek där orden ryms på ~88 % x 78 % av skärmen.
  function layout(words) {
    const W = innerWidth * 0.88, H = innerHeight * 0.78;
    measure.style.width = W + "px";
    measure.style.height = "auto";
    measure.textContent = "";
    const spans = words.map(w => {
      const s = document.createElement("span");
      s.textContent = w.text;
      measure.appendChild(s);
      return s;
    });
    let lo = 10, hi = innerHeight * 0.6;
    for (let i = 0; i < 18; i++) {
      const mid = (lo + hi) / 2;
      measure.style.fontSize = mid + "px";
      const fits = measure.scrollHeight <= H && spans.every(s => s.offsetWidth <= W);
      if (fits) lo = mid; else hi = mid;
    }
    measure.style.fontSize = lo + "px";
    const box = measure.getBoundingClientRect();
    const offX = (innerWidth - W) / 2, offY = (innerHeight - box.height) / 2 - innerHeight * 0.02;
    return { size: lo, pos: spans.map(s => ({ x: offX + s.offsetLeft, y: offY + s.offsetTop })) };
  }

  // Flyttar kvarvarande ord mjukt till sina nya platser, tonar ut de som
  // försvinner och tonar in de nya.
  function arrange() {
    const { size, pos } = layout(current);
    const left = [...shown];
    const next = current.map((w, i) => {
      const j = left.findIndex(s => s.text === w.text);
      let item;
      if (j >= 0) {
        item = left.splice(j, 1)[0];
      } else {
        const el = document.createElement("span");
        el.className = "word entering";
        el.textContent = w.text;
        stage.appendChild(el);
        item = { text: w.text, el, fresh: true };
      }
      item.el.classList.toggle("hour", w.hour);
      const scale = size / 100;
      const tf = `translate(${pos[i].x}px, ${pos[i].y}px) scale(${scale})`;
      if (item.fresh) {
        item.el.style.transition = "none";
        item.el.style.transform = `translate(${pos[i].x}px, ${pos[i].y + size * 0.25}px) scale(${scale})`;
        void item.el.offsetWidth;
        item.el.style.transition = "";
        item.fresh = false;
        requestAnimationFrame(() => {
          item.el.classList.remove("entering");
          item.el.style.transform = tf;
        });
      } else {
        item.el.style.transform = tf;
      }
      return item;
    });
    for (const old of left) {
      old.el.classList.add("leaving");
      old.el.style.transform += ` translateY(-25px)`;
      setTimeout(() => old.el.remove(), 1000);
    }
    shown = next;
  }

  // Orden ritas i 100 px och skalas, så att storleken kan glida mjukt.
  const style = document.createElement("style");
  style.textContent = ".word { font-size: 100px; }";
  document.head.appendChild(style);

  const clock = S.clock((t, info) => {
    dots.forEach((d, i) => d.classList.toggle("on", i < t.extra));
    if (!info.wordsChanged) return;
    const words = OrdklockaTid.spokenWords(t).map(w => w.toLowerCase());
    // Timordet är sista ordet i vanlig läsning och första i digital.
    const hourIndex = t.digital ? 0 : words.length - 1;
    current = words.map((text, i) => ({ text, hour: i === hourIndex }));
    arrange();
  });
  S.choice("style", "ordklocka-style", "tjugo", v => clock.setStyle(v));
  S.choice("theme", "ordklocka-typografi-tema", "mörk", v => { document.documentElement.dataset.theme = v; });
  let resizeTimer;
  addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(arrange, 150); });
  S.setup("/ordklocka/typografi/ws");
</script>
<script src="/ordklocka/meny.js"></script>
</body>
</html>
