<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordklocka Stadsbyggare</title>
<style>
  /* Stadsbyggarklockan: en enklare galleriklocka, ritad av galleri-render.js. */
  :root { --bg:#0e2230;
          --ink:#e9d6b1;
          --panel-bg:#0e2230ee;
          --panel-fg:#e9d6b1;
          --panel-accent:#e9d6b1;
          --panel-bg-solid:#0e2230; }
</style>
<link rel="stylesheet" href="/ordklocka/galleri-stil.css">
<link rel="stylesheet" href="/ordklocka/tillganglighet.css"></head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<main id="scene">
  <div id="grid" aria-hidden="true"></div>
  <div id="phrase" aria-hidden="true"></div>
  <div id="sub" aria-hidden="true"></div>
  <div id="dots" aria-hidden="true"></div>
</main>

<div class="panel">
  <div class="readout" id="readout" aria-live="polite"></div>
  <div class="controls">
    <div class="group" role="group" aria-label="Uttryck för :20 och :40">
      <span class="label">20 / 40</span>
      <button data-style="tjugo">tjugo över</button>
      <button data-style="halv">tio i halv</button>
    </div>
    <div class="group" role="group" aria-label="Ljus">
      <span class="label">Ljus</span>
      <button data-mode="dag">dag</button>
      <button data-mode="natt">natt</button>
    </div>
    <div class="group"><button id="fs" aria-pressed="false">helskärm</button></div>
  </div>
</div>

<script src="/ordklocka/tid.js"></script>
<script src="/ordklocka/sida.js"></script>
<script src="/ordklocka/dygn.js"></script>
<script>
  // Utseendet: effekt (se galleri-stil.css / galleri-render.js) och färg.
  window.CLOCK_DESIGN = {"slug": "stad", "mode": "city", "ink": "#e9d6b1"};
</script>
<script src="/ordklocka/galleri-render.js"></script>
<script src="/ordklocka/meny.js"></script>
</body>
</html>
