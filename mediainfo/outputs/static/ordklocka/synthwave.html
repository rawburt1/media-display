<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordklocka Synthwave</title>
<style>
  :root {
    --pink: #ff3fb4; --cyan: #2de2e6; --purple: #7b2ff7;
    --panel-bg: rgba(20, 6, 36, 0.9); --panel-fg: #f7e8ff; --panel-accent: #2de2e6; --panel-bg-solid: #140624;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0221; }
  .sky { position: fixed; inset: 0 0 38vh 0;
         background: linear-gradient(180deg, #0d0221 0%, #261447 45%, #6a1b6f 80%, #ff3fb4 100%); }
  /* Stjärnor */
  .sky::before { content: ""; position: absolute; inset: 0;
                 background-image: radial-gradient(1px 1px at 12% 18%, #fff, transparent), radial-gradient(1px 1px at 33% 8%, #fff, transparent),
                   radial-gradient(1.5px 1.5px at 58% 22%, #fff, transparent), radial-gradient(1px 1px at 76% 12%, #fff, transparent),
                   radial-gradient(1px 1px at 88% 30%, #fff, transparent), radial-gradient(1px 1px at 22% 35%, #fff, transparent),
                   radial-gradient(1px 1px at 47% 4%, #fff, transparent), radial-gradient(1.5px 1.5px at 66% 38%, #fff, transparent);
                 opacity: 0.7; }
  /* Solen med ränder */
  .sun { position: fixed; left: 50%; bottom: 38vh; width: 46vmin; height: 46vmin; transform: translate(-50%, 50%);
         border-radius: 50%; background: linear-gradient(180deg, #ffe66d 0%, #ff9a3c 40%, #ff3fb4 75%);
         -webkit-mask: linear-gradient(180deg, #000 0 52%, transparent 52% 56%, #000 56% 63%, transparent 63% 68%, #000 68% 74%, transparent 74% 80%, #000 80% 85%, transparent 85% 91%, #000 91%);
                 mask: linear-gradient(180deg, #000 0 52%, transparent 52% 56%, #000 56% 63%, transparent 63% 68%, #000 68% 74%, transparent 74% 80%, #000 80% 85%, transparent 85% 91%, #000 91%);
         filter: drop-shadow(0 0 4vmin rgba(255, 63, 180, 0.6)); }
  /* Rutnätsgolvet som rör sig mot betraktaren */
  .floor { position: fixed; left: 0; right: 0; bottom: 0; height: 38vh; overflow: hidden;
           background: linear-gradient(180deg, #2a0845 0%, #0d0221 100%); }
  /* Golvet lutar bort mot horisonten: nederkanten närmast betraktaren */
  .floor::before { content: ""; position: absolute; left: -100%; right: -100%; bottom: 0; height: 900%;
                   transform-origin: 50% 100%; transform: perspective(82vh) rotateX(62deg);
                   -webkit-mask: linear-gradient(to top, #000 0%, #000 55%, transparent 100%);
                           mask: linear-gradient(to top, #000 0%, #000 55%, transparent 100%);
                   background:
                     linear-gradient(90deg, var(--pink) 3px, transparent 3px) 0 0 / 12vh 100%,
                     linear-gradient(180deg, var(--pink) 3px, transparent 3px) 0 0 / 100% 12vh;
                   animation: drive 1.6s linear infinite; opacity: 0.85;
                   filter: drop-shadow(0 0 0.6vh var(--pink)); }
  @keyframes drive { to { background-position: 0 0, 0 12vh; } }
  .horizon { position: fixed; left: 0; right: 0; bottom: 38vh; height: 2px; background: var(--pink); box-shadow: 0 0 2vh var(--pink); }
  .title { position: fixed; left: 0; right: 0; top: 8vh; text-align: center; transform: rotate(-4deg);
           font: italic 700 8vmin/1 "Brush Script MT", "Segoe Script", "URW Chancery L", cursive; color: var(--pink);
           text-shadow: 0 0 0.1em #fff, 0 0 0.3em var(--pink), 0 0 0.8em var(--pink); }
  .time { position: fixed; left: 0; right: 0; top: 24vh; text-align: center; }
  .time .line {
    display: block; font: italic 900 13vmin/1 "Arial Black", "Helvetica Neue", "DejaVu Sans", sans-serif; letter-spacing: 0.02em;
    text-transform: uppercase; white-space: nowrap;
    background: linear-gradient(180deg, #e8fbff 0%, #8ff6ff 40%, #1b8aa6 52%, #f3c4ff 56%, #ff8ad8 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 0.012em rgba(255, 255, 255, 0.6);
    filter: drop-shadow(0 0 0.06em var(--cyan)) drop-shadow(0.04em 0.05em 0 var(--purple));
    transition: opacity 0.6s, transform 0.6s;
  }
  .time.swap .line { opacity: 0; transform: skewX(-20deg) translateX(-4vw); }
  .dots { position: fixed; left: 50%; bottom: 42vh; transform: translateX(-50%); display: flex; gap: 2vmin; }
  .dots i { width: 1.4vmin; height: 1.4vmin; transform: skewX(-15deg); background: rgba(45, 226, 230, 0.2); }
  .dots i.on { background: var(--cyan); box-shadow: 0 0 1vmin var(--cyan); }
  .scan { position: fixed; inset: 0; pointer-events: none; background: repeating-linear-gradient(transparent 0 2px, rgba(0, 0, 0, 0.12) 2px 3px); }
  @media (prefers-reduced-motion: reduce) { .floor::before { animation: none; } }
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<div class="sun" aria-hidden="true"></div>
<div class="horizon" aria-hidden="true"></div>
<div class="floor" aria-hidden="true"></div>
<div class="title" aria-hidden="true">Klockan är</div>
<div class="time" id="time" aria-hidden="true"></div>
<div class="dots" id="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="scan" aria-hidden="true"></div>

<div class="panel">
  <div class="readout" id="readout" aria-live="polite"></div>
  <div class="controls">
    <div class="group" role="group" aria-label="Uttryck för :20 och :40">
      <span class="label">20 / 40</span>
      <button data-style="tjugo">tjugo över</button>
      <button data-style="halv">tio i halv</button>
    </div>
    <div class="group"><button id="fs" aria-pressed="false">helskärm</button></div>
  </div>
</div>

<script src="/ordklocka/tid.js"></script>
<script src="/ordklocka/sida.js"></script>
<script>
  const S = OrdklockaSida;
  const timeEl = document.getElementById("time");
  const dots = [...document.querySelectorAll("#dots i")];
  let lines = [];

  function draw() {
    timeEl.textContent = "";
    for (const l of lines) {
      const el = document.createElement("span");
      el.className = "line";
      el.textContent = l;
      timeEl.appendChild(el);
      el.style.fontSize = "";
      const max = innerWidth * 0.9;
      if (el.scrollWidth > max) el.style.fontSize = parseFloat(getComputedStyle(el).fontSize) * max / el.scrollWidth + "px";
    }
  }

  const clock = S.clock((t, info) => {
    dots.forEach((d, i) => d.classList.toggle("on", i < t.extra));
    if (!info.wordsChanged) return;
    lines = S.lines(t);
    if (info.first) { draw(); return; }
    timeEl.classList.add("swap");
    setTimeout(() => { draw(); timeEl.classList.remove("swap"); }, 600);
  });
  S.choice("style", "ordklocka-style", "tjugo", v => clock.setStyle(v));
  addEventListener("resize", draw);
  S.setup("/ordklocka/synthwave/ws");
</script>
<script src="/ordklocka/meny.js"></script>
</body>
</html>
