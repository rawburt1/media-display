<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordklocka Timglas</title>
<style>
  :root { --panel-bg: rgba(20, 14, 10, 0.9); --panel-fg: #f3e6cf; --panel-accent: #e0b36a; --panel-bg-solid: #140e0a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: radial-gradient(ellipse at 50% 45%, #3b2c20, #100b07 75%); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>

<div class="panel">
  <div class="readout" id="readout" aria-live="polite"></div>
  <div class="controls">
    <div class="group" role="group" aria-label="Uttryck för :20 och :40">
      <span class="label">20 / 40</span>
      <button data-style="tjugo">tjugo över</button>
      <button data-style="halv">tio i halv</button>
    </div>
    <div class="group"><button id="fs" aria-pressed="false">helskärm</button></div>
  </div>
</div>

<script src="/ordklocka/tid.js"></script>
<script src="/ordklocka/sida.js"></script>
<script src="/ordklocka/textmask.js"></script>
<script>
  const S = OrdklockaSida;
  // Ett stort timglas som går fem minuter. Sanden rinner ned genom halsen,
  // och i den nedre kolven bildar sandkornen de aktuella tidsorden - först
  // som en svag kontur, sedan allt tätare. Vid varje nytt uttryck vänds
  // timglaset och allt börjar om.
  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  let W, H, dpr, cx, yTop, neck, yBot, maxW, grains = [], header = [], lines = [], flipAt = -1e9, falling = [];
  const FLIP_MS = 1500;

  // Kolvens halva bredd på höjden y
  // Kolvens halva bredd på höjden y: rundad axel nära locket, smal hals i mitten.
  function half(y) {
    const p = y < neck ? (y - yTop) / (neck - yTop) : (yBot - y) / (yBot - neck);   // 0 vid locket, 1 vid halsen
    const k = Math.max(0, Math.min(1, p));
    const w = k < 0.3 ? 0.78 + 0.22 * Math.sin(k / 0.3 * Math.PI / 2) : Math.sqrt(Math.max(0, 1 - ((k - 0.3) / 0.7) ** 2));
    return maxW * (0.025 + 0.975 * w);
  }

  function build() {
    dpr = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = W / 2; yTop = H * 0.07; yBot = H * 0.93; neck = (yTop + yBot) / 2;
    maxW = Math.min(W * 0.44, H * 0.75);
    if (lines.length) sow();
  }

  // Sandkornen som bildar orden i nedre kolven
  function sow() {
    const boxW = maxW * 1.5, boxH = (yBot - neck) * 0.68;
    const m = OrdklockaMask.mask(lines, boxW, boxH, { pad: 0.02, lineHeight: 1.08, family: '"Georgia", "DejaVu Serif", serif', weight: 700 });
    const step = Math.max(2.5, Math.min(W, H) / 260);
    grains = OrdklockaMask.points(m, step).map(([x, y]) => ({
      x: cx - boxW / 2 + x + (Math.random() - 0.5) * step * 0.6, y: neck + (yBot - neck) * 0.24 + y + (Math.random() - 0.5) * step * 0.6,
      r: Math.random(), size: step * (0.45 + Math.random() * 0.35), tone: Math.random(),
    }));
  }

  function outline() {
    ctx.beginPath();
    for (let y = yTop; y <= yBot; y += 2) ctx.lineTo(cx + half(y), y);
    for (let y = yBot; y >= yTop; y -= 2) ctx.lineTo(cx - half(y), y);
    ctx.closePath();
  }

  function sandColor(tone, a = 1) { return `rgba(${226 - tone * 30}, ${186 - tone * 30}, ${122 - tone * 25}, ${a})`; }

  function frame(t) {
    const now = new Date();
    const f = ((now.getMinutes() % 5) * 60 + now.getSeconds() + now.getMilliseconds() / 1000) / 300;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    // Vändningen
    const flipK = Math.min(1, (t - flipAt) / FLIP_MS);
    ctx.save();
    if (flipK < 1) { ctx.translate(cx, H / 2); ctx.rotate(Math.PI * (1 - (flipK * flipK * (3 - 2 * flipK)))); ctx.translate(-cx, -H / 2); }

    // Glaset
    outline();
    ctx.fillStyle = "rgba(255, 245, 225, 0.05)"; ctx.fill();
    ctx.save(); outline(); ctx.clip();
    // Övre kolvens sand: sjunker från toppen mot halsen
    const level = neck - (neck - yTop) * 0.82 * (1 - f);
    ctx.fillStyle = sandColor(0.3);
    ctx.beginPath(); ctx.moveTo(cx - maxW, level);
    ctx.quadraticCurveTo(cx, level + (neck - level) * 0.25, cx + maxW, level);
    ctx.lineTo(cx + maxW, neck); ctx.lineTo(cx - maxW, neck); ctx.fill();
    // Strålen genom halsen och kornen som faller
    if (f < 0.995 && flipK >= 1) {
      ctx.strokeStyle = sandColor(0.2, 0.85); ctx.lineWidth = Math.max(1.5, maxW * 0.012);
      ctx.beginPath(); ctx.moveTo(cx, neck - 4); ctx.lineTo(cx, yBot - (yBot - neck) * 0.05 * f - 6); ctx.stroke();
      if (Math.random() < 0.8) falling.push({ x: cx + (Math.random() - 0.5) * 3, y: neck, v: 2 + Math.random() * 2 });
    }
    falling = falling.filter(g => (g.y += g.v, g.v += 0.25, g.y < yBot - 8));
    ctx.fillStyle = sandColor(0.1);
    for (const g of falling) ctx.fillRect(g.x, g.y, 1.6, 1.6);
    // Högen i botten
    const pileH = (yBot - neck) * 0.1 * Math.min(1, f * 1.4 + 0.05);
    ctx.fillStyle = sandColor(0.35);
    ctx.beginPath(); ctx.moveTo(cx - maxW, yBot);
    ctx.quadraticCurveTo(cx, yBot - pileH * 2.2, cx + maxW, yBot); ctx.fill();
    // Orden av sandkorn: alltid en svag kontur, kornen fylls på med tiden
    const fill = 0.28 + f * 2.4;
    for (const g of grains) {
      const on = g.r < fill;
      ctx.fillStyle = on ? sandColor(g.tone, 0.95) : sandColor(g.tone, 0.13);
      ctx.fillRect(g.x, g.y, g.size, g.size);
    }
    ctx.restore();
    // Glasets reflexer och kontur
    ctx.save(); outline();
    ctx.strokeStyle = "rgba(255, 240, 210, 0.35)"; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
    ctx.strokeStyle = "rgba(255,255,255,0.12)"; ctx.lineWidth = maxW * 0.03;
    ctx.beginPath(); ctx.moveTo(cx - maxW * 0.72, yTop + (neck - yTop) * 0.2); ctx.quadraticCurveTo(cx - maxW * 0.85, (yTop + neck) / 2, cx - maxW * 0.35, neck - (neck - yTop) * 0.15); ctx.stroke();
    // Trälock med text
    for (const [y, label] of [[yTop, "KLOCKAN ÄR"], [yBot, ""]]) {
      const lw = maxW * 2.25, lh = H * 0.05;
      const g = ctx.createLinearGradient(0, y - lh / 2, 0, y + lh / 2);
      g.addColorStop(0, "#7a4f2a"); g.addColorStop(0.5, "#5a3518"); g.addColorStop(1, "#3a210e");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.roundRect(cx - lw / 2, y - lh / 2, lw, lh, lh * 0.3); ctx.fill();
      if (label) {
        ctx.fillStyle = "#e0b36a"; ctx.font = `700 ${lh * 0.5}px "Georgia", "DejaVu Serif", serif`;
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.save(); ctx.translate(cx, y); if (flipK < 1 && flipK < 0.5) ctx.rotate(Math.PI); ctx.fillText(label.split("").join(" "), 0, 1); ctx.restore();
      }
    }
    ctx.restore();
    requestAnimationFrame(frame);
  }

  const clock = S.clock((t, info) => {
    if (!info.wordsChanged) return;
    lines = S.lines(t).map(l => l.toLowerCase());
    if (!W) return;
    sow();
    if (!info.first && !matchMedia("(prefers-reduced-motion: reduce)").matches) { flipAt = performance.now(); falling = []; }
  });
  S.choice("style", "ordklocka-style", "tjugo", v => clock.setStyle(v));
  addEventListener("resize", build);
  build();
  requestAnimationFrame(frame);
  S.setup("/ordklocka/timglas/ws");
</script>
<script src="/ordklocka/meny.js"></script>
</body>
</html>
