<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordklocka Voronoi</title>
<style>
  :root { --panel-bg: rgba(12, 16, 22, 0.92); --panel-fg: #e8f0f8; --panel-accent: #7ee0c3; --panel-bg-solid: #0c1016; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c1016; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>

<div class="panel">
  <div class="readout" id="readout" aria-live="polite"></div>
  <div class="controls">
    <div class="group" role="group" aria-label="Uttryck för :20 och :40">
      <span class="label">20 / 40</span>
      <button data-style="tjugo">tjugo över</button>
      <button data-style="halv">tio i halv</button>
    </div>
    <div class="group"><button id="fs" aria-pressed="false">helskärm</button></div>
  </div>
</div>

<script src="/ordklocka/tid.js"></script>
<script src="/ordklocka/sida.js"></script>
<script src="/ordklocka/textmask.js"></script>
<script>
  const S = OrdklockaSida;
  // Voronoiceller: varje pixel tillhör den närmaste fröpunkten. Fröna
  // vandrar långsamt och varje cell andas (växer och krymper). Cellerna vars
  // frö ligger i texten färgas ljust och ser upphöjda ut.
  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  const RES = 2.5;
  let w, h, img, step, cols, rows, seeds = [], lines = [];

  function build() {
    w = Math.ceil(innerWidth / RES); h = Math.ceil(innerHeight / RES);
    cv.width = w; cv.height = h;
    img = ctx.createImageData(w, h);
    step = Math.max(4, Math.min(w, h) / 62);
    cols = Math.ceil(w / step) + 1; rows = Math.ceil(h / step) + 1;
    const prev = seeds;
    seeds = [];
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const old = prev[r * cols + c];
      seeds.push({
        bx: (c + 0.5) * step, by: (r + 0.5) * step, x: 0, y: 0,
        ph: Math.random() * 6.28, sp: 0.2 + Math.random() * 0.3, hue: Math.random(),
        on: old ? old.on : 0, want: old ? old.want : 0, delay: 0,
      });
    }
    if (lines.length) light(false);
  }

  function light(animate) {
    const m = OrdklockaMask.mask(["KLOCKAN ÄR", ...lines], w, h, { pad: 0.07, lineHeight: 1.1 });
    const now = performance.now();
    for (const s of seeds) {
      const want = m.at(s.bx, s.by) > 0.5 ? 1 : 0;
      if (want !== s.want) { s.want = want; s.delay = animate ? now + Math.random() * 1500 : 0; }
    }
  }

  function frame(t) {
    const T = t / 1000;
    for (const s of seeds) {
      s.x = s.bx + Math.sin(T * s.sp + s.ph) * step * 0.3;
      s.y = s.by + Math.cos(T * s.sp * 0.8 + s.ph * 1.3) * step * 0.3;
      s.wt = Math.sin(T * 0.6 + s.ph) * step * step * 0.12;     // vikt: cellen andas
      if (t >= s.delay) s.on += (s.want - s.on) * 0.06;
    }
    const d = img.data;
    for (let y = 0; y < h; y++) {
      const r0 = Math.floor(y / step);
      for (let x = 0; x < w; x++) {
        const c0 = Math.floor(x / step);
        let best = 1e18, second = 1e18, bs = null;
        for (let dr = -1; dr <= 1; dr++) {
          const r = r0 + dr; if (r < 0 || r >= rows) continue;
          for (let dc = -1; dc <= 1; dc++) {
            const c = c0 + dc; if (c < 0 || c >= cols) continue;
            const s = seeds[r * cols + c];
            const dx = x - s.x, dy = y - s.y;
            const dd = dx * dx + dy * dy - s.wt;
            if (dd < best) { second = best; best = dd; bs = s; } else if (dd < second) second = dd;
          }
        }
        const k = (y * w + x) * 4;
        const edge = Math.min(1, (Math.sqrt(Math.max(0, second)) - Math.sqrt(Math.max(0, best))) / 1.2);
        const on = bs.on;
        // Upphöjd: ljusare mot cellens överkant (ljuset uppifrån)
        const lift = 1 + on * 0.18 * Math.max(-1, Math.min(1, (bs.y - y) / step * 1.4));
        const base = [22 + bs.hue * 16, 34 + bs.hue * 22, 50 + bs.hue * 30];
        const lit = [150 + bs.hue * 40, 240 - bs.hue * 20, 205 - bs.hue * 30];
        const f = edge * (0.75 + 0.25 * Math.sin(T * 0.6 + bs.ph));
        d[k] = (base[0] + (lit[0] - base[0]) * on) * f * lift;
        d[k + 1] = (base[1] + (lit[1] - base[1]) * on) * f * lift;
        d[k + 2] = (base[2] + (lit[2] - base[2]) * on) * f * lift;
        d[k + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    requestAnimationFrame(frame);
  }

  const clock = S.clock((t, info) => {
    if (!info.wordsChanged) return;
    lines = S.lines(t);
    if (w) light(!info.first);
  });
  S.choice("style", "ordklocka-style", "tjugo", v => clock.setStyle(v));
  addEventListener("resize", build);
  build();
  requestAnimationFrame(frame);
  S.setup("/ordklocka/voronoi/ws");
</script>
<script src="/ordklocka/meny.js"></script>
</body>
</html>
