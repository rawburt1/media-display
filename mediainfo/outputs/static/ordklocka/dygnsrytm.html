<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordklocka Dygnsrytm</title>
<style>
  :root {
    --top: #0b1530; --bottom: #1c2c55; --fg: #eef2ff; --soft: rgba(238, 242, 255, 0.55);
    --panel-bg: rgba(0, 0, 0, 0.35); --panel-fg: #fff; --panel-accent: #fff; --panel-bg-solid: #222;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: linear-gradient(180deg, var(--top), var(--bottom)); color: var(--fg);
         font-family: "Avenir Next", "Helvetica Neue", "DejaVu Sans", system-ui, sans-serif;
         transition: background 60s linear, color 60s linear; }
  .orb { position: fixed; width: 14vmin; height: 14vmin; margin: -7vmin 0 0 -7vmin; border-radius: 50%; transition: left 60s linear, top 60s linear, background 60s, box-shadow 60s; }
  .center { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .phase { font-size: 4vmin; letter-spacing: 0.5em; text-transform: uppercase; color: var(--soft); margin-bottom: 3vmin; }
  .time { font-size: min(17vmin, 13vw); font-weight: 500; line-height: 1.1; max-width: 90vw; transition: opacity 1.2s; }
  .time.fade { opacity: 0; }
  .phases { position: fixed; left: 0; right: 0; bottom: 9vh; display: flex; justify-content: center; gap: 4vmin; flex-wrap: wrap;
            font-size: 2.3vmin; letter-spacing: 0.2em; text-transform: uppercase; }
  .phases span { color: var(--soft); opacity: 0.6; transition: opacity 1s; }
  .phases span.now { opacity: 1; color: var(--fg); border-bottom: 0.3vmin solid currentColor; padding-bottom: 0.6vmin; }
  .dots { display: flex; gap: 1.8vmin; margin-top: 3vmin; }
  .dots i { width: 1.2vmin; height: 1.2vmin; border-radius: 50%; background: var(--soft); opacity: 0.35; }
  .dots i.on { opacity: 1; background: var(--fg); }
</style>
</head>
<body>
<div class="orb" id="orb" aria-hidden="true"></div>
<div class="center" aria-hidden="true">
  <div class="phase" id="phase"></div>
  <div class="time" id="time"></div>
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
</div>
<div class="phases" id="phases" aria-hidden="true"></div>

<div class="panel">
  <div class="readout" id="readout" aria-live="polite"></div>
  <div class="controls">
    <div class="group" role="group" aria-label="Uttryck för :20 och :40">
      <span class="label">20 / 40</span>
      <button data-style="tjugo">tjugo över</button>
      <button data-style="halv">tio i halv</button>
    </div>
    <div class="group"><button id="fs" aria-pressed="false">helskärm</button></div>
  </div>
</div>

<script src="/ordklocka/tid.js"></script>
<script src="/ordklocka/sida.js"></script>
<script src="/ordklocka/dygn.js"></script>
<script>
  const S = OrdklockaSida;
  const D = OrdklockaDygn;
  const root = document.documentElement.style;
  const timeEl = document.getElementById("time");
  const dots = [...document.querySelectorAll("#dots i")];
  const phases = D.PARTS.map(p => {
    const s = document.createElement("span");
    s.textContent = p.name;
    document.getElementById("phases").appendChild(s);
    return [p, s];
  });

  // Himlens färger över dygnet: [timme, upptill, nedtill, text]
  const SKY = [
    [0, "#060b1d", "#101a38", "#dfe6ff"],
    [4.5, "#0b1530", "#2a2a55", "#e6e8ff"],
    [6, "#3a3b6e", "#f29e7a", "#fff6ee"],
    [7.5, "#f7b58a", "#fde7c5", "#3b2a20"],
    [10, "#9fd0f0", "#e8f4fb", "#1d3346"],
    [13, "#7fc2ec", "#dff0fb", "#16304a"],
    [16.5, "#f3c58f", "#fbe6c7", "#3c2a18"],
    [18.5, "#e2725b", "#f6b36b", "#fff1e6"],
    [20, "#4a2f6b", "#c0607a", "#fbeaf2"],
    [22, "#141a3c", "#2b2350", "#e3e2ff"],
    [24, "#060b1d", "#101a38", "#dfe6ff"],
  ];
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, f) => { const x = hex(a), y = hex(b); return `rgb(${x.map((v, i) => Math.round(v + (y[i] - v) * f)).join(",")})`; };

  function sky(now) {
    const h = now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600;
    const k = SKY.findIndex(x => x[0] > h);
    const [h0, ...a] = SKY[k - 1], [h1, ...b] = SKY[k];
    const f = (h - h0) / (h1 - h0);
    const [top, bottom, fg] = a.map((c, i) => mix(c, b[i], f));
    root.setProperty("--top", top); root.setProperty("--bottom", bottom); root.setProperty("--fg", fg);
    const [r, g, bl] = fg.match(/\d+/g);
    root.setProperty("--soft", `rgba(${r},${g},${bl},0.6)`);
    root.setProperty("--panel-fg", fg);
    // Solen dagtid, månen nattetid, i en båge över himlen
    const day = h >= 6 && h < 18;
    const p = day ? (h - 6) / 12 : ((h + 6) % 24) / 12;
    const orb = document.getElementById("orb");
    orb.style.left = 10 + p * 80 + "vw";
    orb.style.top = 70 - Math.sin(p * Math.PI) * 55 + "vh";
    orb.style.background = day ? "radial-gradient(circle, #fff9e0 0%, #ffd66b 60%, #ffb347 100%)"
                               : "radial-gradient(circle at 35% 35%, #fbfbff 0%, #d6dcf0 60%, #9aa6c6 100%)";
    orb.style.boxShadow = day ? "0 0 8vmin rgba(255, 200, 90, 0.8), 0 0 24vmin rgba(255, 180, 70, 0.4)"
                              : "0 0 6vmin rgba(200, 215, 255, 0.5)";
  }

  const clock = S.clock((t, info) => {
    sky(info.now);
    const part = D.part(info.now.getHours());
    document.getElementById("phase").textContent = part.the;
    phases.forEach(([p, s]) => s.classList.toggle("now", p === part));
    dots.forEach((d, i) => d.classList.toggle("on", i < t.extra));
    if (!info.wordsChanged) return;
    const text = S.lines(t).join(" ").toLowerCase();
    if (info.first) { timeEl.textContent = text; return; }
    timeEl.classList.add("fade");
    setTimeout(() => { timeEl.textContent = text; timeEl.classList.remove("fade"); }, 1200);
  });
  S.choice("style", "ordklocka-style", "tjugo", v => clock.setStyle(v));
  S.setup("/ordklocka/dygnsrytm/ws");
</script>
<script src="/ordklocka/meny.js"></script>
</body>
</html>
