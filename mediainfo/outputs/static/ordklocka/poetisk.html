<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordklocka Poetisk</title>
<style>
  :root {
    --bg1: #1b1f2e; --bg2: #0c0e16; --fg: #ece4d6;
    --panel-bg: rgba(16, 16, 22, 0.88); --panel-fg: #ece4d6; --panel-accent: #ece4d6; --panel-bg-solid: #101016;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: radial-gradient(ellipse at 50% 35%, var(--bg1), var(--bg2) 75%); color: var(--fg);
         display: grid; place-items: center; transition: background 6s, color 6s; }
  .verse { position: relative; display: grid; width: min(84vw, 140vh); text-align: center; }
  .line { grid-area: 1 / 1; font: italic 300 7.4vmin/1.3 "Cormorant Garamond", "EB Garamond", "Garamond", "Georgia", "DejaVu Serif", serif;
          transition: opacity 2.4s ease, filter 2.4s ease, transform 2.4s ease; }
  .line.out { opacity: 0; filter: blur(8px); transform: translateY(-2vmin); }
  .line.in { opacity: 0; filter: blur(8px); transform: translateY(2vmin); }
  .sign { margin-top: 5vmin; font: 400 2.2vmin/1 "Georgia", serif; letter-spacing: 0.4em; text-transform: uppercase; opacity: 0.45; }
  @media (prefers-reduced-motion: reduce) { .line { transition: opacity 0.5s; } }
</style>
</head>
<body>
<div style="text-align:center">
  <div class="verse" id="verse" aria-hidden="true"></div>
  <div class="sign" id="sign" aria-hidden="true"></div>
</div>

<div class="panel">
  <div class="readout" id="readout" aria-live="polite"></div>
  <div class="controls">
    <div class="group" role="group" aria-label="Uttryck för :20 och :40">
      <span class="label">20 / 40</span>
      <button data-style="tjugo">tjugo över</button>
      <button data-style="halv">tio i halv</button>
    </div>
    <div class="group"><button id="fs" aria-pressed="false">helskärm</button></div>
  </div>
</div>

<script src="/ordklocka/tid.js"></script>
<script src="/ordklocka/sida.js"></script>
<script src="/ordklocka/dygn.js"></script>
<script>
  const S = OrdklockaSida;
  const D = OrdklockaDygn;
  const verse = document.getElementById("verse");
  let style = "tjugo";

  const HOURS = ["tolv", "ett", "två", "tre", "fyra", "fem", "sex", "sju", "åtta", "nio", "tio", "elva"];
  const cap = s => s[0].toUpperCase() + s.slice(1);
  // Stämning för varje del av dygnet
  const MOOD = {
    natt: ["i nattens stillhet", "medan staden sover", "under stjärnorna"],
    morgon: ["i morgonljuset", "medan dagen vaknar", "i gryningens svala luft"],
    formiddag: ["en bit in på förmiddagen", "i förmiddagens klara ljus", "medan dagen tar fart"],
    middag: ["mitt på dagen", "när solen står som högst", "i middagens ljus"],
    eftermiddag: ["i eftermiddagens lugn", "medan skuggorna växer", "en bit in på eftermiddagen"],
    kvall: ["i kvällens skymning", "medan ljusen tänds", "när dagen lägger sig"],
  };
  // Samma formulering hela timmen (ingen slumpvis växling varje minut)
  const pick = (list, h) => list[(h * 7 + 3) % list.length];

  // Poetisk läsning, exempel:
  //   09:03 "Morgonen har just passerat nio"   23:52 "Midnatten närmar sig"
  //   15:28 "Snart halv fyra, i eftermiddagens lugn"
  function poem(now) {
    const h = now.getHours(), m = now.getMinutes();
    const part = D.part(h);
    const mood = pick(MOOD[part.key], h);
    const next = (h + 1) % 24;
    if ((h === 23 && m >= 45) || (h === 0 && m === 0)) return m === 0 ? "Midnatten är här" : "Midnatten närmar sig";
    if (h === 0 && m < 15) return "Midnatten har just passerat";
    if (h === 11 && m >= 50) return "Middagen närmar sig";
    if (h === 12 && m < 8) return "Klockan har just slagit tolv";
    if (m === 0) return `Klockan slår ${HOURS[h % 12]}, ${mood}`;
    if (m < 8) return `${cap(part.the)} har just passerat ${HOURS[h % 12]}`;
    if (m >= 53) return `${cap(D.part(next).the)} närmar sig ${HOURS[next % 12]}`;
    // Annars: närmaste femminutersmark, med snart / strax efter
    const r = m % 5;
    let m5 = m - r, hh = h;
    if (r > 2) { m5 += 5; if (m5 === 60) { m5 = 0; hh = next; } }
    const when = r === 0 ? "" : r <= 2 ? "strax efter " : "snart ";
    const t = OrdklockaTid.spokenTime(hh % 12, m5, style);
    const words = OrdklockaTid.spokenWords(t).join(" ").toLowerCase();
    return cap(`${when}${words}, ${mood}`);
  }

  let last = "";
  function show() {
    const now = new Date();
    const text = poem(now);
    document.getElementById("readout").textContent = text;
    document.getElementById("sign").textContent = D.part(now.getHours()).name;
    if (text === last) return;
    last = text;
    const el = document.createElement("div");
    el.className = "line in";
    el.textContent = text;
    verse.querySelectorAll(".line:not(.out)").forEach(o => { o.classList.add("out"); setTimeout(() => o.remove(), 2500); });
    verse.appendChild(el);
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove("in")));
  }

  const clock = S.clock(() => show());
  S.choice("style", "ordklocka-style", "tjugo", v => { style = v; last = ""; clock.setStyle(v); });
  S.setup("/ordklocka/poetisk/ws");
</script>
<script src="/ordklocka/meny.js"></script>
</body>
</html>
