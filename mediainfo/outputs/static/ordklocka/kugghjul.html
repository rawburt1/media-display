<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordklocka Kugghjul</title>
<style>
  :root { --panel-bg: rgba(24, 18, 12, 0.9); --panel-fg: #f1e0bd; --panel-accent: #d9a648; --panel-bg-solid: #18120c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: radial-gradient(ellipse at 50% 40%, #3b2f24, #15100b 75%); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  /* Mässingsplåten med glasfönstren */
  .plate { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
           padding: calc(var(--u) * 0.5) calc(var(--u) * 0.9); border-radius: calc(var(--u) * 0.35);
           background: linear-gradient(160deg, #e7c27a, #b0812f 45%, #d8ab55 70%, #8d6424);
           box-shadow: 0 calc(var(--u) * 0.2) calc(var(--u) * 0.7) rgba(0, 0, 0, 0.7), inset 0 2px 0 rgba(255, 255, 255, 0.5);
           display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 0.3); }
  .plate .head { font: 700 calc(var(--u) * 0.36) / 1 "Copperplate", "Didot", "Georgia", serif; letter-spacing: 0.45em; color: #4a3210;
                 text-shadow: 0 1px 0 rgba(255, 240, 200, 0.6); }
  .win { position: relative; width: calc(var(--u) * var(--chars) * 0.82 + var(--u) * 0.7); height: calc(var(--u) * 1.25);
         overflow: hidden; border-radius: calc(var(--u) * 0.12); background: #f4ead2;
         box-shadow: inset 0 0 0 calc(var(--u) * 0.07) #6b4a1a, inset 0 calc(var(--u) * 0.12) calc(var(--u) * 0.2) rgba(0, 0, 0, 0.5); }
  .win::after { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
                background: linear-gradient(180deg, rgba(0, 0, 0, 0.35), transparent 30%, rgba(255, 255, 255, 0.25) 46%, transparent 60%, rgba(0, 0, 0, 0.35)); }
  .word { position: absolute; left: 0; right: 0; top: 0; height: 100%; display: grid; place-items: center;
          font: 700 calc(var(--u) * 0.95) / 1 "Georgia", "DejaVu Serif", serif; color: #2a1d0e; letter-spacing: 0.05em; }
  .dots { display: flex; gap: calc(var(--u) * 0.3); }
  .dots i { width: calc(var(--u) * 0.26); height: calc(var(--u) * 0.26); border-radius: 50%; background: #5b3d12;
            box-shadow: inset 0 0 0 2px #3b270b; }
  .dots i.on { background: radial-gradient(circle at 35% 35%, #fff4c2, #f0b030 60%, #a86a00); box-shadow: 0 0 calc(var(--u) * 0.2) #f0b030; }
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="plate" id="plate" aria-hidden="true">
  <div class="head">KLOCKAN ÄR</div>
  <div id="wins"></div>
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
</div>

<div class="panel">
  <div class="readout" id="readout" aria-live="polite"></div>
  <div class="controls">
    <div class="group" role="group" aria-label="Uttryck för :20 och :40">
      <span class="label">20 / 40</span>
      <button data-style="tjugo">tjugo över</button>
      <button data-style="halv">tio i halv</button>
    </div>
    <div class="group"><button id="fs" aria-pressed="false">helskärm</button></div>
  </div>
</div>

<script src="/ordklocka/tid.js"></script>
<script src="/ordklocka/sida.js"></script>
<script>
  const S = OrdklockaSida;
  // Synliga mässingskugghjul bakom en plåt med glasfönster. När tiden
  // ändras varvar maskineriet upp, och orden glider fram i fönstren.
  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  const wins = document.getElementById("wins");
  const dots = [...document.querySelectorAll("#dots i")];
  let W, H, dpr, gears = [], speed = 0.08, boost = 0;

  // Kugghjul i kedja: varje hjul griper i det förra och snurrar åt andra hållet.
  function build() {
    dpr = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const u = Math.min(W, H);
    const tooth = u * 0.018;
    const spec = [[0.16, 0.22, 22], [0.0, 0.0, 14], [0.0, 0.0, 30], [0.0, 0.0, 12], [0.0, 0.0, 26], [0.0, 0.0, 16], [0.0, 0.0, 20]];
    gears = [];
    let angle = -0.3;
    spec.forEach(([x, y, n], i) => {
      const r = n * tooth / Math.PI * 1.05;
      let g;
      if (i === 0) g = { x: W * x, y: H * y, r, n, phase: 0, dir: 1 };
      else {
        const p = gears[i - 1];
        angle += 0.9 + (i % 2 ? -0.35 : 0.55);
        const d = p.r + r - tooth * 0.55;
        g = { x: p.x + Math.cos(angle) * d, y: p.y + Math.sin(angle) * d, r, n, dir: -p.dir };
        // Kuggarna ska gripa i varandra
        g.phase = Math.PI / n + (angle + Math.PI) - (angle - p.phase) * (p.n / n);
      }
      g.ratio = i === 0 ? 1 : gears[i - 1].ratio * gears[i - 1].n / n;
      gears.push(g);
      if (g.x > W * 0.92 || g.y > H * 0.95) angle += 1.2;
    });
    // En andra kedja nere till höger
    const g0 = { x: W * 0.84, y: H * 0.8, r: 24 * tooth / Math.PI * 1.05, n: 24, phase: 0.2, dir: -1, ratio: 0.7 };
    gears.push(g0);
    const g1r = 12 * tooth / Math.PI * 1.05, a1 = -2.4, d1 = g0.r + g1r - tooth * 0.55;
    gears.push({ x: g0.x + Math.cos(a1) * d1, y: g0.y + Math.sin(a1) * d1, r: g1r, n: 12, dir: 1, ratio: 0.7 * 2,
                 phase: Math.PI / 12 + (a1 + Math.PI) - (a1 - 0.2) * 2 });
    document.documentElement.style.setProperty("--u", Math.min(W / 13, H / 6.5) + "px");
  }

  function gearPath(g) {
    const n = g.n, ro = g.r, ri = g.r * 0.86;
    ctx.beginPath();
    for (let k = 0; k < n; k++) {
      const a = k / n * Math.PI * 2, s = Math.PI / n;
      ctx.lineTo(Math.cos(a - s * 0.55) * ri, Math.sin(a - s * 0.55) * ri);
      ctx.lineTo(Math.cos(a - s * 0.32) * ro, Math.sin(a - s * 0.32) * ro);
      ctx.lineTo(Math.cos(a + s * 0.32) * ro, Math.sin(a + s * 0.32) * ro);
      ctx.lineTo(Math.cos(a + s * 0.55) * ri, Math.sin(a + s * 0.55) * ri);
    }
    ctx.closePath();
    // Ekrar: hål i hjulet
    const holes = n > 18 ? 6 : n > 13 ? 5 : 0;
    for (let k = 0; k < holes; k++) {
      const a = k / holes * Math.PI * 2;
      ctx.moveTo(Math.cos(a) * g.r * 0.62, Math.sin(a) * g.r * 0.62);
      ctx.arc(Math.cos(a) * g.r * 0.45, Math.sin(a) * g.r * 0.45, g.r * 0.17, 0, Math.PI * 2, true);
    }
    ctx.moveTo(g.r * 0.12, 0); ctx.arc(0, 0, g.r * 0.12, 0, Math.PI * 2, true);
  }

  let rot = 0, last = performance.now();
  function frame(t) {
    const dt = Math.min(0.05, (t - last) / 1000); last = t;
    boost *= Math.pow(0.35, dt);
    rot += (speed + boost) * dt;
    ctx.clearRect(0, 0, W, H);
    for (const g of gears) {
      ctx.save();
      ctx.translate(g.x, g.y);
      ctx.rotate(g.phase + rot * g.dir * g.ratio);
      gearPath(g);
      const gr = ctx.createRadialGradient(-g.r * 0.3, -g.r * 0.3, g.r * 0.1, 0, 0, g.r);
      gr.addColorStop(0, "#f2d38a"); gr.addColorStop(0.6, "#b8862f"); gr.addColorStop(1, "#6b4a17");
      ctx.shadowColor = "rgba(0,0,0,0.6)"; ctx.shadowBlur = g.r * 0.15; ctx.shadowOffsetY = g.r * 0.06;
      ctx.fillStyle = gr; ctx.fill("evenodd");
      ctx.shadowColor = "transparent";
      ctx.lineWidth = 1; ctx.strokeStyle = "rgba(60, 40, 10, 0.8)"; ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, g.r * 0.7, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(255, 230, 170, 0.25)"; ctx.lineWidth = g.r * 0.03; ctx.stroke();
      ctx.restore();
    }
    requestAnimationFrame(frame);
  }

  // Ett fönster per rad. Orden glider upp ur fönstret och nya kommer underifrån.
  function setLines(lines, animate) {
    const longest = Math.max(...lines.map(l => l.length), 6);
    document.documentElement.style.setProperty("--chars", longest);
    const old = [...wins.children];
    lines.forEach((text, i) => {
      let win = old[i];
      if (!win) { win = document.createElement("div"); win.className = "win"; win.style.marginBottom = "calc(var(--u) * 0.18)"; wins.appendChild(win); }
      const prev = win.querySelector(".word:last-child");
      if (prev && prev.textContent === text) return;
      const el = document.createElement("div");
      el.className = "word"; el.textContent = text;
      win.appendChild(el);
      if (!animate || !prev) { if (prev) prev.remove(); return; }
      const opts = { duration: 1400, delay: 350 + i * 450, easing: "cubic-bezier(.6, 0, .25, 1.15)", fill: "both" };
      prev.animate([{ transform: "translateY(0)" }, { transform: "translateY(-110%)" }], opts).finished.then(() => prev.remove());
      el.animate([{ transform: "translateY(110%)" }, { transform: "translateY(0)" }], opts);
    });
    old.slice(lines.length).forEach(w => w.remove());
  }

  const clock = S.clock((t, info) => {
    dots.forEach((d, i) => d.classList.toggle("on", i < t.extra));
    if (!info.wordsChanged) { boost = Math.max(boost, 0.5); return; }
    if (!info.first && !matchMedia("(prefers-reduced-motion: reduce)").matches) boost = 3.2;
    setLines(S.lines(t), !info.first);
  });
  S.choice("style", "ordklocka-style", "tjugo", v => clock.setStyle(v));
  addEventListener("resize", build);
  build();
  requestAnimationFrame(frame);
  S.setup("/ordklocka/kugghjul/ws");
</script>
<script src="/ordklocka/meny.js"></script>
</body>
</html>
