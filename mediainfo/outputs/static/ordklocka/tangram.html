<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordklocka Tangram</title>
<style>
  :root { --panel-bg: rgba(245, 240, 230, 0.95); --panel-fg: #2b2b2b; --panel-accent: #2b2b2b; --panel-bg-solid: #f5f0e6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #efe8da; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>

<div class="panel">
  <div class="readout" id="readout" aria-live="polite"></div>
  <div class="controls">
    <div class="group" role="group" aria-label="Uttryck för :20 och :40">
      <span class="label">20 / 40</span>
      <button data-style="tjugo">tjugo över</button>
      <button data-style="halv">tio i halv</button>
    </div>
    <div class="group"><button id="fs" aria-pressed="false">helskärm</button></div>
  </div>
</div>

<script src="/ordklocka/tid.js"></script>
<script src="/ordklocka/sida.js"></script>
<script src="/ordklocka/pixelfont.js"></script>
<script>
  const S = OrdklockaSida;
  // Bokstäverna byggs av geometriska pusselbitar: kvadrater och trianglar
  // (där en bokstav har ett hörn snedskärs rutan). När tiden ändras lossnar
  // bitarna, vänder sig och glider till sina nya platser; bitar som inte
  // behövs flyger ut och nya kommer in från kanterna.
  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  const G = OrdklockaPixelfont.GLYPHS;
  const COLORS = ["#e63946", "#f4a261", "#2a9d8f", "#264653", "#e9c46a", "#8338ec", "#3a86ff"];
  const SHAPES = {
    sq: [[0, 0], [1, 0], [1, 1], [0, 1]],
    tl: [[1, 0], [1, 1], [0, 1]], tr: [[0, 0], [1, 1], [0, 1]],
    bl: [[0, 0], [1, 0], [1, 1]], br: [[0, 0], [1, 0], [0, 1]],
  };
  let W, H, dpr, cell = 10, ox = 0, oy = 0, pieces = [], lines = [], extra = 0;

  // Målen: en bit per tänd punkt i 5x9-typsnittet, med snedskurna hörn.
  function targets() {
    const all = ["KLOCKAN ÄR", ...lines];
    const cols = Math.max(...all.map(l => l.length)) * 6 - 1, rows = all.length * 10 - 1;
    cell = Math.min(W * 0.92 / cols, H * 0.86 / rows);
    ox = (W - cols * cell) / 2; oy = (H - rows * cell) / 2;
    const out = [];
    all.forEach((line, li) => {
      const x0 = Math.round((cols - (line.length * 6 - 1)) / 2);
      [...line].forEach((ch, ci) => {
        const g = G[ch] || G[" "];
        if (!g) return;
        const on = (x, y) => y >= 0 && y < 9 && x >= 0 && x < 5 && g[y][x] === "#";
        for (let y = 0; y < 9; y++) for (let x = 0; x < 5; x++) {
          if (!on(x, y)) continue;
          let shape = "sq";
          const u = on(x, y - 1), d = on(x, y + 1), l = on(x - 1, y), r = on(x + 1, y);
          if (!u && !l && (d && r)) shape = "tl";
          else if (!u && !r && (d && l)) shape = "tr";
          else if (!d && !l && (u && r)) shape = "bl";
          else if (!d && !r && (u && l)) shape = "br";
          const gx = x0 + ci * 6 + x, gy = li * 10 + y;
          const c1 = COLORS[(ci * 3 + y + li * 2 + (x > 2 ? 1 : 0)) % COLORS.length];
          if (shape !== "sq") { out.push({ gx, gy, shape, color: c1 }); continue; }
          // Hela rutor delas i två trianglar i olika färger, diagonalen växlar
          const c2 = COLORS[(ci * 3 + y + li * 2 + 3 + (x > 2 ? 1 : 0)) % COLORS.length];
          if ((x + y) % 2) { out.push({ gx, gy, shape: "br", color: c1 }, { gx, gy, shape: "tl", color: c2 }); }
          else { out.push({ gx, gy, shape: "tr", color: c1 }, { gx, gy, shape: "bl", color: c2 }); }
        }
      });
    });
    return out;
  }

  function build() {
    dpr = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (lines.length) arrange(false);
  }

  function arrange(animate) {
    const want = targets();
    const now = performance.now();
    const free = pieces.filter(p => !p.leaving);
    const used = new Set();
    const next = [];
    for (const t of want) {
      const tx = ox + t.gx * cell, ty = oy + t.gy * cell;
      // Närmaste lediga bit tar platsen
      let best = null, bd = Infinity;
      for (const p of free) {
        if (used.has(p)) continue;
        const d = (p.x - tx) ** 2 + (p.y - ty) ** 2 + (p.shape === t.shape ? 0 : cell * cell * 0.5);
        if (d < bd) { bd = d; best = p; }
      }
      const stays = !!best && bd < 1 && best.shape === t.shape;
      if (best && animate) used.add(best);
      else {
        const edge = Math.random() * 4 | 0;
        best = { x: edge === 0 ? -cell * 2 : edge === 1 ? W + cell : Math.random() * W, y: edge === 2 ? -cell * 2 : edge === 3 ? H + cell : Math.random() * H, rot: Math.random() * 6 };
      }
      const delay = animate ? (t.gx / 120) * 900 + Math.random() * 300 : -2000;
      next.push(Object.assign(best, {
        fx: best.x, fy: best.y, frot: best.rot, tx, ty, trot: 0, shape: t.shape, color: t.color,
        start: now + delay, dur: 1400, leaving: false,
        spinTurns: animate && !stays ? (Math.random() < 0.5 ? -1 : 1) * Math.PI / 2 * (1 + (Math.random() * 3 | 0)) : 0,
      }));
    }
    // Överblivna bitar flyger ut
    for (const p of free) {
      if (used.has(p) || next.includes(p)) continue;
      const a = Math.random() * Math.PI * 2;
      Object.assign(p, { fx: p.x, fy: p.y, frot: p.rot, tx: W / 2 + Math.cos(a) * W, ty: H / 2 + Math.sin(a) * H, trot: p.rot + 4,
                         start: now + Math.random() * 400, dur: 1500, leaving: true, spinTurns: 0 });
      next.push(p);
    }
    pieces = next;
  }

  const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  function frame(t) {
    ctx.fillStyle = "#efe8da"; ctx.fillRect(0, 0, W, H);
    // Svagt rutnät, som ett pusselbräde
    ctx.strokeStyle = "rgba(0,0,0,0.04)"; ctx.lineWidth = 1;
    for (let x = ox % cell; x < W; x += cell) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = oy % cell; y < H; y += cell) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    pieces = pieces.filter(p => !(p.leaving && t > p.start + p.dur));
    const inset = cell * 0.035;
    for (const p of pieces) {
      const k = ease(Math.min(1, Math.max(0, (t - p.start) / p.dur)));
      p.x = p.fx + (p.tx - p.fx) * k; p.y = p.fy + (p.ty - p.fy) * k;
      // Från gamla vinkeln till den nya, med några extra kvartsvarv på vägen
      const rot = p.frot * (1 - k) + p.trot * k + p.spinTurns * k * (1 - k) * 4;
      p.rot = rot;
      ctx.save();
      ctx.translate(p.x + cell / 2, p.y + cell / 2);
      ctx.rotate(rot);
      // Lyft under förflyttningen: skugga och lite större
      const lift = Math.sin(Math.PI * k) * (p.leaving ? 0 : 1);
      if (lift > 0.01) { ctx.scale(1 + lift * 0.25, 1 + lift * 0.25); ctx.shadowColor = "rgba(0,0,0,0.25)"; ctx.shadowBlur = cell * 0.6 * lift; ctx.shadowOffsetY = cell * 0.3 * lift; }
      ctx.beginPath();
      SHAPES[p.shape].forEach(([x, y], i) => {
        const px = -cell / 2 + inset + x * (cell - inset * 2), py = -cell / 2 + inset + y * (cell - inset * 2);
        i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      });
      ctx.closePath();
      ctx.fillStyle = p.color; ctx.fill();
      ctx.restore();
    }
    // Extraminuter: fyra små trianglar nere till höger
    for (let i = 0; i < 4; i++) {
      const x = W - cell * (6 - i * 1.3), y = H - cell * 2.2;
      ctx.beginPath(); ctx.moveTo(x, y + cell); ctx.lineTo(x + cell * 0.5, y); ctx.lineTo(x + cell, y + cell); ctx.closePath();
      ctx.fillStyle = i < extra ? COLORS[i] : "rgba(0,0,0,0.08)"; ctx.fill();
    }
    requestAnimationFrame(frame);
  }

  const clock = S.clock((t, info) => {
    extra = t.extra;
    if (!info.wordsChanged) return;
    lines = S.lines(t);
    if (W) arrange(!info.first && !matchMedia("(prefers-reduced-motion: reduce)").matches);
  });
  S.choice("style", "ordklocka-style", "tjugo", v => clock.setStyle(v));
  addEventListener("resize", build);
  build();
  requestAnimationFrame(frame);
  S.setup("/ordklocka/tangram/ws");
</script>
<script src="/ordklocka/meny.js"></script>
</body>
</html>
