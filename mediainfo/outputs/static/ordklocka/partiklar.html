<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordklocka Partiklar</title>
<style>
  :root { --panel-bg: rgba(4, 6, 14, 0.88); --panel-fg: #e6ecff; --panel-accent: #e6ecff; --panel-bg-solid: #04060e; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #02030a; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="cv" aria-hidden="true"></canvas>

<div class="panel">
  <div class="readout" id="readout" aria-live="polite"></div>
  <div class="controls">
    <div class="group" role="group" aria-label="Uttryck för :20 och :40">
      <span class="label">20 / 40</span>
      <button data-style="tjugo">tjugo över</button>
      <button data-style="halv">tio i halv</button>
    </div>
    <div class="group" role="group" aria-label="Färg">
      <span class="label">Ljus</span>
      <button data-hue="guld">guld</button>
      <button data-hue="is">is</button>
      <button data-hue="eld">eld</button>
    </div>
    <div class="group"><button id="fs" aria-pressed="false">helskärm</button></div>
  </div>
</div>

<script src="/ordklocka/tid.js"></script>
<script src="/ordklocka/sida.js"></script>
<script>
  const S = OrdklockaSida;
  const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  const FONT = '"Arial Black", "Helvetica Neue", "DejaVu Sans", sans-serif';
  const HUES = { guld: [[255, 214, 140], [255, 170, 80]], is: [[190, 230, 255], [120, 170, 255]], eld: [[255, 140, 80], [255, 70, 90]] };
  let hue = HUES.guld;
  let W = 0, H = 0, N = 0, P = null;   // P: Float32Array [x, y, vx, vy, tx, ty, has, tw] per partikel
  const STRIDE = 8;

  function resize() {
    W = innerWidth; H = innerHeight;
    cv.width = W; cv.height = H;
    N = Math.round(Math.min(6000, Math.max(2500, W * H / 260)));
    const old = P;
    P = new Float32Array(N * STRIDE);
    for (let i = 0; i < N; i++) {
      const o = i * STRIDE;
      P[o] = old && o < old.length ? old[o] : Math.random() * W;
      P[o + 1] = old && o < old.length ? old[o + 1] : Math.random() * H;
      P[o + 7] = Math.random() * Math.PI * 2;
    }
    if (lines.length) target(lines, false);
  }

  // Ritar texten osynligt och plockar ut punkter där bokstäverna finns.
  function samplePoints(lines) {
    const off = document.createElement("canvas");
    const sc = 0.25;
    off.width = Math.ceil(W * sc); off.height = Math.ceil(H * sc);
    const g = off.getContext("2d");
    g.fillStyle = "#fff"; g.textAlign = "center"; g.textBaseline = "middle";
    const big = Math.min(H * 0.2, W * 0.13) * sc;
    const sizes = lines.map((l, i) => {
      let s = i === 0 ? big * 0.42 : big;
      g.font = `900 ${s}px ${FONT}`;
      const w = g.measureText(l).width;
      if (w > off.width * 0.9) s *= off.width * 0.9 / w;
      return s;
    });
    const total = sizes.reduce((a, s) => a + s * 1.15, 0);
    let y = (off.height - total) / 2;
    lines.forEach((l, i) => {
      g.font = `900 ${sizes[i]}px ${FONT}`;
      y += sizes[i] * 0.575;
      g.fillText(l, off.width / 2, y);
      y += sizes[i] * 0.575;
    });
    const data = g.getImageData(0, 0, off.width, off.height).data;
    const pts = [];
    for (let yy = 0; yy < off.height; yy++) for (let xx = 0; xx < off.width; xx++) {
      if (data[(yy * off.width + xx) * 4 + 3] > 128) pts.push([(xx + Math.random()) / sc, (yy + Math.random()) / sc]);
    }
    return pts;
  }

  // Nya mål: en explosion först, sedan dras partiklarna till bokstäverna.
  // Partiklar som inte behövs blir stoft som svävar runt.
  let lines = [], gatherAt = 0;
  function target(newLines, burst) {
    lines = newLines;
    const pts = samplePoints(lines);
    for (let k = pts.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [pts[k], pts[j]] = [pts[j], pts[k]]; }
    for (let i = 0; i < N; i++) {
      const o = i * STRIDE;
      const p = pts[i % Math.max(1, pts.length)];
      const used = pts.length && i < Math.min(N * 0.88, pts.length * 3);
      P[o + 4] = p ? p[0] : 0; P[o + 5] = p ? p[1] : 0; P[o + 6] = used ? 1 : 0;
      if (burst) { const a = Math.random() * Math.PI * 2, v = 2 + Math.random() * 7; P[o + 2] += Math.cos(a) * v; P[o + 3] += Math.sin(a) * v; }
    }
    gatherAt = performance.now() + (burst ? 900 : 0);
  }

  function frame(now) {
    ctx.fillStyle = "rgba(2, 3, 10, 0.35)";
    ctx.fillRect(0, 0, W, H);
    const gathering = now > gatherAt;
    const t = now / 1000;
    const [c1, c2] = hue;
    ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < N; i++) {
      const o = i * STRIDE;
      let x = P[o], y = P[o + 1], vx = P[o + 2], vy = P[o + 3];
      if (P[o + 6] && gathering) {
        // Fjäder mot målet, med dämpning
        vx += (P[o + 4] - x) * 0.012; vy += (P[o + 5] - y) * 0.012;
        vx *= 0.86; vy *= 0.86;
      } else {
        // Stoft: långsam virvel
        vx += Math.sin(y * 0.004 + t * 0.3 + P[o + 7]) * 0.03; vy += Math.cos(x * 0.004 + t * 0.25) * 0.03;
        vx *= 0.97; vy *= 0.97;
      }
      x += vx; y += vy;
      if (x < 0) x += W; if (x > W) x -= W; if (y < 0) y += H; if (y > H) y -= H;
      P[o] = x; P[o + 1] = y; P[o + 2] = vx; P[o + 3] = vy;
      const twinkle = 0.55 + 0.45 * Math.sin(t * 3 + P[o + 7] * 5);
      const c = i % 3 ? c1 : c2;
      const a = P[o + 6] ? 0.85 * twinkle : 0.22 * twinkle;
      ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${a.toFixed(2)})`;
      const s = P[o + 6] ? 1.8 : 1.2;
      ctx.fillRect(x - s / 2, y - s / 2, s, s);
    }
    ctx.globalCompositeOperation = "source-over";
    requestAnimationFrame(frame);
  }

  addEventListener("resize", resize);
  resize();
  const clock = S.clock((t, info) => {
    const extra = t.extra ? " " + "•".repeat(t.extra) : "";
    target(["KLOCKAN ÄR", ...S.lines(t).map((l, i, a) => i === a.length - 1 ? l + extra : l)],
           info.wordsChanged && !info.first);   // bara nya ord löses upp, extraminuter glider in
  });
  S.choice("style", "ordklocka-style", "tjugo", v => clock.setStyle(v));
  S.choice("hue", "ordklocka-partiklar-ljus", "guld", v => { hue = HUES[v]; });
  requestAnimationFrame(frame);
  S.setup("/ordklocka/partiklar/ws");
</script>
<script src="/ordklocka/meny.js"></script>
</body>
</html>
