<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordklocka Domino</title>
<style>
  :root {
    --panel-bg: rgba(10, 30, 20, 0.9); --panel-fg: #e8f0ea; --panel-accent: #f4efe2;
    --panel-bg-solid: #0a1e14;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    /* Grönt filtbord */
    background:
      radial-gradient(ellipse at 50% 45%, rgba(255, 255, 255, 0.08), transparent 60%),
      repeating-radial-gradient(circle at 30% 40%, rgba(0, 0, 0, 0.03) 0 1px, transparent 1px 3px),
      #1d5a3a;
  }
  .table { position: fixed; inset: 0; perspective: 900px; perspective-origin: 50% 20%; }
  .field { position: absolute; left: 0; top: 0; transform-style: preserve-3d; }
  .dom {
    position: absolute; border-radius: 12%;
    background-color: #f4efe2;
    box-shadow: 0 1px 0 #c9c1ad, 1px 2px 3px rgba(0, 0, 0, 0.35);
    transform-origin: 50% 100%;
  }
  .dom::after { content: ""; position: absolute; left: 12%; right: 12%; top: 50%; height: 1px; background: rgba(0, 0, 0, 0.45); }
  .dots { display: flex; justify-content: center; gap: 3vmin; position: fixed; left: 0; right: 0; bottom: 6vh; }
  .dots .dom { position: relative; }
</style>
</head>
<body>
<div class="table" aria-hidden="true"><div class="field" id="field"></div></div>
<div class="dots" id="dots" aria-hidden="true"></div>

<div class="panel">
  <div class="readout" id="readout" aria-live="polite"></div>
  <div class="controls">
    <div class="group" role="group" aria-label="Uttryck för :20 och :40">
      <span class="label">20 / 40</span>
      <button data-style="tjugo">tjugo över</button>
      <button data-style="halv">tio i halv</button>
    </div>
    <div class="group"><button id="fs" aria-pressed="false">helskärm</button></div>
  </div>
</div>

<script src="/ordklocka/tid.js"></script>
<script src="/ordklocka/sida.js"></script>
<script src="/ordklocka/pixelfont.js"></script>
<script>
  const S = OrdklockaSida;
  const GLYPHS = OrdklockaPixelfont.GLYPHS;
  const field = document.getElementById("field");
  const dotsEl = document.getElementById("dots");
  const LONGEST = 14, LINE_ROWS = 12;     // 9 rader tecken + 3 rader luft
  let py = 16, px = 9;

  // Prickarna på en dominohalva (0-6), som bakgrundsbilder.
  const PIPS = [[], [[50, 50]], [[25, 25], [75, 75]], [[25, 25], [50, 50], [75, 75]],
    [[25, 25], [75, 25], [25, 75], [75, 75]], [[25, 25], [75, 25], [50, 50], [25, 75], [75, 75]],
    [[25, 20], [75, 20], [25, 50], [75, 50], [25, 80], [75, 80]]];
  function pips(a, b) {
    const dot = (x, y, top) => `radial-gradient(circle at ${x}% ${top ? y / 2 : 50 + y / 2}%, #1b1b1b 0 7%, transparent 9%)`;
    const layers = [...PIPS[a].map(([x, y]) => dot(x, y, true)), ...PIPS[b].map(([x, y]) => dot(x, y, false))];
    return layers.join(",") || "none";
  }

  function resize() {
    py = Math.min(innerWidth * 0.92 / (LONGEST * 6 * 0.58), innerHeight * 0.78 / (3 * LINE_ROWS));
    px = py * 0.58;
  }

  let placed = [];
  function lay(lines, animate) {
    // Gamla brickor skjuts undan.
    for (const el of placed) {
      if (!animate) { el.remove(); continue; }
      el.animate([{ opacity: 1 }, { opacity: 0, transform: `translate(${(Math.random() - 0.5) * 80}px, 40px) rotate(${(Math.random() - 0.5) * 90}deg)` }],
                 { duration: 500, delay: Math.random() * 300, fill: "forwards" }).finished.then(() => el.remove());
    }
    placed = [];
    const totalH = lines.length * LINE_ROWS * py - 3 * py;
    const top = (innerHeight * 0.9 - totalH) / 2;
    let k = 0;
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    lines.forEach((line, li) => {
      const chars = [...line];
      const w = (chars.length * 6 - 1) * px;
      const left = (innerWidth - w) / 2;
      chars.forEach((ch, ci) => {
        const g = GLYPHS[ch] || GLYPHS[" "];
        // Kedjan går kolumn för kolumn genom bokstaven, uppifrån och ner.
        for (let c = 0; c < 5; c++) for (let r = 0; r < 9; r++) {
          if (g[r][c] !== "#") continue;
          const el = document.createElement("div");
          el.className = "dom";
          el.style.left = left + (ci * 6 + c) * px + px * 0.07 + "px";
          el.style.top = top + (li * LINE_ROWS + r) * py + py * 0.04 + "px";
          el.style.width = px * 0.86 + "px";
          el.style.height = py * 0.92 + "px";
          el.style.backgroundImage = pips(Math.floor(Math.random() * 7), Math.floor(Math.random() * 7));
          field.appendChild(el);
          placed.push(el);
          if (animate && !reduce) {
            // Ställs upp (lutad, syns som en smal kant) och faller sedan i tur och ordning.
            const fall = 1500 + k * 8, D = fall + 320;
            const stand = { transform: "rotateX(-82deg)", filter: "brightness(0.7)" };
            el.animate([
              { ...stand, opacity: 0, offset: 0 },
              { ...stand, opacity: 1, offset: (150 + k * 1.2) / D },
              { ...stand, opacity: 1, offset: fall / D, easing: "cubic-bezier(0.55, 0, 1, 0.45)" },   // faller allt fortare
              { transform: "rotateX(6deg)", filter: "brightness(1)", opacity: 1, offset: (fall + 230) / D },
              { transform: "rotateX(0)", filter: "brightness(1)", opacity: 1, offset: 1 },
            ], { duration: D, easing: "linear", fill: "backwards" });
          }
          k++;
        }
      });
    });
  }

  const clock = S.clock((t, info) => {
    if (info.wordsChanged) lay(["KLOCKAN ÄR", ...S.lines(t)], true);
    dotsEl.replaceChildren(...[0, 1, 2, 3].map(i => {
      const d = document.createElement("div");
      d.className = "dom";
      d.style.width = px * 1.3 + "px"; d.style.height = py * 1.4 + "px";
      d.style.opacity = i < t.extra ? 1 : 0.2;
      d.style.backgroundImage = pips(i < t.extra ? i + 1 : 0, 0);
      return d;
    }));
  });
  addEventListener("resize", () => { resize(); clock.refresh(); });
  resize();
  S.choice("style", "ordklocka-style", "tjugo", v => clock.setStyle(v));
  S.setup("/ordklocka/domino/ws");
</script>
<script src="/ordklocka/meny.js"></script>
</body>
</html>
