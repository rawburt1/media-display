<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordklocka 3D</title>
<style>
  :root {
    --wall-top: #eceae6; --wall-bottom: #cfccc6; --letter: #fff;
    --panel-bg: rgba(30, 30, 34, 0.88); --panel-fg: #f0f0f0; --panel-accent: #f0f0f0; --panel-bg-solid: #1e1e22;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: linear-gradient(180deg, var(--wall-top), var(--wall-bottom)); perspective: 120vmin;
         transition: background 2s; }
  /* Ljuset som faller in genom ett fönster */
  .sunpatch { position: fixed; inset: 0; pointer-events: none; mix-blend-mode: soft-light; transition: background 2s; }
  .stage { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
           transform-style: preserve-3d; animation: sway 40s ease-in-out infinite; }
  @keyframes sway { 0%, 100% { transform: rotateY(-7deg) rotateX(4deg); } 50% { transform: rotateY(7deg) rotateX(2deg); } }
  .line { font: 900 14vmin/1.05 "Arial Black", "Helvetica Neue", "DejaVu Sans", sans-serif; color: var(--letter);
          letter-spacing: 0.02em; white-space: nowrap; transition: text-shadow 2s, color 2s, opacity 0.8s, transform 0.8s; }
  .line.small { font-size: 6vmin; letter-spacing: 0.2em; margin-bottom: 2vmin; }
  .stage.swap .line:not(.small) { opacity: 0; transform: translateZ(-30vmin) rotateX(30deg); }
  .dots { display: flex; gap: 3vmin; margin-top: 4vmin; }
  .dots i { width: 3vmin; height: 3vmin; border-radius: 50%; background: var(--letter); opacity: 0.18; transition: opacity 0.6s, box-shadow 2s; }
  .dots i.on { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .stage { animation: none; } }
</style>
</head>
<body>
<div class="sunpatch" id="sunpatch" aria-hidden="true"></div>
<div class="stage" id="stage" aria-hidden="true"></div>

<div class="panel">
  <div class="readout" id="readout" aria-live="polite"></div>
  <div class="controls">
    <div class="group" role="group" aria-label="Uttryck för :20 och :40">
      <span class="label">20 / 40</span>
      <button data-style="tjugo">tjugo över</button>
      <button data-style="halv">tio i halv</button>
    </div>
    <div class="group"><button id="fs" aria-pressed="false">helskärm</button></div>
  </div>
</div>

<script src="/ordklocka/tid.js"></script>
<script src="/ordklocka/sida.js"></script>
<script>
  const S = OrdklockaSida;
  const stage = document.getElementById("stage");
  const root = document.documentElement.style;

  // Färger över dygnet: [timme, vägg upptill, vägg nedtill, bokstav, sida]
  const KEYS = [
    [0, "#0f1626", "#1b2438", "#c9d6f0", "#3a4660"],
    [6, "#f4c9a8", "#d99a7a", "#fff3e6", "#b07a5a"],
    [9, "#e9dbc3", "#cbb798", "#ffffff", "#94846a"],
    [12, "#e4e1db", "#c4c0b8", "#ffffff", "#8a8680"],
    [16, "#e8cfae", "#c3a27a", "#fffaf0", "#94744a"],
    [19, "#e9967a", "#8e4f5a", "#ffe9dc", "#7a3f45"],
    [21, "#2b2a4a", "#1d1c33", "#d8d0ff", "#4a4570"],
    [24, "#0f1626", "#1b2438", "#c9d6f0", "#3a4660"],
  ];
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, f) => { const x = hex(a), y = hex(b); return `rgb(${x.map((v, i) => Math.round(v + (y[i] - v) * f)).join(",")})`; };

  // Ljuset: solen går från vänster (morgon) över toppen till höger (kväll),
  // på natten ett svagare månljus. Skuggorna faller åt motsatt håll och
  // blir längre ju lägre ljuset står.
  function light(now) {
    const h = now.getHours() + now.getMinutes() / 60;
    const k = KEYS.findIndex(x => x[0] > h);
    const [h0, ...a] = KEYS[k - 1], [h1, ...b] = KEYS[k];
    const f = (h - h0) / (h1 - h0);
    const [wallTop, wallBottom, letter, side] = a.map((c, i) => mix(c, b[i], f));
    root.setProperty("--wall-top", wallTop);
    root.setProperty("--wall-bottom", wallBottom);
    root.setProperty("--letter", letter);

    const day = h >= 6 && h < 18;
    const theta = day ? Math.PI * (1 - (h - 6) / 12) : Math.PI * (1 - (((h + 6) % 24)) / 12);
    const elev = Math.max(0.15, Math.sin(theta));
    const dx = -Math.cos(theta), dy = 0.6 + 0.4 * (1 - elev);    // bort från ljuset, lite nedåt
    const depth = 22, shadows = [];
    for (let i = 1; i <= depth; i++) shadows.push(`${(dx * i * 0.007).toFixed(4)}em ${(dy * i * 0.007).toFixed(4)}em 0 ${i === depth ? "rgba(0,0,0,0.55)" : side}`);
    const cast = 0.06 + (1 - elev) * 0.32;
    const castAlpha = day ? 0.5 : 0.3;
    shadows.push(`${(dx * cast).toFixed(3)}em ${(dy * cast).toFixed(3)}em ${(0.04 + cast * 0.2).toFixed(3)}em rgba(0,0,0,${castAlpha})`);
    shadows.push(`${(dx * cast * 1.6).toFixed(3)}em ${(dy * cast * 1.6).toFixed(3)}em ${(0.1 + cast * 0.4).toFixed(3)}em rgba(0,0,0,${castAlpha * 0.5})`);
    stage.querySelectorAll(".line").forEach(l => { l.style.textShadow = shadows.join(","); });
    const lx = 50 + Math.cos(theta) * 45, ly = 50 - elev * 45;
    document.getElementById("sunpatch").style.background =
      `radial-gradient(ellipse at ${lx}% ${ly}%, ${day ? "rgba(255,240,210,0.9)" : "rgba(170,190,255,0.5)"} 0%, transparent 60%)`;
  }

  let lines = [], extra = 0, lastNow = new Date();
  function draw() {
    stage.textContent = "";
    for (const [i, text] of ["klockan är", ...lines].entries()) {
      const el = document.createElement("div");
      el.className = "line" + (i === 0 ? " small" : "");
      el.textContent = text;
      stage.appendChild(el);
      const max = innerWidth * 0.86;
      if (el.scrollWidth > max) el.style.fontSize = parseFloat(getComputedStyle(el).fontSize) * max / el.scrollWidth + "px";
    }
    const dots = document.createElement("div");
    dots.className = "dots";
    for (let i = 0; i < 4; i++) { const d = document.createElement("i"); d.classList.toggle("on", i < extra); dots.appendChild(d); }
    stage.appendChild(dots);
    light(lastNow);
  }

  const clock = S.clock((t, info) => {
    extra = t.extra; lastNow = info.now;
    if (!info.wordsChanged) { draw(); return; }
    lines = S.lines(t).map(l => l.toLowerCase());
    if (info.first) { draw(); return; }
    stage.classList.add("swap");
    setTimeout(() => { draw(); stage.classList.remove("swap"); }, 800);
  });
  S.choice("style", "ordklocka-style", "tjugo", v => clock.setStyle(v));
  addEventListener("resize", draw);
  S.setup("/ordklocka/3d/ws");
</script>
<script src="/ordklocka/meny.js"></script>
</body>
</html>
