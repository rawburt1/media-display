<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordklocka Matrix</title>
<style>
  @font-face {
    font-family: "Josefin Sans";
    font-style: normal;
    font-weight: 600;
    font-display: block;
    src: url("/ordklocka/fonts/josefin-sans-latin-600.woff2") format("woff2");
  }
  :root {
    --c: #2bff5f;
    --bg: #000;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--c);
    font-family: "Josefin Sans", system-ui, sans-serif;
  }
  body.idle { cursor: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .panel {
    position: fixed;
    left: 50%;
    bottom: 16px;
    transform: translateX(-50%);
    width: max-content;
    max-width: calc(100vw - 32px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 12px 18px;
    border-radius: 14px;
    background: rgba(0, 0, 0, 0.82);
    border: 1px solid color-mix(in srgb, var(--c) 30%, transparent);
    box-shadow: 0 0 30px color-mix(in srgb, var(--c) 15%, transparent);
    transition: opacity 0.5s, transform 0.5s;
  }
  body.idle .panel {
    opacity: 0;
    transform: translateX(-50%) translateY(12px);
    pointer-events: none;
  }
  .readout {
    font-size: 14px;
    letter-spacing: 0.04em;
    opacity: 0.75;
    text-align: center;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 22px;
    justify-content: center;
    font-size: 14px;
  }
  .group { display: flex; align-items: center; gap: 6px; }
  .group[hidden] { display: none; }
  .group > .label { opacity: 0.6; margin-right: 4px; }
  .controls button, .controls a {
    font: inherit;
    color: var(--c);
    background: transparent;
    border: 1px solid color-mix(in srgb, var(--c) 35%, transparent);
    border-radius: 999px;
    padding: 5px 12px 3px;
    cursor: pointer;
    text-decoration: none;
  }
  .controls input[type="range"] {
    width: 110px;
    accent-color: var(--c);
    cursor: pointer;
  }
  .controls button[aria-pressed="true"] {
    background: var(--c);
    color: #000;
    border-color: var(--c);
  }
</style>
</head>
<body>

<canvas id="rain" aria-hidden="true"></canvas>

<div class="panel" id="panel">
  <div class="readout" id="readout" aria-live="polite"></div>
  <div class="controls">
    <div class="group" role="group" aria-label="Tidsformat">
      <span class="label">Tid</span>
      <button data-mode="12" aria-pressed="true">12 h</button>
      <button data-mode="24" aria-pressed="false">24 h</button>
    </div>
    <div class="group" id="style-group" role="group" aria-label="Uttryck för :20 och :40">
      <span class="label">20 / 40</span>
      <button data-style="tjugo" aria-pressed="true">tjugo över</button>
      <button data-style="halv" aria-pressed="false">tio i halv</button>
    </div>
    <div class="group" role="group" aria-label="Färg">
      <span class="label">Färg</span>
      <button data-color="grön" aria-pressed="true">grön</button>
      <button data-color="blå" aria-pressed="false">blå</button>
      <button data-color="bärnsten" aria-pressed="false">bärnsten</button>
    </div>
    <div class="group">
      <label class="label" for="speed">Fart</label>
      <input type="range" id="speed" min="0.25" max="2" step="0.05" value="1"
             aria-label="Regnets hastighet">
    </div>
    <div class="group">
      <button id="fs" aria-pressed="false">helskärm</button>
      <a href="/ordklocka">klassisk</a>
      <a href="/ordklocka/syntavla">syntavla</a>
    </div>
  </div>
</div>

<script src="/ordklocka/layouts.js"></script>
<script>
  // ---------- Ordklockans layout (delas med klassiska versionen, se layouts.js) ----------
  const LAYOUTS = window.ORDKLOCKA_LAYOUTS;
  let LAY = LAYOUTS["12"];
  let NC = LAY.cols, NR = LAY.rows.length;

  // ---------- Färger ----------
  const COLORS = {
    "grön":     { main: "#2bff5f", head: "#e2ffe8" },
    "blå":      { main: "#3fd0ff", head: "#e6f9ff" },
    "bärnsten": { main: "#ffae35", head: "#fff3dc" },
  };
  let color = COLORS["grön"];

  // ---------- Tillstånd ----------
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const GLYPHS = [..."ABCDEFGHIJKLMNOPQRSTUVWXYZÅÄÖ0123456789:=+*<>"];
  const NG = GLYPHS.length * 2;            // varje tecken även spegelvänt
  const OFF = 0.07;                         // släckta bokstäver: svag skugga

  const cv = document.getElementById("rain");
  const ctx = cv.getContext("2d");

  let vw, vh, dpr;
  let CW, CH, cleft, ctop;                    // klockans rutnät (css-px)
  let rw, rh, ox, oy, ncols, nrows;         // regnets rutnät
  let bright, glyph, clockOf, dim;          // per regncell
  let atlas, atlasHead;
  let drops = [];
  const RAIN_SIZE = 16;                    // ungefärlig bredd på regnets tecken (px)
  let speed = 1;                            // regnets hastighet (reglaget)

  // Klockans bokstäver
  let want, level, target;                  // ska vara tänd / nuvarande ljusstyrka / mål efter regnet
  function resetLetters() {
    want = new Uint8Array(NC * NR);
    level = new Float32Array(NC * NR);
    target = new Float32Array(NC * NR);
  }
  resetLetters();
  const dotLevel = [0, 0, 0, 0];
  let dotsOn = 0;

  function buildAtlas(fill) {
    const tw = Math.ceil(rw * dpr), th = Math.ceil(rh * dpr);
    const c = document.createElement("canvas");
    c.width = tw * NG; c.height = th;
    const g = c.getContext("2d");
    g.fillStyle = fill;
    g.font = `600 ${Math.round(rh * 0.7 * dpr)}px "Josefin Sans", monospace`;
    g.textAlign = "center";
    g.textBaseline = "middle";
    GLYPHS.forEach((ch, i) => {
      for (let m = 0; m < 2; m++) {
        g.save();
        g.translate((i * 2 + m) * tw + tw / 2, th * 0.56);
        if (m) g.scale(-1, 1);
        g.fillText(ch, 0, 0);
        g.restore();
      }
    });
    return { c, tw, th };
  }

  function layout() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    vw = innerWidth; vh = innerHeight;
    cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const ratio = NR > 8 ? 1.1 : 1.3;      // tätare rader när rutnätet är högt (24 h)
    CW = Math.min(vw * 0.86 / NC, vh * 0.8 / (NR * ratio));
    CH = CW * ratio;
    cleft = (vw - CW * NC) / 2;
    ctop = (vh - CH * NR) / 2;

    // Regnets kolumner/rader ligger i linje med klockans rutor
    const k = Math.max(1, Math.round(CW / RAIN_SIZE));
    rw = CW / k;
    const kv = Math.max(1, Math.round(CH / (rw * 1.25)));
    rh = CH / kv;
    ox = ((cleft % rw) + rw) % rw - rw;
    oy = ((ctop % rh) + rh) % rh - rh;
    ncols = Math.ceil((vw - ox) / rw);
    nrows = Math.ceil((vh - oy) / rh);

    const n = ncols * nrows;
    bright = new Float32Array(n);
    glyph = new Uint8Array(n);
    clockOf = new Int16Array(n);
    dim = new Float32Array(n);
    for (let r = 0; r < nrows; r++) {
      for (let c = 0; c < ncols; c++) {
        const i = r * ncols + c;
        glyph[i] = (Math.random() * NG) | 0;
        const cx = Math.floor((ox + (c + 0.5) * rw - cleft) / CW);
        const cy = Math.floor((oy + (r + 0.5) * rh - ctop) / CH);
        const inside = cx >= 0 && cx < NC && cy >= 0 && cy < NR;
        clockOf[i] = inside ? cy * NC + cx : -1;
        dim[i] = inside ? 0.3 : 1;
      }
    }
    drops = [];
    atlas = buildAtlas(color.main);
    atlasHead = buildAtlas(color.head);
  }

  function spawn(c, y, v) {
    drops.push({ c, y, v, last: Math.floor(y) - 1 });
  }

  // En våg av regn över hela skärmen – det är den som "skriver" tiden
  function wave() {
    const slow = reduceMotion ? 0.4 : 1;
    for (let c = 0; c < ncols; c++) {
      const delay = Math.random() * 1.1;
      spawn(c, -delay * 9 - Math.random() * 3, (8 + Math.random() * 5) * slow);
    }
  }

  function hitClock(ci) {
    if (want[ci]) {
      if (target[ci] < 1) level[ci] = 1.8;   // vit blixt när bokstaven låses
      target[ci] = 1;
    } else {
      level[ci] = Math.max(level[ci], 0.55);
      target[ci] = OFF;
    }
  }

  // ---------- Tid ----------
  let style = "tjugo";
  let lastKey = "";
  const readout = document.getElementById("readout");

  function updateTime(force) {
    const now = new Date();
    const min = now.getMinutes();
    const { cells: lit, text } = LAY.compute(now, style);
    dotsOn = min % 5;

    const key = lit.join("|");
    if (key === lastKey && !force) return;
    lastKey = key;

    want.fill(0);
    lit.forEach(([r, c, n]) => { for (let i = 0; i < n; i++) want[r * NC + c + i] = 1; });
    readout.textContent = text + (dotsOn ? ` (+${dotsOn} min)` : "");
    wave();
  }

  // ---------- Animation ----------
  let prev = performance.now();
  function frame(t) {
    const dt = Math.min(0.1, (t - prev) / 1000);
    prev = t;
    const rdt = dt * speed;                 // regnets tid går fortare/långsammare

    // Bakgrundsregn
    const density = reduceMotion ? 0.06 : 0.22;
    for (let c = 0; c < ncols; c++) {
      if (Math.random() < density * rdt) spawn(c, -Math.random() * 4, 3.5 + Math.random() * 5.5);
    }

    // Flytta dropparna
    for (let d = drops.length - 1; d >= 0; d--) {
      const p = drops[d];
      p.y += p.v * rdt * (24 / RAIN_SIZE);
      const r = Math.floor(p.y);
      while (p.last < r) {
        p.last++;
        if (p.last >= 0 && p.last < nrows) {
          const i = p.last * ncols + p.c;
          bright[i] = 1;
          glyph[i] = (Math.random() * NG) | 0;
          if (clockOf[i] >= 0) hitClock(clockOf[i]);
        }
      }
      if (p.last >= nrows + 1) drops.splice(d, 1);
    }

    // Spår tonar ut, och enstaka tecken byts (det klassiska flimret)
    const decay = rdt * 0.35;
    for (let i = 0; i < bright.length; i++) if (bright[i] > 0) bright[i] -= decay;
    const swaps = (bright.length * rdt * 0.4) | 0;
    for (let s = 0; s < swaps; s++) glyph[(Math.random() * glyph.length) | 0] = (Math.random() * NG) | 0;

    // Rita
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, vw, vh);

    const { c: A, tw, th } = atlas;
    for (let r = 0; r < nrows; r++) {
      const y = oy + r * rh;
      for (let c = 0; c < ncols; c++) {
        const i = r * ncols + c;
        const b = bright[i];
        if (b <= 0.03) continue;
        ctx.globalAlpha = b * b * dim[i];
        ctx.drawImage(A, glyph[i] * tw, 0, tw, th, ox + c * rw, y, rw, rh);
      }
    }
    // Ljusa huvuden
    const H = atlasHead.c;
    for (const p of drops) {
      if (p.last < 0 || p.last >= nrows) continue;
      const i = p.last * ncols + p.c;
      ctx.globalAlpha = dim[i] < 1 ? 0.55 : 1;
      ctx.drawImage(H, glyph[i] * tw, 0, tw, th, ox + p.c * rw, oy + p.last * rh, rw, rh);
    }

    // Klockans bokstäver
    ctx.font = `600 ${CW * 0.65}px "Josefin Sans", sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const ease = 1 - Math.exp(-dt * 3);
    for (let i = 0; i < NC * NR; i++) {
      level[i] += (target[i] - level[i]) * ease;
      const L = level[i];
      if (L < 0.01) continue;
      const x = cleft + (i % NC + 0.5) * CW;
      const y = ctop + (Math.floor(i / NC) + 0.56) * CH;
      const ch = LAY.rows[Math.floor(i / NC)][i % NC];
      if (L > 0.3 && target[i] === 1) {
        ctx.shadowColor = color.main;
        ctx.shadowBlur = CW * 0.35;
      } else {
        ctx.shadowBlur = 0;
      }
      ctx.globalAlpha = Math.min(1, L);
      ctx.fillStyle = L > 1.05 ? color.head : color.main;
      ctx.fillText(ch, x, y);
    }
    ctx.shadowBlur = 0;

    // Minutprickar i hörnen
    const corners = [
      [cleft - CW * 0.35, ctop - CH * 0.25],
      [cleft + CW * NC + CW * 0.35, ctop - CH * 0.25],
      [cleft + CW * NC + CW * 0.35, ctop + CH * NR + CH * 0.1],
      [cleft - CW * 0.35, ctop + CH * NR + CH * 0.1],
    ];
    corners.forEach(([x, y], i) => {
      dotLevel[i] += ((i < dotsOn ? 1 : OFF) - dotLevel[i]) * ease;
      ctx.globalAlpha = dotLevel[i];
      ctx.fillStyle = color.main;
      ctx.beginPath();
      ctx.arc(x, y, CW * 0.06, 0, Math.PI * 2);
      ctx.fill();
    });

    requestAnimationFrame(frame);
  }

  // ---------- Inställningar ----------
  const load = (k, d) => { try { return localStorage.getItem(k) || d; } catch { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

  function setPressed(attr, value) {
    document.querySelectorAll(`button[data-${attr}]`).forEach(b =>
      b.setAttribute("aria-pressed", b.dataset[attr] === value));
  }
  function setStyle(v) {
    style = v; setPressed("style", v); save("ordklocka-style", v);
    if (atlas) updateTime(true);
  }
  function setMode(v) {
    if (!LAYOUTS[v]) v = "12";
    LAY = LAYOUTS[v]; NC = LAY.cols; NR = LAY.rows.length;
    setPressed("mode", v); save("ordklocka-mode", v);
    document.getElementById("style-group").hidden = v !== "12";
    resetLetters();
    if (atlas) { layout(); updateTime(true); }
  }
  function setColor(v) {
    if (!COLORS[v]) v = "grön";
    color = COLORS[v]; setPressed("color", v); save("ordklocka-matrix-color", v);
    document.documentElement.style.setProperty("--c", color.main);
    if (atlas) { atlas = buildAtlas(color.main); atlasHead = buildAtlas(color.head); }
  }
  const speedInput = document.getElementById("speed");
  function setSpeed(v) {
    v = Math.min(2, Math.max(0.25, +v || 1));
    speed = v; speedInput.value = v; save("ordklocka-matrix-speed", v);
  }
  speedInput.oninput = () => setSpeed(speedInput.value);
  document.querySelectorAll("button[data-style]").forEach(b => b.onclick = () => setStyle(b.dataset.style));
  document.querySelectorAll("button[data-mode]").forEach(b => b.onclick = () => setMode(b.dataset.mode));
  document.querySelectorAll("button[data-color]").forEach(b => b.onclick = () => setColor(b.dataset.color));

  // Helskärm: knapp, dubbelklick eller F
  const fsBtn = document.getElementById("fs");
  function toggleFullscreen() {
    if (document.fullscreenElement) document.exitFullscreen?.();
    else document.documentElement.requestFullscreen?.().catch(() => {});
  }
  fsBtn.onclick = toggleFullscreen;
  cv.ondblclick = toggleFullscreen;
  document.addEventListener("keydown", e => { if (e.key === "f" || e.key === "F") toggleFullscreen(); });
  document.addEventListener("fullscreenchange", () =>
    fsBtn.setAttribute("aria-pressed", !!document.fullscreenElement));

  // Göm panel och muspekare efter 3 s utan aktivitet
  let idleTimer;
  function wake() {
    document.body.classList.remove("idle");
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => document.body.classList.add("idle"), 3000);
  }
  ["mousemove", "pointerdown", "keydown", "touchstart"].forEach(ev =>
    document.addEventListener(ev, wake, { passive: true }));

  // ---------- Start ----------
  setColor(load("ordklocka-matrix-color", "grön"));
  setMode(load("ordklocka-mode", "12"));
  setStyle(load("ordklocka-style", "tjugo"));
  setSpeed(load("ordklocka-matrix-speed", "1"));
  wake();

  let resizeTimer;
  addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { layout(); wave(); }, 150);
  });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) wave(); });

  (document.fonts?.load('600 20px "Josefin Sans"') ?? Promise.resolve())
    .catch(() => {})
    .then(() => {
      layout();
      updateTime(true);
      setInterval(() => updateTime(false), 1000);
      requestAnimationFrame(t => { prev = t; frame(t); });
    });

  // --- Närvaro: syns på /clients. Hoppas över när sidan är inbäddad
  // (idle-klockan på startsidan, som redan är listad) eller öppnad som fil.
  if (location.protocol.startsWith("http") &&
      !new URLSearchParams(location.search).has("embedded")) {
    const presence = () => {
      const ws = new WebSocket(
        (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ordklocka/matrix/ws");
      ws.onclose = () => setTimeout(presence, 10000);
      ws.onerror = () => ws.close();
    };
    presence();
  }
</script>
</body>
</html>
