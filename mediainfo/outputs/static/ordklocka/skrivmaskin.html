<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordklocka Skrivmaskin</title>
<style>
  :root {
    --panel-bg: rgba(250, 246, 236, 0.95); --panel-fg: #2b2620; --panel-accent: #2b2620; --panel-bg-solid: #faf6ec;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: radial-gradient(ellipse at 50% 30%, #6b4a33 0%, #3b2618 70%, #24170e 100%); }
  /* Pappret matas uppåt: skrivraden ligger still, arket flyttas */
  .sheet {
    position: fixed; left: 50%; width: min(78vw, 120vh); transform: translateX(-50%);
    background:
      linear-gradient(90deg, transparent 9%, rgba(200, 60, 60, 0.35) 9% calc(9% + 1px), transparent calc(9% + 1px)),
      linear-gradient(#fbf7ec, #f3ecda);
    box-shadow: 0 1vmin 3vmin rgba(0, 0, 0, 0.5); padding: 5vmin 6vmin 40vh 12%;
    font-family: "Courier Prime", "Courier New", "Nimbus Mono PS", "Liberation Mono", "DejaVu Sans Mono", monospace;
    font-size: clamp(14px, 3.4vmin, 44px); line-height: 1.7; color: #24201c;
    transition: top 0.35s cubic-bezier(.3, .7, .3, 1);
  }
  .entry { white-space: pre-wrap; min-height: 1.7em; }
  .entry.head { font-weight: 700; letter-spacing: 0.12em; margin-bottom: 0.8em; }
  .ch { display: inline-block; white-space: pre; }
  /* Valsen och maskinen under skrivraden: det oskrivna pappret är dolt,
     det skrivna matas upp ovanför, som i en riktig skrivmaskin */
  .machine { position: fixed; left: 0; right: 0; top: 64vh; bottom: 0; z-index: 2;
             background:
               linear-gradient(180deg, #0d0d0d 0, #4a4a4a 2.5vh, #1a1a1a 6vh, #050505 9vh, transparent 9vh),
               linear-gradient(180deg, #2a2a2a 9vh, #141414 100%);
             box-shadow: 0 -1vh 2vh rgba(0, 0, 0, 0.45); }
  .bail { position: fixed; left: 8vw; right: 8vw; top: calc(64vh - 0.9vh); height: 0.6vh; z-index: 3;
          background: linear-gradient(#eee, #888); border-radius: 1vh; }
  .cursor { display: inline-block; width: 0.08em; height: 1.1em; vertical-align: -0.2em; background: #c0392b; opacity: 0.7;
            animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<div class="sheet" id="sheet" aria-hidden="true"></div>
<div class="machine" aria-hidden="true"></div>
<div class="bail" id="bail" aria-hidden="true"></div>

<div class="panel">
  <div class="readout" id="readout" aria-live="polite"></div>
  <div class="controls">
    <div class="group" role="group" aria-label="Uttryck för :20 och :40">
      <span class="label">20 / 40</span>
      <button data-style="tjugo">tjugo över</button>
      <button data-style="halv">tio i halv</button>
    </div>
    <div class="group"><button id="fs" aria-pressed="false">helskärm</button></div>
  </div>
</div>

<script src="/ordklocka/tid.js"></script>
<script src="/ordklocka/sida.js"></script>
<script>
  const S = OrdklockaSida;
  const sheet = document.getElementById("sheet");
  const cursor = document.createElement("span");
  cursor.className = "cursor";
  const EXTRA = ["", "en minut", "två minuter", "tre minuter", "fyra minuter"];
  const DAYS = ["söndag", "måndag", "tisdag", "onsdag", "torsdag", "fredag", "lördag"];
  const MONTHS = ["januari", "februari", "mars", "april", "maj", "juni", "juli", "augusti", "september", "oktober", "november", "december"];

  // Skrivraden står still precis ovanför valsen; arket matas upp.
  function feed() {
    const typing = sheet.lastElementChild;
    if (!typing) return;
    // Rader långt ovanför skärmen behövs inte (tas bort före mätningen)
    while (sheet.children.length > 40) sheet.firstElementChild.remove();
    sheet.style.top = innerHeight * 0.63 - (typing.offsetTop + typing.offsetHeight) + "px";
  }

  // Skrivkö: en rad i taget, tecken för tecken, med ojämnt anslag.
  const queue = [];
  let busy = false;
  function type(text, cls) {
    queue.push({ text, cls });
    if (!busy) next();
  }
  function next() {
    const job = queue.shift();
    if (!job) { busy = false; return; }
    busy = true;
    const line = document.createElement("div");
    line.className = "entry" + (job.cls ? " " + job.cls : "");
    sheet.appendChild(line);
    feed();
    let i = 0;
    const step = () => {
      if (i < job.text.length) {
        const ch = document.createElement("span");
        ch.className = "ch";
        ch.textContent = job.text[i];
        // Typerna slår olika hårt och lite snett
        ch.style.opacity = (0.72 + Math.random() * 0.28).toFixed(2);
        ch.style.transform = `translateY(${(Math.random() - 0.5) * 0.06}em) rotate(${(Math.random() - 0.5) * 3}deg)`;
        line.appendChild(ch);
        line.appendChild(cursor);
        i++;
        const pause = job.text[i - 1] === " " ? 140 : 70 + Math.random() * 90;
        setTimeout(step, pause);
      } else {
        setTimeout(next, 500);   // vagnretur
      }
    };
    step();
  }

  let started = false;
  const clock = S.clock((t, info) => {
    const now = info.now;
    if (!started) {
      started = true;
      type(`LOGGBOK  ${DAYS[now.getDay()]} ${now.getDate()} ${MONTHS[now.getMonth()]}`.toUpperCase(), "head");
    }
    // En ny rad varje minut
    const words = OrdklockaTid.spokenWords(t).join(" ").toLowerCase();
    type(`Klockan är ${words}${t.extra ? " och " + EXTRA[t.extra] : ""}.`);
  });
  S.choice("style", "ordklocka-style", "tjugo", v => clock.setStyle(v));
  addEventListener("resize", feed);
  S.setup("/ordklocka/skrivmaskin/ws");
</script>
<script src="/ordklocka/meny.js"></script>
</body>
</html>
