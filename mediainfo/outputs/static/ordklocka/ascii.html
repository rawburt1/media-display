<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordklocka ASCII</title>
<style>
  :root { --fg: #d8f5d0; --dim: #2c4a2c;
          --panel-bg: rgba(6, 10, 6, 0.92); --panel-fg: #d8f5d0; --panel-accent: #7dff7a; --panel-bg-solid: #060a06; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #050805; }
  pre { position: fixed; inset: 0; margin: 0; display: grid; place-items: center; color: var(--fg);
        font-family: "DejaVu Sans Mono", "Menlo", "Consolas", "Courier New", monospace; line-height: 1; white-space: pre;
        text-shadow: 0 0 0.35em rgba(125, 255, 122, 0.35); }
  pre .d { color: var(--dim); text-shadow: none; }
</style>
<link rel="stylesheet" href="/ordklocka/tillganglighet.css"></head>
<body>
<pre id="out" aria-hidden="true"></pre>

<div class="panel">
  <div class="readout" id="readout" aria-live="polite"></div>
  <div class="controls">
    <div class="group" role="group" aria-label="Uttryck för :20 och :40">
      <span class="label">20 / 40</span>
      <button data-style="tjugo">tjugo över</button>
      <button data-style="halv">tio i halv</button>
    </div>
    <div class="group" role="group" aria-label="Tecken">
      <span class="label">Tecken</span>
      <button data-chars="#">#</button>
      <button data-chars="@">@</button>
      <button data-chars="/">/ \</button>
      <button data-chars="*">*</button>
      <button data-chars="tonad">tonad</button>
    </div>
    <div class="group" role="group" aria-label="Detalj">
      <span class="label">Detalj</span>
      <button data-detail="grov">grov</button>
      <button data-detail="fin">fin</button>
    </div>
    <div class="group"><button id="fs" aria-pressed="false">helskärm</button></div>
  </div>
</div>

<script src="/ordklocka/tid.js"></script>
<script src="/ordklocka/sida.js"></script>
<script src="/ordklocka/textmask.js"></script>
<script>
  const S = OrdklockaSida;
  // Texten byggs av ASCII-tecken. Teckenuppsättning och detaljnivå går att
  // välja; "/ \" följer bokstävernas kanter, "tonad" använder en gråskala av
  // tecken. När orden ändras krypteras tecknen och avkodas till det nya.
  const out = document.getElementById("out");
  const RAMP = " .:-=+*#%@";
  let charset = "#", detail = "grov", lines = [], grid = [], cols = 0, rows = 0, decoding = 0, prevGrid = [];

  function cellsFor(ls) {
    cols = detail === "fin" ? 150 : 84;
    // Ett tecken är ungefär 0,6 brett och 1 högt
    rows = Math.max(12, Math.round(innerHeight / innerWidth * cols * 0.602));
    const fontPx = Math.min(innerWidth / (cols * 0.602), innerHeight / rows);
    out.style.fontSize = fontPx + "px";
    // Masken i teckenupplösning, 3x3 delprov per tecken
    const sub = 3, A = 1 / 0.602;   // A: teckenrutans höjd/bredd
    const m = OrdklockaMask.mask(["KLOCKAN ÄR", ...ls], cols * sub, rows * sub * A, { pad: 0.06, lineHeight: 1.12 });
    const g = [];
    for (let r = 0; r < rows; r++) {
      const row = [];
      for (let c = 0; c < cols; c++) {
        let sum = 0;
        for (let i = 0; i < sub; i++) for (let j = 0; j < sub; j++) sum += m.at(c * sub + i, (r * sub + j) * A);
        const v = sum / (sub * sub);
        let chr = " ";
        if (charset === "tonad") chr = RAMP[Math.min(RAMP.length - 1, Math.floor(v * RAMP.length))];
        else if (charset === "/") {
          if (v > 0.12) {
            // Kantens riktning ur maskens lutning
            const gx = m.at(c * sub + sub, (r * sub + 1) * A) - m.at(c * sub - 1, (r * sub + 1) * A);
            const gy = m.at(c * sub + 1, (r * sub + sub) * A) - m.at(c * sub + 1, (r * sub - 1) * A);
            if (v > 0.75 || (Math.abs(gx) < 0.2 && Math.abs(gy) < 0.2)) chr = "#";
            else if (Math.abs(gx) > Math.abs(gy) * 2) chr = "|";
            else if (Math.abs(gy) > Math.abs(gx) * 2) chr = "-";
            else chr = gx * gy > 0 ? "\\" : "/";
          }
        } else chr = v > 0.28 ? charset : " ";
        row.push(chr);
      }
      g.push(row);
    }
    return g;
  }

  const NOISE = "!#$%&*+/<=>?@[]^{}|~0123456789ABCDEF";
  function draw(t) {
    const k = decoding ? Math.min(1, (t - decoding) / 1400) : 1;
    let html = "";
    for (let r = 0; r < rows; r++) {
      let line = "";
      for (let c = 0; c < cols; c++) {
        const ch = grid[r][c];
        // Avkodning: varje tecken landar vid sin egen tidpunkt
        const when = ((c * 7 + r * 13) % 97) / 97;
        if (k < 1 && when > k && (ch !== " " || (prevGrid[r] && prevGrid[r][c] !== " "))) line += NOISE[(Math.random() * NOISE.length) | 0];
        else line += ch;
      }
      html += line.replace(/&/g, "&amp;").replace(/</g, "&lt;") + "\n";
    }
    out.innerHTML = html;
    if (k < 1) requestAnimationFrame(draw); else decoding = 0;
  }

  function rebuild(animate) {
    prevGrid = grid;
    grid = cellsFor(lines);
    if (animate && !matchMedia("(prefers-reduced-motion: reduce)").matches) { decoding = performance.now(); requestAnimationFrame(draw); }
    else draw(performance.now());
  }

  const clock = S.clock((t, info) => {
    if (!info.wordsChanged) return;
    lines = S.lines(t);
    rebuild(!info.first);
  });
  S.choice("style", "ordklocka-style", "tjugo", v => clock.setStyle(v));
  S.choice("chars", "ordklocka-ascii-tecken", "#", v => { charset = v; if (lines.length) rebuild(false); });
  S.choice("detail", "ordklocka-ascii-detalj", "grov", v => { detail = v; if (lines.length) rebuild(false); });
  addEventListener("resize", () => lines.length && rebuild(false));
  S.setup("/ordklocka/ascii/ws");
</script>
<script src="/ordklocka/meny.js"></script>
</body>
</html>
