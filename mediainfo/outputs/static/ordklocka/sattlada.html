<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordklocka Sättlåda</title>
<style>
  :root {
    --panel-bg: rgba(36, 28, 20, 0.92); --panel-fg: #efe4d0; --panel-accent: #efe4d0;
    --panel-bg-solid: #241c14;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.07) 0 2px, transparent 2px 16px),
                linear-gradient(180deg, #4a3523, #2f2116);
    font-family: Georgia, "DejaVu Serif", serif;
  }
  /* Sättlådan: träfack med typer */
  .case {
    position: fixed; left: 50%; top: 2.5vh; transform: translateX(-50%);
    display: grid; grid-template-columns: repeat(15, var(--fack)); gap: calc(var(--fack) * 0.06);
    padding: calc(var(--fack) * 0.12); background: #6b4a2b; border-radius: 0.6vmin;
    box-shadow: inset 0 0 0 0.5vmin #4d331c, 0 1vmin 2vmin rgba(0, 0, 0, 0.4);
  }
  .fack {
    position: relative; width: var(--fack); height: calc(var(--fack) * 0.62);
    background: linear-gradient(180deg, #2e1f12, #4a3220); border-radius: 2px;
    box-shadow: inset 0 0.4vmin 0.6vmin rgba(0, 0, 0, 0.6);
  }
  .fack b { position: absolute; left: 6%; top: 4%; font: 700 calc(var(--fack) * 0.2) / 1 system-ui, sans-serif; color: rgba(255, 235, 200, 0.55); }
  .fack i { position: absolute; bottom: 12%; width: 16%; height: 38%; border-radius: 1px;
            background: linear-gradient(90deg, #6d7377, #b8bec2 45%, #7c8286); }
  /* Vinkelhaken och tryckprovet */
  .bench { position: fixed; left: 0; right: 0; bottom: 4vh; top: calc(var(--fack) * 2.4 + 7vh);
           display: flex; align-items: center; justify-content: center; gap: 3vw; padding: 0 3vw; }
  .stick {
    position: relative; padding: calc(var(--sort) * 0.25) calc(var(--sort) * 0.4);
    background: linear-gradient(180deg, #c9cdd0, #8f959a); border-radius: 0.5vmin;
    box-shadow: inset 0 0 0 0.35vmin #6f757a, 0 1vmin 2vmin rgba(0, 0, 0, 0.45);
  }
  .stick .line { display: flex; height: calc(var(--sort) * 1.25); margin: calc(var(--sort) * 0.06) 0; }
  .sort {
    width: calc(var(--sort) * 0.82); height: calc(var(--sort) * 1.25); flex: none;
    background: linear-gradient(90deg, #5f666b, #a8afb4 40%, #6c7378); border-right: 1px solid #3f4448;
    display: grid; place-items: center;
    font: 700 calc(var(--sort) * 0.82) / 1 Georgia, "DejaVu Serif", serif; color: #2b2f33;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
  }
  .sort span { display: inline-block; transform: scaleX(-1); }   /* typerna är spegelvända */
  .sort.space { background: linear-gradient(90deg, #4c5256, #757c81); width: calc(var(--sort) * 0.5); }
  .flying { position: fixed; z-index: 20; }
  .proof {
    position: relative; padding: 4vmin 4.5vmin; background: #f7f2e6; min-width: 26vw;
    box-shadow: 0 1vmin 3vmin rgba(0, 0, 0, 0.45); transform: rotate(1.2deg);
  }
  .proof p { margin: 0; text-align: center; color: #111; font: 700 var(--print) / 1.2 Georgia, "DejaVu Serif", serif; letter-spacing: 0.04em; }
  .proof p.small { font-size: calc(var(--print) * 0.62); letter-spacing: 0.2em; margin-bottom: 0.4em; }
  .proof .roller { position: absolute; top: -2%; bottom: -2%; width: 2.2vmin; left: -3vmin;
                   background: linear-gradient(90deg, #111, #444 50%, #111); border-radius: 1vmin; opacity: 0; }
  .proof .ticks { display: flex; gap: 0.6em; justify-content: center; margin-top: 0.6em; }
  .proof .ticks i { width: 0.5em; height: 0.5em; border: 2px solid #111; border-radius: 50%; }
  .proof .ticks i.on { background: #111; }
</style>
</head>
<body>
<div class="case" id="case" aria-hidden="true"></div>
<div class="bench" aria-hidden="true">
  <div class="stick" id="stick"></div>
  <div class="proof" id="proof"><div class="roller" id="roller"></div><div id="print"></div><div class="ticks" id="ticks"></div></div>
</div>

<div class="panel">
  <div class="readout" id="readout" aria-live="polite"></div>
  <div class="controls">
    <div class="group" role="group" aria-label="Uttryck för :20 och :40">
      <span class="label">20 / 40</span>
      <button data-style="tjugo">tjugo över</button>
      <button data-style="halv">tio i halv</button>
    </div>
    <div class="group"><button id="fs" aria-pressed="false">helskärm</button></div>
  </div>
</div>

<script src="/ordklocka/tid.js"></script>
<script src="/ordklocka/sida.js"></script>
<script>
  const S = OrdklockaSida;
  const ALPHABET = [..."ABCDEFGHIJKLMNOPQRSTUVWXYZÅÄÖ"];
  const caseEl = document.getElementById("case"), stick = document.getElementById("stick");
  const printEl = document.getElementById("print"), roller = document.getElementById("roller");
  const ticks = document.getElementById("ticks");
  const fack = {};
  // Facken: alfabetet plus några skiljetecken, som i en riktig sättlåda.
  [...ALPHABET, "&", ".", ",", "!", "?", "-", "'", ":", ";", "(", ")", "*", "1", "2", "3", "4"].slice(0, 45).forEach(ch => {
    const d = document.createElement("div");
    d.className = "fack";
    d.innerHTML = "<b></b>";
    d.firstChild.textContent = ch;
    for (let i = 0; i < 4; i++) {
      const s = document.createElement("i");
      s.style.left = 30 + i * 14 + Math.random() * 6 + "%";
      d.appendChild(s);
    }
    caseEl.appendChild(d);
    fack[ch] = d;
  });

  function resize() {
    const f = Math.min(innerWidth * 0.94 / 15.6, innerHeight * 0.3 / (3 * 0.7));
    const benchH = innerHeight - (f * 2.4 + innerHeight * 0.11);
    const sort = Math.min(innerWidth * 0.55 / (14 * 0.82 + 0.8), benchH * 0.85 / (3 * 1.37 + 0.5));
    const root = document.documentElement.style;
    root.setProperty("--fack", f + "px");
    root.setProperty("--sort", sort + "px");
    root.setProperty("--print", Math.min(innerWidth * 0.3 / 10, sort * 0.75) + "px");
  }

  function sortEl(ch) {
    const d = document.createElement("div");
    d.className = ch === " " ? "sort space" : "sort";
    if (ch !== " ") { const s = document.createElement("span"); s.textContent = ch; d.appendChild(s); }
    return d;
  }

  let job = 0;
  function compose(lines, animate) {
    const my = ++job;
    // Gamla typer läggs tillbaka (tonar ut), nya plockas i läsordning.
    stick.replaceChildren();
    printEl.style.opacity = 0;
    const sorts = [];
    for (const line of lines) {
      const row = document.createElement("div");
      row.className = "line";
      for (const ch of line) { const s = sortEl(ch); row.appendChild(s); sorts.push([s, ch]); }
      stick.appendChild(row);
    }
    printEl.replaceChildren(...lines.map((l, i) => {
      const p = document.createElement("p");
      if (i === 0) p.className = "small";
      p.textContent = l;
      return p;
    }));
    if (!animate || matchMedia("(prefers-reduced-motion: reduce)").matches) { printEl.style.opacity = 1; return; }

    sorts.forEach(([s]) => { s.style.visibility = "hidden"; });
    let i = 0;
    const pick = () => {
      if (my !== job) return;
      const item = sorts[i++];
      if (!item) { setTimeout(() => my === job && printProof(), 400); return; }
      const [s, ch] = item;
      const from = (fack[ch] || caseEl).getBoundingClientRect(), to = s.getBoundingClientRect();
      if (ch === " ") { s.style.visibility = ""; setTimeout(pick, 40); return; }
      const fly = s.cloneNode(true);
      fly.classList.add("flying");
      fly.style.left = to.left + "px"; fly.style.top = to.top + "px"; fly.style.visibility = "";
      document.body.appendChild(fly);
      fly.animate([
        { transform: `translate(${from.left + from.width / 2 - to.left - to.width / 2}px, ${from.top - to.top}px) scale(0.6) rotate(-20deg)` },
        { transform: "translate(0, -20%) scale(1.05) rotate(3deg)", offset: 0.8 },
        { transform: "none" },
      ], { duration: 520, easing: "cubic-bezier(0.3, 0.6, 0.3, 1)" }).finished.then(() => { fly.remove(); s.style.visibility = ""; });
      setTimeout(pick, 110);
    };
    setTimeout(pick, 300);
  }

  function printProof() {
    // Färgvalsen rullar över provet och texten trycks fram.
    roller.animate([{ opacity: 1, left: "-3vmin" }, { opacity: 1, left: "calc(100% + 1vmin)" }, { opacity: 0 }],
                   { duration: 1100, easing: "ease-in-out" });
    printEl.animate([{ opacity: 0, clipPath: "inset(0 100% 0 0)" }, { opacity: 1, clipPath: "inset(0 0 0 0)" }],
                    { duration: 1000, easing: "ease-in-out", fill: "forwards" });
    printEl.style.opacity = 1;
  }

  const clock = S.clock((t, info) => {
    if (info.wordsChanged) compose(["KLOCKAN ÄR", ...S.lines(t)], true);
    ticks.replaceChildren(...[0, 1, 2, 3].map(k => { const i = document.createElement("i"); if (k < t.extra) i.className = "on"; return i; }));
  });
  addEventListener("resize", resize);
  resize();
  S.choice("style", "ordklocka-style", "tjugo", v => clock.setStyle(v));
  S.setup("/ordklocka/sattlada/ws");
</script>
<script src="/ordklocka/meny.js"></script>
</body>
</html>
