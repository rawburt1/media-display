<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordklocka Sand</title>
<style>
  :root { --panel-bg: rgba(238, 226, 200, 0.92); --panel-fg: #4a3d2a; --panel-accent: #8a6d43; --panel-bg-solid: #eee2c8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #d8c6a0; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: auto; }
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>

<div class="panel">
  <div class="readout" id="readout" aria-live="polite"></div>
  <div class="controls">
    <div class="group" role="group" aria-label="Uttryck för :20 och :40">
      <span class="label">20 / 40</span>
      <button data-style="tjugo">tjugo över</button>
      <button data-style="halv">tio i halv</button>
    </div>
    <div class="group"><button id="fs" aria-pressed="false">helskärm</button></div>
  </div>
</div>

<script src="/ordklocka/tid.js"></script>
<script src="/ordklocka/sida.js"></script>
<script src="/ordklocka/textmask.js"></script>
<script>
  const S = OrdklockaSida;
  // Texten är intryckt i fin sand, med krattade fåror runt omkring. När
  // tiden ändras drar en osynlig kratta över bädden från vänster: bakom den
  // är det gamla uttrycket utsuddat och det nya inritat. Höjdfältet skuggas
  // med ett snett ljus, så att fårorna och bokstäverna får mjuka skuggor.
  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  const SCALE = 2.5;                      // höjdfältet räknas i lägre upplösning
  let w = 0, h = 0, img, grain, oldMask = null, newMask = null, rake = 1, rakeStart = 0, extra = 0;
  const RAKE_MS = 4200;

  function build() {
    w = Math.ceil(innerWidth / SCALE); h = Math.ceil(innerHeight / SCALE);
    cv.width = w; cv.height = h;
    img = ctx.createImageData(w, h);
    grain = new Float32Array(w * h).map(() => Math.random());
    if (lines.length) { newMask = textHeight(lines); oldMask = null; rake = 1; }
    paint();
  }

  // Bokstävernas djup: suddig mask så att kanterna sluttar mjukt.
  function textHeight(ls) {
    const m = OrdklockaMask.mask(ls, w, h, { pad: 0.1, lineHeight: 1.12, blur: Math.max(1, w / 400), family: '"Georgia", "DejaVu Serif", serif', weight: 700 });
    const out = new Float32Array(w * h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) out[y * w + x] = m.at(x, y);
    return out;
  }

  // Fårorna: vågiga parallella linjer; krattan lämnar raka spår efter sig.
  function furrow(x, y, fresh) {
    const wave = Math.sin(x * 0.012 * SCALE) * 6 + Math.sin(x * 0.004 * SCALE + 1.3) * 10;
    return Math.sin((y * SCALE + (fresh ? 0 : wave)) * 0.33) * 0.5;
  }

  function heightAt(x, y, i) {
    const behind = x / w < rake;          // krattan har passerat
    const m = behind ? newMask : oldMask;
    const text = m ? m[i] : 0;
    // Strax bakom krattan är sanden uppriven
    const near = Math.abs(x / w - rake) < 0.02 ? (Math.random() - 0.5) * 0.8 : 0;
    return furrow(x, y, false) * (1 - text * 0.85) - text * 2.2 + near + grain[i] * 0.12;
  }

  function paint() {
    const d = img.data;
    let prevRow = new Float32Array(w), row = new Float32Array(w);
    for (let x = 0; x < w; x++) prevRow[x] = heightAt(x, 0, x);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) row[x] = y ? heightAt(x, y, y * w + x) : prevRow[x];
      for (let x = 0; x < w; x++) {
        const hx = row[Math.min(w - 1, x + 1)] - row[Math.max(0, x - 1)];
        const hy = row[x] - prevRow[x];
        // Ljus från övre vänstra hörnet
        const l = 0.86 - (hx * 0.35 + hy * 0.55) + grain[y * w + x] * 0.06;
        const deep = Math.max(0, -row[x] - 0.6) * 0.06;   // botten i bokstäverna lite mörkare
        const k = (y * w + x) * 4;
        d[k] = Math.min(255, (226 - deep * 200) * l);
        d[k + 1] = Math.min(255, (205 - deep * 200) * l);
        d[k + 2] = Math.min(255, (160 - deep * 170) * l);
        d[k + 3] = 255;
      }
      [prevRow, row] = [row, prevRow];
    }
    ctx.putImageData(img, 0, 0);
    // Extraminuterna: små stenar nere till höger
    for (let i = 0; i < 4; i++) {
      const sx = w * (0.86 + i * 0.03), sy = h * 0.9, r = Math.max(2, w / 160);
      ctx.beginPath(); ctx.ellipse(sx + r * 0.3, sy + r * 0.4, r, r * 0.7, 0, 0, 7);
      ctx.fillStyle = i < extra ? "rgba(60, 45, 30, 0.35)" : "rgba(0, 0, 0, 0)"; ctx.fill();
      ctx.beginPath(); ctx.ellipse(sx, sy, r, r * 0.75, 0, 0, 7);
      ctx.fillStyle = i < extra ? "#6b6257" : "rgba(120, 100, 70, 0.18)"; ctx.fill();
    }
  }

  function sweep(now) {
    rake = Math.min(1, (now - rakeStart) / RAKE_MS);
    paint();
    if (rake < 1) requestAnimationFrame(sweep);
    else oldMask = newMask;
  }

  let lines = [];
  const clock = S.clock((t, info) => {
    extra = t.extra;
    if (!info.wordsChanged) { paint(); return; }
    lines = S.lines(t).map(l => l.toLowerCase());
    if (!w) return;
    const next = textHeight(lines);
    if (info.first || !newMask || matchMedia("(prefers-reduced-motion: reduce)").matches) {
      oldMask = newMask = next; rake = 1; paint(); return;
    }
    oldMask = newMask; newMask = next;
    rake = 0; rakeStart = performance.now();
    requestAnimationFrame(sweep);
  });
  S.choice("style", "ordklocka-style", "tjugo", v => clock.setStyle(v));
  addEventListener("resize", build);
  build();
  S.setup("/ordklocka/sand/ws");
</script>
<script src="/ordklocka/meny.js"></script>
</body>
</html>
