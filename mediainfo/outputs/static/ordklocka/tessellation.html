<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordklocka Tessellation</title>
<style>
  :root { --panel-bg: rgba(16, 20, 28, 0.92); --panel-fg: #eef; --panel-accent: #ffd27a; --panel-bg-solid: #10141c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10141c; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
</style>
<link rel="stylesheet" href="/ordklocka/tillganglighet.css"></head>
<body>
<canvas id="c" aria-hidden="true"></canvas>

<div class="panel">
  <div class="readout" id="readout" aria-live="polite"></div>
  <div class="controls">
    <div class="group" role="group" aria-label="Uttryck för :20 och :40">
      <span class="label">20 / 40</span>
      <button data-style="tjugo">tjugo över</button>
      <button data-style="halv">tio i halv</button>
    </div>
    <div class="group" role="group" aria-label="Form">
      <span class="label">Form</span>
      <button data-shape="trianglar">trianglar</button>
      <button data-shape="hexagoner">hexagoner</button>
    </div>
    <div class="group"><button id="fs" aria-pressed="false">helskärm</button></div>
  </div>
</div>

<script src="/ordklocka/tid.js"></script>
<script src="/ordklocka/sida.js"></script>
<script src="/ordklocka/textmask.js"></script>
<script>
  const S = OrdklockaSida;
  // Skärmen täcks av trianglar (eller hexagoner) som passar exakt ihop.
  // Tidsorden syns där brickorna byter till en ljus färg. Resten av mönstret
  // skiftar långsamt i färg i ringar från mitten, så att symmetrin består.
  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  let W, H, dpr, tiles = [], lines = [], shape = "trianglar", changeAt = 0;

  function build() {
    dpr = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const s = Math.max(9, Math.min(W, H) / (shape === "hexagoner" ? 46 : 34));
    const prev = new Map(tiles.map(t => [t.key, t]));
    tiles = [];
    if (shape === "hexagoner") {
      const hw = Math.sqrt(3) * s * 0.5, hh = s * 1.5;
      for (let row = -1; row * hh < H + s; row++) for (let col = -1; col * hw * 2 < W + hw * 2; col++) {
        const cx = col * hw * 2 + (row % 2 ? hw : 0), cy = row * hh;
        const pts = [...Array(6)].map((_, k) => [cx + Math.cos(Math.PI / 6 + k * Math.PI / 3) * s, cy + Math.sin(Math.PI / 6 + k * Math.PI / 3) * s]);
        tiles.push({ key: `h${row},${col}`, cx, cy, pts });
      }
    } else {
      const th = s * Math.sqrt(3) / 2;
      for (let row = -1; row * th < H + th; row++) for (let col = -2; col * s / 2 < W + s; col++) {
        const up = (row + col) % 2 === 0;
        const x = col * s / 2, y = row * th;
        const pts = up ? [[x, y + th], [x + s / 2, y], [x + s, y + th]] : [[x, y], [x + s, y], [x + s / 2, y + th]];
        tiles.push({ key: `t${row},${col}`, cx: x + s / 2, cy: y + th * (up ? 2 / 3 : 1 / 3), pts });
      }
    }
    for (const t of tiles) { const p = prev.get(t.key); t.on = p ? p.on : 0; t.want = p ? p.want : 0; t.delay = 0; }
    if (lines.length) light(false);
  }

  function light(animate) {
    const m = OrdklockaMask.mask(["KLOCKAN ÄR", ...lines], W, H, { pad: 0.07, lineHeight: 1.1 });
    const now = performance.now();
    for (const t of tiles) {
      const want = m.at(t.cx, t.cy) > 0.5 ? 1 : 0;
      if (want !== t.want) {
        t.want = want;
        // Bytet sprider sig som en våg från mitten
        t.delay = animate ? now + Math.hypot(t.cx - W / 2, t.cy - H / 2) * 2.2 : 0;
      }
    }
    changeAt = now;
  }

  function frame(time) {
    const T = time / 1000;
    for (const t of tiles) {
      if (time >= t.delay) t.on += (t.want - t.on) * 0.12;
      const d = Math.hypot(t.cx - W / 2, t.cy - H / 2) / Math.hypot(W, H);
      // Ringar som långsamt vandrar utåt: symmetriskt runt mitten
      const ring = Math.sin(d * 18 - T * 0.25);
      const hue = 205 + ring * 25 + Math.sin(T * 0.05) * 40;
      const lit = 0.13 + 0.06 * (ring + 1);
      const on = t.on;
      const h = hue + (38 - hue) * on, sat = 45 + on * 50, li = lit * 100 + on * 45;
      ctx.beginPath();
      t.pts.forEach(([x, y], k) => k ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
      ctx.closePath();
      ctx.fillStyle = `hsl(${h}, ${sat}%, ${li}%)`;
      ctx.fill();
      ctx.strokeStyle = "rgba(0, 0, 0, 0.35)"; ctx.lineWidth = 1; ctx.stroke();
    }
    requestAnimationFrame(frame);
  }

  const clock = S.clock((t, info) => {
    if (!info.wordsChanged) return;
    lines = S.lines(t);
    if (W) light(!info.first);
  });
  S.choice("style", "ordklocka-style", "tjugo", v => clock.setStyle(v));
  S.choice("shape", "ordklocka-tessellation-form", "trianglar", v => { shape = v; if (W) build(); });
  addEventListener("resize", build);
  build();
  requestAnimationFrame(frame);
  S.setup("/ordklocka/tessellation/ws");
</script>
<script src="/ordklocka/meny.js"></script>
</body>
</html>
