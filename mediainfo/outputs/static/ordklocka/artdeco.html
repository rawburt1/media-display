<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordklocka Art déco</title>
<style>
  @font-face {
    font-family: "Josefin Sans";
    font-style: normal;
    font-weight: 600;
    font-display: block;
    src: url("/ordklocka/fonts/josefin-sans-latin-600.woff2") format("woff2");
  }
  :root {
    --gold: #d4af37; --gold-hi: #fff1b8; --gold-lo: #8a6a1c; --dim: #2a2419;
    --panel-bg: rgba(8, 7, 5, 0.94); --panel-fg: #e8d9a8; --panel-accent: #d4af37; --panel-bg-solid: #080705;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070604; }
  body {
    background:
      repeating-conic-gradient(from 0deg at 50% 118%, rgba(212, 175, 55, 0.05) 0 3deg, transparent 3deg 9deg),
      radial-gradient(ellipse at 50% 50%, #15120c 0%, #070604 75%);
  }
  svg.frame { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .board { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); display: grid;
           font-family: "Josefin Sans", "Futura", "Century Gothic", sans-serif; font-weight: 600; }
  .cell { display: grid; place-items: center; color: var(--dim); transition: color 1.2s, text-shadow 1.2s; }
  .cell.lit {
    color: var(--gold);
    background: linear-gradient(170deg, var(--gold-hi) 0%, var(--gold) 38%, var(--gold-lo) 62%, var(--gold) 80%, var(--gold-hi) 100%);
    background-size: 100% 300%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 0.18em rgba(212, 175, 55, 0.55));
    animation: shimmer 7s ease-in-out infinite;
  }
  @keyframes shimmer { 0%, 100% { background-position: 0 0; } 50% { background-position: 0 100%; } }
  .gems { position: fixed; left: 50%; bottom: 4.5vh; transform: translateX(-50%); display: flex; gap: 2.4vmin; }
  .gems i { width: 1.8vmin; height: 1.8vmin; transform: rotate(45deg); border: 0.25vmin solid var(--gold-lo); }
  .gems i.on { background: var(--gold); border-color: var(--gold-hi); box-shadow: 0 0 1.2vmin rgba(212, 175, 55, 0.8); }
  @media (prefers-reduced-motion: reduce) { .cell.lit { animation: none; } }
</style>
</head>
<body>
<svg class="frame" id="frame" aria-hidden="true"></svg>
<div class="board" id="board" aria-hidden="true"></div>
<div class="gems" id="gems" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<div class="panel">
  <div class="readout" id="readout" aria-live="polite"></div>
  <div class="controls">
    <div class="group" role="group" aria-label="Uttryck för :20 och :40">
      <span class="label">20 / 40</span>
      <button data-style="tjugo">tjugo över</button>
      <button data-style="halv">tio i halv</button>
    </div>
    <div class="group"><button id="fs" aria-pressed="false">helskärm</button></div>
  </div>
</div>

<script src="/ordklocka/tid.js"></script>
<script src="/ordklocka/sida.js"></script>
<script src="/ordklocka/rutnat.js"></script>
<script>
  const S = OrdklockaSida;
  const R = OrdklockaRutnat;
  const board = document.getElementById("board");
  const gems = [...document.querySelectorAll("#gems i")];
  const NR = R.ROWS.length, NC = R.COLS;
  const cells = R.ROWS.map(row => [...row].map(ch => {
    const el = document.createElement("div");
    el.className = "cell";
    el.textContent = ch;
    board.appendChild(el);
    return el;
  }));

  // Geometrisk ram: dubbla linjer med trappstegshörn och solfjädrar
  // upptill och nedtill, ritad efter rutnätets storlek.
  function frame(bx, by, bw, bh) {
    const g = "#d4af37", W = innerWidth, H = innerHeight, m = Math.min(W, H);
    const p = m * 0.035, x0 = bx - p, y0 = by - p, x1 = bx + bw + p, y1 = by + bh + p, s = m * 0.03;
    const step = (x, y, dx, dy) =>
      `M ${x} ${y + dy * s * 3} L ${x} ${y + dy * s} L ${x + dx * s} ${y + dy * s} L ${x + dx * s} ${y} L ${x + dx * s * 3} ${y}`;
    const fan = (cx, cy, dir) => {
      let d = "";
      for (let i = 0; i <= 10; i++) {
        const a = Math.PI * (0.15 + 0.7 * i / 10);
        d += `M ${cx} ${cy} L ${cx + Math.cos(a) * m * 0.09} ${cy - dir * Math.sin(a) * m * 0.09} `;
      }
      return d;
    };
    const svg = document.getElementById("frame");
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.innerHTML = `
      <g fill="none" stroke="${g}" stroke-linecap="square">
        <rect x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}" stroke-width="${m * 0.004}"/>
        <rect x="${x0 + m * 0.012}" y="${y0 + m * 0.012}" width="${x1 - x0 - m * 0.024}" height="${y1 - y0 - m * 0.024}" stroke-width="${m * 0.0015}" opacity="0.7"/>
        <g stroke-width="${m * 0.003}">
          <path d="${step(x0 - s * 0.8, y0 - s * 0.8, 1, 1)}"/><path d="${step(x1 + s * 0.8, y0 - s * 0.8, -1, 1)}"/>
          <path d="${step(x0 - s * 0.8, y1 + s * 0.8, 1, -1)}"/><path d="${step(x1 + s * 0.8, y1 + s * 0.8, -1, -1)}"/>
        </g>
        <path d="${fan(W / 2, y0, 1)}" stroke-width="${m * 0.0018}" opacity="0.85"/>
        <path d="${fan(W / 2, y1, -1)}" stroke-width="${m * 0.0018}" opacity="0.85"/>
        <circle cx="${W / 2}" cy="${y0}" r="${m * 0.012}" fill="#070604" stroke-width="${m * 0.003}"/>
        <circle cx="${W / 2}" cy="${y1}" r="${m * 0.012}" fill="#070604" stroke-width="${m * 0.003}"/>
      </g>`;
  }

  function size() {
    const cw = Math.min(innerWidth * 0.74 / NC, innerHeight * 0.74 / (NR * 1.05));
    board.style.gridTemplateColumns = `repeat(${NC}, ${cw}px)`;
    board.style.gridAutoRows = cw * 1.05 + "px";
    board.style.fontSize = cw * 0.66 + "px";
    const r = board.getBoundingClientRect();
    frame(r.left, r.top, r.width, r.height);
  }

  let style = "tjugo";
  const clock = S.clock((t, info) => {
    const [lit] = R.reading(info.now.getHours(), info.now.getMinutes(), style);
    const on = new Set();
    lit.forEach(([r, c, n]) => { for (let k = 0; k < n; k++) on.add(r * NC + c + k); });
    cells.forEach((row, r) => row.forEach((el, c) => el.classList.toggle("lit", on.has(r * NC + c))));
    gems.forEach((g, i) => g.classList.toggle("on", i < t.extra));
  });
  S.choice("style", "ordklocka-style", "tjugo", v => { style = v; clock.setStyle(v); });
  addEventListener("resize", size);
  size();
  document.fonts?.ready.then(size);
  S.setup("/ordklocka/artdeco/ws");
</script>
<script src="/ordklocka/meny.js"></script>
</body>
</html>
