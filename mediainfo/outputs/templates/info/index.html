<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Now Playing - Info</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #fff;
                  font-family: sans-serif; overflow: hidden; }
    #layout { display: flex; width: 100vw; height: 100vh; }
    #art-container { position: relative; flex: 1 1 60%; height: 100%; background: #000; }
    #art-container.fullscreen { flex: 1 1 100%; }
    #art-container img {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: contain; opacity: 0;
      transition: opacity 1s ease-in-out, transform 1s ease-in-out;
    }
    #art-container.fullscreen img { object-fit: cover; }
    {{ transitions_css }}
    #panel { flex: 0 0 40%; padding: 2em; box-sizing: border-box;
             display: flex; flex-direction: column; overflow-y: auto; }
    #panel.hidden { display: none; }
    #title { font-size: 2em; font-weight: 600; }
    #subtitle { font-size: 1.3em; opacity: 0.8; margin-top: 0.2em; }
    #rating { font-size: 1.1em; margin-top: 0.4em; opacity: 0.9; }
    #rating:empty { display: none; }
    #progress { display: none; height: 4px; margin-top: 0.9em;
                background: rgba(255, 255, 255, 0.25); border-radius: 2px; overflow: hidden; }
    #progress-fill { width: 0%; height: 100%; background: #fff; border-radius: 2px; }
    #summary { font-size: 1.1em; line-height: 1.5; margin-top: 1em; opacity: 0.95; }
  </style>
</head>
<body>
  <div id="layout">
    <div id="art-container">
      <img id="art-a" alt="">
      <img id="art-b" alt="">
    </div>
    <div id="panel">
      <div id="title"></div>
      <div id="subtitle"></div>
      <div id="rating"></div>
      <div id="progress"><div id="progress-fill"></div></div>
      <div id="summary"></div>
    </div>
  </div>
  <script>
    {{ transitions_js }}

    let lastImage = null;
    let activeImg = document.getElementById("art-a");
    let standbyImg = document.getElementById("art-b");

    function showImage(src) {
      prepareForTransition(standbyImg);
      standbyImg.onload = standbyImg.onerror = () => {
        activeImg.classList.remove("visible");
        standbyImg.classList.add("visible");
        [activeImg, standbyImg] = [standbyImg, activeImg];
      };
      standbyImg.src = src;
    }

    function applyState(data) {
      const title = document.getElementById("title");
      const subtitle = document.getElementById("subtitle");
      const rating = document.getElementById("rating");
      const summary = document.getElementById("summary");
      const artContainer = document.getElementById("art-container");
      const panel = document.getElementById("panel");

      if (data.image) {
        if (data.image !== lastImage) {
          showImage(data.image);
          lastImage = data.image;
        }
      } else {
        activeImg.classList.remove("visible");
        standbyImg.classList.remove("visible");
        lastImage = null;
      }

      const isIdle = data.source === "idle";
      artContainer.classList.toggle("fullscreen", isIdle);
      panel.classList.toggle("hidden", isIdle);

      title.textContent = data.title || "";
      subtitle.textContent = data.subtitle || "";
      rating.textContent = data.rating ? "★ " + data.rating + "/10" : "";
      summary.textContent = data.summary || "";
      setProgress(data);
    }

    // Payloads only arrive on item changes and rotation ticks, so the bar
    // advances locally at 1s/s from the last reported position; each new
    // payload re-anchors it (correcting for pauses/seeks within one tick).
    let progress = null;

    function setProgress(data) {
      progress = (typeof data.position_seconds === "number" && data.duration_seconds > 0)
        ? { position: data.position_seconds, duration: data.duration_seconds, at: Date.now() }
        : null;
      renderProgress();
    }

    function renderProgress() {
      const bar = document.getElementById("progress");
      if (progress === null) {
        bar.style.display = "none";
        return;
      }
      const pos = Math.min(progress.position + (Date.now() - progress.at) / 1000, progress.duration);
      bar.style.display = "block";
      document.getElementById("progress-fill").style.width = (100 * pos / progress.duration) + "%";
    }

    setInterval(renderProgress, 1000);

    function connect() {
      const ws = new WebSocket("ws://" + location.host + "/ws");
      ws.onmessage = (event) => { applyState(JSON.parse(event.data)); };
      ws.onclose = () => { setTimeout(connect, 3000); };
      ws.onerror = () => { ws.close(); };
    }

    connect();
  </script>
</body>
</html>
