<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Now Playing</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #fff;
                  font-family: sans-serif; display: flex; flex-direction: column;
                  align-items: center; justify-content: center; }
    #art-container { position: relative; width: 100vw; height: 90vh; }
    #art-container.fullscreen { height: 100vh; }
    #art-container img {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: contain; opacity: 0;
      transition: opacity 1s ease-in-out, transform 1s ease-in-out;
    }
    #art-container.fullscreen img { object-fit: cover; }
    {{ transitions_css }}
    #meta { text-align: center; padding: 0.5em; }
    #meta.hidden { display: none; }
    #title { font-size: 1.5em; }
    #subtitle { font-size: 1em; opacity: 0.8; }
    #art-label { font-size: 0.8em; opacity: 0.5; margin-top: 0.3em; }
    #progress { display: none; width: min(60vw, 400px); height: 4px; margin: 0.6em auto 0;
                background: rgba(255, 255, 255, 0.25); border-radius: 2px; overflow: hidden; }
    #progress-fill { width: 0%; height: 100%; background: #fff; border-radius: 2px; }
  </style>
</head>
<body>
  <div id="art-container">
    <img id="art-a" alt="">
    <img id="art-b" alt="">
  </div>
  <div id="meta">
    <div id="title"></div>
    <div id="subtitle"></div>
    <div id="art-label"></div>
    <div id="progress"><div id="progress-fill"></div></div>
  </div>
  <script>
    {{ transitions_js }}

    let lastImage = null;
    let activeImg = document.getElementById("art-a");
    let standbyImg = document.getElementById("art-b");

    // Bumped on every showImage() call so a retry for an older, superseded
    // image can tell it's stale and give up instead of clobbering whatever
    // is loading (or already showing) for the current one.
    let showToken = 0;
    const MAX_IMAGE_RETRIES = 5;

    function showImage(src) {
      const token = ++showToken;
      const img = standbyImg;
      prepareForTransition(img);

      const load = (retriesLeft, url) => {
        if (token !== showToken) return;
        img.onload = () => {
          if (token !== showToken) return;
          activeImg.classList.remove("visible");
          img.classList.add("visible");
          [activeImg, standbyImg] = [img, activeImg];
        };
        img.onerror = () => {
          if (token !== showToken || retriesLeft <= 0) return;
          // Keep whatever's currently visible on screen and retry rather
          // than swapping in a failed/broken image - a slow or
          // resource-constrained device is more likely to hit a transient
          // load failure, and it should recover on its own instead of
          // sticking with a broken picture until the next rotation.
          setTimeout(() => {
            const sep = src.includes("?") ? "&" : "?";
            load(retriesLeft - 1, src + sep + "retry=" + retriesLeft);
          }, 1000);
        };
        img.src = url;
      };
      load(MAX_IMAGE_RETRIES, src);
    }

    function applyState(data) {
      const title = document.getElementById("title");
      const subtitle = document.getElementById("subtitle");
      const artLabel = document.getElementById("art-label");
      const artContainer = document.getElementById("art-container");
      const meta = document.getElementById("meta");

      if (data.image) {
        if (data.image !== lastImage) {
          showImage(data.image);
          lastImage = data.image;
        }
      } else {
        activeImg.classList.remove("visible");
        standbyImg.classList.remove("visible");
        lastImage = null;
      }

      const isIdle = data.source === "idle";
      artContainer.classList.toggle("fullscreen", isIdle);
      meta.classList.toggle("hidden", isIdle);

      title.textContent = data.title || "";
      subtitle.textContent = data.subtitle || "";
      artLabel.textContent = data.art_label || "";
      setProgress(data);
    }

    // Payloads only arrive on item changes and rotation ticks, so the bar
    // advances locally at 1s/s from the last reported position; each new
    // payload re-anchors it (correcting for pauses/seeks within one tick).
    let progress = null;

    function setProgress(data) {
      progress = (typeof data.position_seconds === "number" && data.duration_seconds > 0)
        ? { position: data.position_seconds, duration: data.duration_seconds, at: Date.now() }
        : null;
      renderProgress();
    }

    function renderProgress() {
      const bar = document.getElementById("progress");
      if (progress === null) {
        bar.style.display = "none";
        return;
      }
      const pos = Math.min(progress.position + (Date.now() - progress.at) / 1000, progress.duration);
      bar.style.display = "block";
      document.getElementById("progress-fill").style.width = (100 * pos / progress.duration) + "%";
    }

    setInterval(renderProgress, 1000);

    // Force a full page reload if no message has arrived in a while. A
    // dead connection doesn't always fire onclose (e.g. a Wi-Fi drop with
    // no clean close, or a resource-constrained device like a Raspberry
    // Pi 3 whose tab stalls) - when that happens the reconnect logic
    // below never runs, leaving stale state on screen indefinitely until
    // someone manually reloads. A reload resets everything and recovers
    // reliably where a JS-only reconnect can't. The threshold scales with
    // the server's own rotation cadence (state pushes at least that
    // often) with a floor so a short configured interval doesn't cause
    // reload churn from ordinary jitter.
    const STALE_TIMEOUT_MS = Math.max(90000, {{ rotation_interval_seconds }} * 3000);
    let lastMessageTime = Date.now();

    setInterval(() => {
      if (Date.now() - lastMessageTime > STALE_TIMEOUT_MS) {
        location.reload();
      }
    }, 10000);

    function connect() {
      const ws = new WebSocket("ws://" + location.host + "/ws");
      ws.onmessage = (event) => {
        lastMessageTime = Date.now();
        applyState(JSON.parse(event.data));
      };
      ws.onclose = () => { setTimeout(connect, 3000); };
      ws.onerror = () => { ws.close(); };
    }

    connect();
  </script>
</body>
</html>
