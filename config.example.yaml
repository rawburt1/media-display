# Copy this file to config.yaml and fill in your own values.
# Lines starting with # are comments and are ignored.
# Remove the leading # from any line to activate that setting.


# ---------------------------------------------------------------------------
# Polling
# ---------------------------------------------------------------------------

# How often (in seconds) to check each source for "now playing" info.
poll_interval_seconds: 5

# When more than one image is available for the current item (e.g. Kodi's
# local poster + fanart.tv backdrop), how long (in seconds) to show each one
# before cycling to the next. Rounded up to the nearest poll_interval_seconds.
rotation_interval_seconds: 30

# Backoff for sources whose device/service couldn't be reached (last_poll_failed).
# Delay starts at backoff_initial_seconds, doubles after each consecutive
# failure, and is capped at backoff_max_seconds. Sources that are simply idle
# (no error, nothing playing) are unaffected and keep polling every tick.
backoff_initial_seconds: 30
backoff_max_seconds: 300


# ---------------------------------------------------------------------------
# Source priority
# ---------------------------------------------------------------------------
# When several sources are active at the same time, the first one in this list
# wins. Sources not listed here are ignored even if they are enabled below.

priority:
  - kodi
  - appletv
  # Right after appletv: a fallback for whatever appletv's pyatv-based
  # polling can't see playing on that same device (see homeassistant's
  # comment under sources: below), not a primary source in its own right.
  - homeassistant
  - youtube
  - shield
  - plex
  - sonos
  - spotify
  - vinyl
  - ps5
  - chromecast


# ---------------------------------------------------------------------------
# Sources  (what is currently playing)
# ---------------------------------------------------------------------------

sources:

  # Apple TV — reports the currently-playing item from any app (TV+, Plex,
  # Infuse, etc.) via the Companion or MRP protocol.  Pairing is required:
  #   docker compose run --rm mediainfo python -m mediainfo auth appletv --config config/config.yaml
  # Follow the prompts; paste the printed credentials below.
  appletv:
    enabled: true
    host: 192.168.1.90              # IP address of the Apple TV
    # Credentials from pairing (tvOS 15+):
    companion_credentials: ""
    # For older hardware or tvOS < 15:
    # mrp_credentials: ""
    # airplay_credentials: ""       # Rarely needed for now-playing

  # Home Assistant — polls a single media_player entity's state via HA's
  # REST API. Mainly useful as a fallback for a device a more specific
  # source can't read "now playing" from directly - e.g. a tvOS app (like
  # SVT Play) that doesn't populate Apple's own now-playing API, which
  # leaves `appletv` above only ever seeing it as idle, but HA's own Apple
  # TV integration can somehow still see. Not Apple-TV-specific: works for
  # any media_player entity HA tracks.
  # Get a long-lived access token: your profile (bottom-left in the HA UI)
  # → Security → Long-lived access tokens → Create Token. Find the entity
  # id under Settings → Devices & Services → Entities.
  homeassistant:
    enabled: true
    host: 192.168.1.11
    port: 8123
    use_ssl: false
    token: YOUR_HA_LONG_LIVED_ACCESS_TOKEN
    entity_id: media_player.apple_tv_4k

  # Kodi / XBMC media centre.
  # Provides title, artwork, and metadata for movies, TV episodes, and music.
  kodi:
    enabled: true
    host: 192.168.1.21       # IP address of the machine running Kodi
    port: 8080               # Kodi's HTTP API port (Settings → Services → Control)
    username: kodi           # HTTP API username (leave blank if auth is off)
    password: kodi           # HTTP API password

  # Plex Media Server.
  # See https://support.plex.tv/articles/204059436 to find your token.
  plex:
    enabled: true
    host: 192.168.1.22
    port: 32400
    token: YOUR_PLEX_TOKEN

  # Android TV "now playing" session (Nvidia Shield, Chromecast, etc.).
  # Reads the system-level media session, so it catches Spotify, YouTube
  # Music, SVT Play, Netflix, and anything else running on the device —
  # not just Kodi.  Can point at the same device as `kodi` above.
  shield:
    enabled: true
    host: 192.168.1.21       # IP address of the Android TV device
    port: 5555               # ADB network port (enable in Developer options)
    # Path to the ADB private key used to authenticate with the device.
    # Generated automatically on first run; accept the on-screen prompt.
    adb_key_path: ./adb_keys/shield

  # YouTube on Android TV ONLY - not YouTube in general. This detects the
  # YouTube *app* running on an Android TV device (e.g. the same Nvidia
  # Shield as `shield` above) over ADB; it cannot see YouTube played in a
  # browser, a phone app, a smart TV's own built-in YouTube app, or
  # anything not running on the specific device `host` below points at.
  # Unlike `shield`'s generic any-app session grab, this specifically
  # targets the YouTube app, reporting the video title and channel name
  # (treated as the artist) as music. YouTube TV's media session doesn't
  # expose anything that reliably distinguishes a song from any other
  # video, so this reports whatever's actively playing rather than
  # filtering - the usual music enrichers (fanart.tv/MusicBrainz/Last.fm/
  # Discogs/Wikipedia) just won't find anything to add when the channel
  # isn't a real artist. If the title itself looks like "Song - Artist"
  # (song first), that's split and used instead of the channel name -
  # unless the part after the dash is a version/edition tag like "Live"
  # or "Remix", which is stripped as decoration along with any
  # parenthesized/bracketed text (e.g. "(Official Video)"). Put this
  # ahead of `shield` in `priority`.
  youtube:
    enabled: true
    host: 192.168.1.21       # IP address of the Android TV device
    port: 5555               # ADB network port (enable in Developer options)
    # Use a separate key from `shield`'s if pointed at the same device.
    adb_key_path: ./adb_keys/youtube

  # Spotify — current playback via the Spotify Web API.
  # 1. Create a free app at https://developer.spotify.com/dashboard
  # 2. Add http://localhost:8888/callback as a Redirect URI in the app settings.
  # 3. Authorize once: docker compose run --rm mediainfo python -m mediainfo auth spotify --config config/config.yaml
  spotify:
    enabled: true
    client_id: YOUR_SPOTIFY_CLIENT_ID
    client_secret: YOUR_SPOTIFY_CLIENT_SECRET
    redirect_uri: http://localhost:8888/callback
    # Token is cached here; mount this directory as a volume in docker-compose.
    cache_path: ./spotify_cache/token.json

  # Sonos multi-room audio.
  # Discovers all Sonos zones on your network automatically from the
  # configured seed speakers, so music playing in any room is detected.
  sonos:
    enabled: true
    # IP address of every Sonos speaker on your network. Any one of them
    # can report the full household topology, so listing more than one
    # keeps every zone visible even if a particular speaker is
    # temporarily off or unreachable.
    speaker_ips:
      - 192.168.1.80
      - 192.168.1.81

    # Optional: speakers to ignore. Use the name shown in the Sonos app,
    # or the speaker's IP address. Music on these speakers won't trigger
    # the display (useful for kitchen/bathroom radios etc.).
    blacklist:
      - Kitchen
      # - 192.168.1.85

  # Vinyl record recognition via a Behringer UCA202 USB audio interface.
  # Requires the companion vinyl_recognizer service (see vinyl_recognizer/).
  vinyl:
    enabled: true
    host: 192.168.1.40       # Machine the UCA202 is connected to
    port: 8091               # Port the vinyl_recognizer service listens on

  # PlayStation 5 - shows the poster of whatever game is currently being
  # played, via PSNAWP reading your account's own PSN presence (the same
  # "currently playing <game>" shown to friends). No console pairing or
  # network access to the console needed.
  # Get an npsso cookie: log into https://www.playstation.com in a
  # browser, then visit https://ca.account.sony.com/api/v1/ssocookie and
  # copy the "npsso" value from the JSON response. Expires after ~2
  # months; repeat these steps for a fresh one if this source starts
  # failing.
  ps5:
    enabled: true
    npsso: YOUR_NPSSO_COOKIE

  # Generic Chromecast/Cast source - polls Cast devices' media status
  # directly, so anything cast to them (Netflix, Disney+, YouTube, Spotify
  # Connect, etc.) is picked up regardless of which app is casting, unlike
  # `shield` which only sees apps running locally on an Android TV device.
  chromecast:
    enabled: true
    device_ips:
      - 192.168.1.90
    # App display names to ignore, e.g. screensaver/backdrop apps that are
    # "playing" something but aren't real now-playing content. If you also
    # use outputs.nest_hub, list that Nest Hub's own friendly app name here
    # too (it shows as whatever app this output's own pushed image plays
    # through) so it doesn't see its own artwork as something "now playing".
    ignore_apps:
      - Backdrop
      - Default Media Receiver


# ---------------------------------------------------------------------------
# Outputs  (where to display the artwork)
# ---------------------------------------------------------------------------
# Each output type accepts either a single block or a list of blocks, so you
# can drive multiple screens of the same type simultaneously.
#
# Single screen (the common case):
#
#   pixoo:
#     enabled: true
#     ip: 192.168.1.32
#
# Multiple screens of the same type — use a YAML list:
#
#   pixoo:
#     - enabled: true
#       ip: 192.168.1.32
#     - enabled: true
#       ip: 192.168.1.33

# Each image-capable output accepts an optional `transforms` list that is
# applied to every image before it is sent to that output.  Steps run in
# order.  Available transforms:
#
#   fit: [width, height]          — cover-crop (CSS object-fit: cover)
#   pad: [width, height]          — letterbox / pillarbox (contain + fill)
#   pad: {width: W, height: H, color: white}
#   resize: [width, height]       — exact resize, ignores aspect ratio
#   grayscale                     — convert to greyscale (output stays RGB)
#   blur: {radius: 2}
#   brightness: {factor: 1.2}     — >1 brighter, <1 darker
#   contrast: {factor: 1.1}
#   rotate: {degrees: 90}
#   rotate: {degrees: 90, expand: true}  # grow canvas to avoid clipping
#
# Example — letterbox for a 1280×800 Nest Hub, then boost brightness:
#   transforms:
#     - pad: [1280, 800]
#     - brightness: {factor: 1.15}

outputs:

  # Config UI — a web page for editing this entire file (sources, outputs,
  # enrichers, idle wallpaper sources, polling intervals) from the browser.
  # Saved changes are picked up by the running process within a few seconds
  # (same hot-reload used for manual edits) — no restart needed.
  # SECURITY: this output can read AND write config.yaml, including any
  # credentials in it. Only enable it on a trusted local network, or set
  # `auth.enabled: true` (see below) before exposing it beyond one —
  # see SECURITY.md.
  config:
    enabled: true
    host: 0.0.0.0
    port: 8094
    # "form" (default): the full editable form above. "dashboard": a
    # status overview of sources/outputs/enrichers instead - filterable
    # by status, with a per-item "Test connection" button and an "Edit"
    # button (same read/write access to config.yaml as the form, just a
    # different layout) - the same SECURITY warning above applies to
    # both. /form and /dashboard are both reachable on this one instance
    # regardless of this setting (with a nav link between them); this
    # just picks the default for "/" - no need to run a second instance
    # on another port to get both.
    ui: form

  # RSS/Atom feed — "now playing" history as a machine-readable feed.
  # Subscribe with any feed reader or home-automation tool (Home Assistant,
  # Node-RED, etc.) to track what has been playing.
  # Two formats are served from the same port:
  #   /rss    — RSS 2.0  (application/rss+xml)
  #   /atom   — Atom 1.0 (application/atom+xml)
  feed:
    enabled: true
    host: 0.0.0.0
    port: 8086
    title: Now Playing               # Channel/feed title shown in feed readers

  # Folder output — writes the current artwork as image files in a directory.
  # Each image is replaced whenever the playing item changes. While nothing
  # is playing, it instead mirrors the current batch of idle wallpapers (see
  # `idle` below); if no idle source is configured, the folder is cleared
  # instead. Useful for digital photo frames or any app that watches a folder.
  folder:
    enabled: true
    dir: ./artwork

  # Multiple folder outputs — e.g. one local and one on a network share:
  # folder:
  #   - enabled: true
  #     dir: ./artwork
  #   - enabled: true
  #     dir: /mnt/photoframe/artwork

  # Info output — a high-resolution web page pairing the current artwork
  # with a bio/plot summary (artist bio, movie info, TV show info — see the
  # `wikipedia` enricher below, which fills in `summary`). No image
  # transforms are applied by default, so artwork is shown at its original
  # resolution rather than scaled down for a small physical display.
  info:
    enabled: true
    host: 0.0.0.0
    port: 8093
    # See outputs.web's transition_exclude above.
    transition_exclude: []

  # MQTT publish — sends now-playing metadata to an MQTT broker.
  # Useful for triggering home-automation flows (Home Assistant, Node-RED, …)
  # or feeding data to other displays.
  #
  # Payload when playing:
  #   {"state": "playing", "source": "kodi", "media_type": "music",
  #    "title": "...", "subtitle": "...", "album": "..."}
  # Payload when idle:
  #   {"state": "idle"}
  mqtt:
    enabled: true
    host: 192.168.1.10           # MQTT broker IP or hostname
    port: 1883
    topic: mediainfo/now_playing
    client_id: mediainfo
    username: ""                  # Leave blank if broker has no auth
    password: ""
    qos: 0                        # 0 = at most once, 1 = at least once
    retain: true                  # New subscribers see the current state immediately

  # Multiple MQTT outputs — e.g. one per room or automation system:
  # mqtt:
  #   - enabled: true
  #     host: 192.168.1.10
  #     topic: living_room/media
  #   - enabled: true
  #     host: 192.168.1.11
  #     topic: bedroom/media

  # Google Nest Hub (or any Google Cast display).
  # The Nest Hub fetches the image over HTTP, so this machine's LAN address
  # must be reachable from the device.
  nest_hub:
    enabled: true
    device_ip: 192.168.1.50     # IP of the Nest Hub
    server_host: 192.168.1.10   # LAN address of THIS machine
    server_port: 8092            # Port for the built-in image server

  # Multiple Nest Hubs — living room and bedroom, each on its own server port:
  # nest_hub:
  #   - enabled: true
  #     device_ip: 192.168.1.50
  #     server_host: 192.168.1.10
  #     server_port: 8092
  #   - enabled: true
  #     device_ip: 192.168.1.51
  #     server_host: 192.168.1.10
  #     server_port: 8093

  # Divoom Pixoo64 — 64×64 LED pixel display.
  pixoo:
    enabled: true
    ip: 192.168.1.32

  # Multiple Pixoo displays — one in the living room, one on the desk:
  # pixoo:
  #   - enabled: true
  #     ip: 192.168.1.32
  #   - enabled: true
  #     ip: 192.168.1.33

  # Ulanzi TC001 (or any AWTRIX3 device) — scrolling text clock.
  # Displays artist and song title as scrolling text. Artwork is not shown
  # (the display is text-only); it shows the clock face when nothing plays.
  ulanzi:
    enabled: true
    device_ip: 192.168.1.60
    app_name: now_playing        # AWTRIX3 custom app slot name
    username: ""                 # HTTP basic auth (leave blank if not set)
    password: ""

  # Multiple Ulanzi clocks — kitchen and office:
  # ulanzi:
  #   - enabled: true
  #     device_ip: 192.168.1.60
  #     app_name: now_playing
  #   - enabled: true
  #     device_ip: 192.168.1.61
  #     app_name: now_playing

  # Video output — full-screen browser page with ambient video wallpapers.
  # Shows artwork when something is playing; switches to looping video clips
  # fetched from Pexels (or Pixabay) when idle.
  # Open http://<this-machine>:8091 on any browser or smart TV.
  video:
    enabled: true
    host: 0.0.0.0
    port: 8091
    source: pexels               # "pexels" or "pixabay"
    # Comma-separated search terms; one is picked at random each refresh.
    queries: nature,ocean,mountains,forests
    # How often (seconds) to fetch a new batch of videos while idle.
    refresh_interval_seconds: 3600
    batch_size: 15               # Number of videos to fetch per batch
    # API key from https://www.pexels.com/api/ (free, requires sign-up)
    pexels_api_key: YOUR_PEXELS_API_KEY
    # API key from https://pixabay.com/api/docs/ (used when source = "pixabay")
    pixabay_api_key: ""
    # See outputs.web's transition_exclude above.
    transition_exclude: []

  # Multiple video outputs — living room TV on 8091, bedroom TV on 8093:
  # video:
  #   - enabled: true
  #     host: 0.0.0.0
  #     port: 8091
  #     source: pexels
  #     queries: nature,ocean,mountains
  #     pexels_api_key: YOUR_PEXELS_API_KEY
  #   - enabled: true
  #     host: 0.0.0.0
  #     port: 8093
  #     source: pexels
  #     queries: cityscapes,architecture
  #     pexels_api_key: YOUR_PEXELS_API_KEY

  # Web output — serves a browser page with full-screen artwork.
  # Open http://<this-machine>:8090 on any browser or smart TV.
  web:
    enabled: true
    host: 0.0.0.0            # Listen on all network interfaces
    port: 8090
    # Each image change picks a random transition: fade, slide-left,
    # slide-right, slide-up, slide-down, or zoom. All are used by default;
    # list any to skip here, e.g. [slide-up, slide-down]. Also available on
    # `info` and `video` below.
    transition_exclude: []

  # Multiple web outputs — e.g. different ports for different rooms:
  # web:
  #   - enabled: true
  #     host: 0.0.0.0
  #     port: 8090
  #   - enabled: true
  #     host: 0.0.0.0
  #     port: 8094


# ---------------------------------------------------------------------------
# Enrichers  (extra artwork from online databases)
# ---------------------------------------------------------------------------
# Enrichers look up additional posters and fanart for movies and TV shows,
# matched via the TMDb/IMDb/TVDB IDs that Kodi and Plex include in metadata.
# The extra images are added to the rotation alongside the local artwork.

enrichers:

  # Local music library — fills in album art for sources that don't
  # report an album at all (e.g. YouTube), by looking up the playing
  # artist+song in the local library (see `library:` below, populated via
  # `python -m mediainfo import-lidarr` or by the other enrichers below as
  # they resolve things by name) and adding cover art for every album the
  # song appears on. Listed first so that if it fills in the album name,
  # the name-based enrichers below get a chance to also contribute art for
  # it (a free cache hit, since the name now matches what's on file).
  library:
    enabled: true

  # TheTVDB — TV episode artwork and banners.
  # Get a free project API key at https://thetvdb.com/dashboard/account/apikey
  # Listed before fanarttv: for sources that only give us a show title (no
  # tvdb id - e.g. the Shield source), this resolves it by name and writes
  # the id back, so fanart.tv's TV branch below gets to use it too.
  thetvdb:
    enabled: true
    api_key: YOUR_THETVDB_API_KEY
    pin: ""                      # Only needed for "user-supported" API keys
    # When a title search is ambiguous (e.g. several unrelated shows
    # called "Kingdom"), how many search results to check episode-by-
    # episode before giving up rather than guessing wrong. Raise this to
    # catch a correct match that thetvdb's own search ranks further down,
    # at the cost of more API calls for generic titles.
    max_search_candidates: 5

  # fanart.tv — high-quality posters, backgrounds, and disc art.
  # Get a free personal API key at https://fanart.tv/get-an-api-key/
  fanarttv:
    enabled: true
    api_key: YOUR_FANART_TV_API_KEY

  # Sonarr — TV network/studio and poster/fanart, matched against your own
  # Sonarr library (the shows you actually track) rather than a public
  # catalog. Get the api_key from Sonarr's Settings → General → Security.
  sonarr:
    enabled: true
    host: 192.168.1.50
    port: 8989
    api_key: YOUR_SONARR_API_KEY

  # Radarr — movie studio, genres, and poster/fanart, matched against your
  # own Radarr library. Get the api_key from Radarr's Settings → General →
  # Security.
  radarr:
    enabled: true
    host: 192.168.1.50
    port: 7878
    api_key: YOUR_RADARR_API_KEY

  # Last.fm — artist photos for music tracks.
  # Get a free API key at https://www.last.fm/api/account/create
  # Note: Last.fm removed most artist images from their API in 2019–2020.
  # Photos are still available for many popular artists, but may be absent
  # for less well-known ones.  When no photo is available this enricher is
  # a no-op (the placeholder image is filtered out automatically).
  lastfm:
    enabled: true
    api_key: YOUR_LASTFM_API_KEY

  # MusicBrainz Cover Art Archive — album cover scans for music.
  # No API key required; uses the free Cover Art Archive (coverartarchive.org).
  # Complements fanart.tv: fanart.tv provides promotional/poster art while CAA
  # provides scanned physical album covers.
  musicbrainz:
    enabled: true

  # Lidarr — other albums/songs by the playing artist (NowPlaying.discography)
  # and album art, matched against your own Lidarr library. Get the api_key
  # from Lidarr's Settings → General → Security. Distinct from
  # `python -m mediainfo import-lidarr` (see `library:` below), which is a
  # one-off bulk import rather than a live per-play lookup.
  lidarr:
    enabled: true
    host: 192.168.1.50
    port: 8686
    api_key: YOUR_LIDARR_API_KEY
    max_discography_items: 50

  # Wikipedia — artist bio / movie info / TV show info, plus a photo.
  # No API key required; uses the free Wikipedia REST API. Fills in
  # `summary` (shown by the `info` output and included in RSS/Atom feed
  # entries) and adds a thumbnail photo to the image rotation.
  wikipedia:
    enabled: true

  # Lyrics — fills in NowPlaying.lyrics (shown by the `info` output) for the
  # currently playing track. No API key required; uses the free lyrics.ovh
  # API. (Genius's official API only returns a link to their lyrics page,
  # not the lyrics text itself, so it can't be used here.)
  lyrics:
    enabled: true

  # lrclib - fills in NowPlaying.lyrics_synced (time-synced, LRC-format
  # lyrics) for the currently playing track, shown by the `info` output as
  # scrolling/highlighted lines in time with playback (requires a source
  # that reports position_seconds, e.g. Kodi - falls back to the plain
  # `lyrics` enricher's static text otherwise). No API key required; uses
  # the free lrclib.net API. Many tracks have no synced lyrics available -
  # that's a normal miss, not an error.
  lrclib:
    enabled: true

  # TMDb — audience rating (0-10) for movies and TV shows, shown by the
  # `info` output. Free credential from
  # https://www.themoviedb.org/settings/api - either the short v3 "API Key"
  # or the long v4 "API Read Access Token" works.
  tmdb:
    enabled: true
    api_key: YOUR_TMDB_API_KEY_OR_READ_ACCESS_TOKEN

  # OMDb — IMDb rating (0-10) for movies and TV shows, also shown by the
  # `info` output. Free API key from https://www.omdbapi.com/apikey.aspx
  # Can be enabled alongside tmdb above - whichever finds a rating first
  # wins, the other won't overwrite it.
  omdb:
    enabled: true
    api_key: YOUR_OMDB_API_KEY


# ---------------------------------------------------------------------------
# Cache
# ---------------------------------------------------------------------------

cache:
  dir: ./cache
  # Delete cached now-playing artwork files that haven't been used in this
  # many days. The check runs once per day in the background.
  max_age_days: 30
  # Idle wallpapers (Unsplash, Last.fm scrobble history, etc. - stored under
  # <dir>/idle) are purged on a much shorter schedule, since they're
  # decorative and easily refetched rather than tied to a specific item.
  idle_max_age_hours: 48

# Local SQLite database of artist/album/track metadata (MusicBrainz ids,
# cached cover art URLs, artist photos) - queried before the musicbrainz,
# fanarttv, discogs, and lastfm enrichers make an external API call, so
# the same artist/album/song doesn't trigger a repeat lookup across plays
# or process restarts. MusicBrainz is treated as the source of truth for
# canonical ids.
library:
  db_path: ./library/library.db
  # How long a cached result (e.g. a cover art URL, or "no cover art
  # found") stays valid before it's looked up again.
  max_age_days: 30


# ---------------------------------------------------------------------------
# Idle wallpapers  (shown when nothing is playing)
# ---------------------------------------------------------------------------
# When no source is active, image-capable outputs (web, pixoo, nest_hub, etc.)
# show a rotating set of wallpapers downloaded from the configured source.
# Each output independently rotates through the batch in a random order.

idle:

  # Multiple idle sources can be enabled at once - their wallpapers are
  # merged into a single pool, with each source refetched on its own
  # rotation_interval_seconds below.

  # Unsplash — high-resolution photography.
  # Create a free app at https://unsplash.com/oauth/applications and use the
  # "Demo" access key (no approval required).
  unsplash:
    enabled: true
    # Comma-separated search terms; one batch is fetched per rotation cycle.
    queries: nature,architecture,space
    # How often (seconds) to download a fresh batch of wallpapers.
    rotation_interval_seconds: 300
    batch_size: 10               # Images to download per batch
    access_key: YOUR_UNSPLASH_ACCESS_KEY

  # Last.fm scrobble history — shows album art from your recent scrobbles
  # instead of (or as an alternative to) photography.
  # Get a free API key at https://www.last.fm/api/account/create (same key
  # as enrichers.lastfm, if that's also enabled).
  lastfm:
    enabled: false
    api_key: YOUR_LASTFM_API_KEY
    username: YOUR_LASTFM_USERNAME
    batch_size: 10                # Recent scrobbles to fetch per refresh
    rotation_interval_seconds: 300

  # Local music library — cover art from random albums in your own
  # collection (see `library:` above). No API key required.
  library:
    enabled: false
    batch_size: 10                # Albums to pick per refresh
    rotation_interval_seconds: 300


# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
# Logs are always written to stdout (visible via `docker compose logs`).
# To also write to a rotating file, fill in the path below.

logging:
  # DEBUG, INFO, WARNING, ERROR, or CRITICAL. DEBUG is noisy (e.g. logs
  # every skipped/unsupported Sonos coordinator) but useful when
  # troubleshooting why a source isn't detecting playback.
  level: INFO
  file: ./logs/mediainfo.log
  max_bytes: 1048576             # Rotate at 1 MB
  backup_count: 3               # Keep 3 old log files


# ---------------------------------------------------------------------------
# Optional authentication
# ---------------------------------------------------------------------------
# Off by default - your own LAN keeps working with no login prompt either
# way, since requests from RFC1918 private-use addresses (and loopback)
# are never challenged, regardless of `enabled`. Turn this on if you're
# exposing the web/config/info/feed/video/nest_hub outputs beyond your LAN
# (port-forwarding, a reverse proxy, a VPN you don't fully trust, ...) and
# want anything reaching them from outside that range to need a login.
# Applies to all of those outputs at once (one shared username/password).

auth:
  enabled: false
  username: YOUR_USERNAME
  password: YOUR_PASSWORD


# ---------------------------------------------------------------------------
# Alerting
# ---------------------------------------------------------------------------
# Off by default. When enabled, a webhook is POSTed once an output (e.g. a
# Pixoo64 or Nest Hub that's become unreachable on the network) has been
# continuously failing for at least error_threshold_seconds - most chat
# tools (Slack, Discord, ntfy.sh, healthchecks.io, a generic HTTP endpoint
# of your own, ...) accept a plain JSON POST. Re-fires at most every
# repeat_interval_seconds while the outage continues, and resets the
# moment the output recovers.

alerts:
  enabled: false
  webhook_url: https://example.com/webhook
  error_threshold_seconds: 300
  repeat_interval_seconds: 3600


# ---------------------------------------------------------------------------
# Manual artwork overrides
# ---------------------------------------------------------------------------
# On by default. Lets you pin a specific image for a title/subtitle that
# never gets a good poster from any enricher, via the config UI's
# "Overrides" page (linked from the main configuration page) - matched by
# exact title + subtitle, case-insensitive. A match replaces whatever
# enrichment found for that item entirely, and bypasses the cache's
# 640x480 minimum-size filter (it's a deliberate choice, not a download).

overrides:
  enabled: true
  dir: ./overrides
