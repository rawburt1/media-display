# Copy this file to config.yaml and fill in your own values.
# Lines starting with # are comments and are ignored.
# Remove the leading # from any line to activate that setting.
#
# Environment variable expansion
# -------------------------------
# Any string value can reference an environment variable:
#   client_secret: ${SPOTIFY_CLIENT_SECRET}          # required; kept as-is if unset
#   client_secret: ${SPOTIFY_CLIENT_SECRET:-}        # empty string if unset
#   client_secret: ${SPOTIFY_CLIENT_SECRET:-default} # literal "default" if unset
#
# This lets you keep secrets out of config.yaml and pass them via Docker
# Compose environment / .env files or system environment variables instead.


# ---------------------------------------------------------------------------
# Polling
# ---------------------------------------------------------------------------

# How often (in seconds) to check each source for "now playing" info.
poll_interval_seconds: 5

# When more than one image is available for the current item (e.g. Kodi's
# local poster + fanart.tv backdrop), how long (in seconds) to show each one
# before cycling to the next. Rounded up to the nearest poll_interval_seconds.
rotation_interval_seconds: 30

# Backoff for sources whose device/service couldn't be reached (last_poll_failed).
# Delay starts at backoff_initial_seconds, doubles after each consecutive
# failure, and is capped at backoff_max_seconds. Sources that are simply idle
# (no error, nothing playing) are unaffected and keep polling every tick.
backoff_initial_seconds: 30
backoff_max_seconds: 300

# How long (in seconds) to tolerate a source reporting "nothing playing"
# before actually switching outputs to idle, while something was already
# playing - covers a source briefly reporting no active session for a
# single poll or two during normal playback (e.g. Kodi's active-player
# list momentarily empty around a scene transition) without flashing
# every output to idle and back.
nothing_playing_grace_seconds: 2


# ---------------------------------------------------------------------------
# Source priority
# ---------------------------------------------------------------------------
# When several sources are active at the same time, the first one in this list
# wins. Sources not listed here are ignored even if they are enabled below.

priority:
  - kodi
  - appletv
  # Right after appletv: a fallback for whatever appletv's pyatv-based
  # polling can't see playing on that same device (see homeassistant's
  # comment under sources: below), not a primary source in its own right.
  - homeassistant
  - youtube
  - shield
  - plex
  - sonos
  - spotify
  - mopidy
  - mpd
  - lms
  - foobar2000
  - vlc
  - vinyl
  - browser
  - chromecast


# ---------------------------------------------------------------------------
# Sources  (what is currently playing)
# ---------------------------------------------------------------------------

sources:

  # Apple TV — reports the currently-playing item from any app (TV+, Plex,
  # Infuse, etc.) via the Companion or MRP protocol.  Pairing is required:
  #   docker compose run --rm mediainfo python -m mediainfo auth appletv --config config/config.yaml
  # Follow the prompts; paste the printed credentials below.
  appletv:
    enabled: true
    host: 192.168.1.90              # IP address of the Apple TV
    # Credentials from pairing (tvOS 15+):
    companion_credentials: ""
    # For older hardware or tvOS < 15:
    # mrp_credentials: ""
    # airplay_credentials: ""       # Rarely needed for now-playing

  # Browser extension - receives now-playing info pushed by the companion
  # browser extension (see browser-extension/README.md) over a WebSocket
  # connection, for media playing in a browser tab (YouTube, Spotify Web,
  # Netflix, Disney+, SVT Play, Plex Web). Unlike every other source, this
  # one listens for inbound connections instead of polling anything -
  # host 0.0.0.0 so it's reachable from whatever machine runs the browser.
  # Set a token here (and the same one in the extension's options page) if
  # this port is reachable by anyone other than yourself.
  browser:
    enabled: true
    host: 0.0.0.0
    port: 8096
    token: ""             # optional shared secret - see comment above
    timeout: 10           # seconds an event stays valid with no update

  # Home Assistant — tracks media_player entity state via HA's WebSocket
  # API (a persistent, push-based subscription, not polling). Mainly
  # useful as a fallback for a device a more specific source can't read
  # "now playing" from directly - e.g. a tvOS app (like SVT Play) that
  # doesn't populate Apple's own now-playing API, which leaves `appletv`
  # above only ever seeing it as idle, but HA's own Apple TV integration
  # can somehow still see. Not Apple-TV-specific: works for any
  # media_player entity HA tracks.
  # Get a long-lived access token: your profile (bottom-left in the HA UI)
  # → Security → Long-lived access tokens → Create Token. Find the entity
  # id under Settings → Devices & Services → Entities.
  homeassistant:
    enabled: true
    host: 192.168.1.11
    port: 8123
    use_ssl: false
    token: YOUR_HA_LONG_LIVED_ACCESS_TOKEN
    # Leave blank to track every media_player entity and report whichever
    # one is actually playing (handy with more than one such device) -
    # set this to pin it to just one regardless of what else HA plays.
    entity_id: media_player.apple_tv_4k

  # Kodi / XBMC media centre.
  # Provides title, artwork, and metadata for movies, TV episodes, and music.
  kodi:
    enabled: true
    host: 192.168.1.21       # IP address of the machine running Kodi
    port: 8080               # Kodi's HTTP API port (Settings → Services → Control)
    username: kodi           # HTTP API username (leave blank if auth is off)
    password: kodi           # HTTP API password

  # Mopidy music server (https://mopidy.com/) - reads now-playing info via
  # its core JSON-RPC API, over the same HTTP port as its web interface.
  # Backend-agnostic: works the same whether Mopidy is actually playing via
  # Mopidy-Spotify, local files, Mopidy-Subsonic, or any other backend.
  mopidy:
    enabled: true
    host: 192.168.1.31   # IP of the machine running Mopidy
    port: 6680
    timeout: 5           # per-request timeout, in seconds

  # Music Player Daemon (MPD) - common in Raspberry Pi/Linux/HiFi setups.
  # Cover art (embedded picture or a same-folder cover file, whichever the
  # server supports) is fetched and cached locally when available; if
  # neither is available, the usual artwork enrichers take over instead.
  mpd:
    enabled: true
    host: 192.168.1.32   # IP of the machine running MPD
    port: 6600
    password: ""         # leave blank unless MPD requires auth
    timeout: 5           # per-request timeout, in seconds

  # Logitech Media Server (LMS, formerly SqueezeCenter/SlimServer).
  # If you have more than one Squeezebox player, set player_id explicitly -
  # find it in the LMS web UI under Settings -> Information -> Player
  # Information (it's the player's MAC address, e.g. "aa:bb:cc:dd:ee:ff").
  # Leave blank for a single-player household: the first player currently
  # playing is picked automatically, falling back to the first paused one.
  lms:
    enabled: true
    host: 192.168.1.33
    port: 9000
    player_id: ""        # e.g. "aa:bb:cc:dd:ee:ff" - see above
    timeout: 5           # per-request timeout, in seconds

  # foobar2000, via the Beefweb Remote Control plugin
  # (https://github.com/hyperblast/beefweb) - install it, then enable its
  # HTTP server under File -> Preferences -> Beefweb Remote Control.
  # foobar2000 has no other standard remote API, so api_type is currently
  # always "beefweb" (kept as its own field for other plugins later).
  foobar2000:
    enabled: true
    host: 192.168.1.34
    port: 8888
    api_type: beefweb
    timeout: 5

  # Plex Media Server.
  # See https://support.plex.tv/articles/204059436 to find your token.
  plex:
    enabled: true
    host: 192.168.1.22
    port: 32400
    token: YOUR_PLEX_TOKEN

  # Android TV "now playing" session (Nvidia Shield, Chromecast, etc.).
  # Reads the system-level media session, so it catches Spotify, YouTube
  # Music, SVT Play, Netflix, and anything else running on the device —
  # not just Kodi.  Can point at the same device as `kodi` above.
  shield:
    enabled: true
    host: 192.168.1.21       # IP address of the Android TV device
    port: 5555               # ADB network port (enable in Developer options)
    # Path to the ADB private key used to authenticate with the device.
    # Generated automatically on first run; accept the on-screen prompt.
    adb_key_path: ./adb_keys/shield

  # YouTube on Android TV ONLY - not YouTube in general. This detects the
  # YouTube *app* running on an Android TV device (e.g. the same Nvidia
  # Shield as `shield` above) over ADB; it cannot see YouTube played in a
  # browser, a phone app, a smart TV's own built-in YouTube app, or
  # anything not running on the specific device `host` below points at.
  # Unlike `shield`'s generic any-app session grab, this specifically
  # targets the YouTube app, reporting the video title and channel name
  # (treated as the artist) as music. YouTube TV's media session doesn't
  # expose anything that reliably distinguishes a song from any other
  # video, so this reports whatever's actively playing rather than
  # filtering - the usual music enrichers (fanart.tv/MusicBrainz/Last.fm/
  # Discogs/Wikipedia) just won't find anything to add when the channel
  # isn't a real artist. If the title itself looks like "Song - Artist"
  # (song first), that's split and used instead of the channel name -
  # unless the part after the dash is a version/edition tag like "Live"
  # or "Remix", which is stripped as decoration along with any
  # parenthesized/bracketed text (e.g. "(Official Video)"). Put this
  # ahead of `shield` in `priority`.
  youtube:
    enabled: true
    host: 192.168.1.21       # IP address of the Android TV device
    port: 5555               # ADB network port (enable in Developer options)
    # Use a separate key from `shield`'s if pointed at the same device.
    adb_key_path: ./adb_keys/youtube

  # Spotify — current playback via the Spotify Web API.
  # 1. Create a free app at https://developer.spotify.com/dashboard
  # 2. Add http://localhost:8888/callback as a Redirect URI in the app settings.
  # 3. Authorize once: docker compose run --rm mediainfo python -m mediainfo auth spotify --config config/config.yaml
  spotify:
    enabled: true
    client_id: YOUR_SPOTIFY_CLIENT_ID
    client_secret: YOUR_SPOTIFY_CLIENT_SECRET
    redirect_uri: http://localhost:8888/callback
    # Token is cached here; mount this directory as a volume in docker-compose.
    cache_path: ./spotify_cache/token.json

  # Sonos multi-room audio.
  # Discovers all Sonos zones on your network automatically from the
  # configured seed speakers, so music playing in any room is detected.
  sonos:
    enabled: true
    # IP address of every Sonos speaker on your network. Any one of them
    # can report the full household topology, so listing more than one
    # keeps every zone visible even if a particular speaker is
    # temporarily off or unreachable.
    speaker_ips:
      - 192.168.1.80
      - 192.168.1.81

    # Optional: speakers to ignore. Use the name shown in the Sonos app,
    # or the speaker's IP address. Music on these speakers won't trigger
    # the display (useful for kitchen/bathroom radios etc.).
    blacklist:
      - Kitchen
      # - 192.168.1.85

  # Vinyl record recognition via a Behringer UCA202 USB audio interface.
  # Requires the companion vinyl_recognizer service (see vinyl_recognizer/).
  vinyl:
    enabled: true
    host: 192.168.1.40       # Machine the UCA202 is connected to
    port: 8091               # Port the vinyl_recognizer service listens on

  # VLC media player - reads now-playing info via its built-in web/HTTP
  # interface. Enable it in VLC: Tools -> Preferences -> Show settings:
  # All -> Interface -> Main interfaces -> check "Web" -> Lua -> Lua HTTP
  # -> set a Password (VLC won't start the interface without one; there's
  # no separate username field, just the password below).
  vlc:
    enabled: true
    host: 192.168.1.41
    port: 8080
    password: YOUR_VLC_HTTP_PASSWORD
    timeout: 5

  # Generic Chromecast/Cast source - polls Cast devices' media status
  # directly, so anything cast to them (Netflix, Disney+, YouTube, Spotify
  # Connect, etc.) is picked up regardless of which app is casting, unlike
  # `shield` which only sees apps running locally on an Android TV device.
  chromecast:
    enabled: true
    device_ips:
      - 192.168.1.90
    # App display names to ignore, e.g. screensaver/backdrop apps that are
    # "playing" something but aren't real now-playing content. If you also
    # use outputs.nest_hub, list that Nest Hub's own friendly app name here
    # too (it shows as whatever app this output's own pushed image plays
    # through) so it doesn't see its own artwork as something "now playing".
    ignore_apps:
      - Backdrop
      - Default Media Receiver


# ---------------------------------------------------------------------------
# Outputs  (where to display the artwork)
# ---------------------------------------------------------------------------
# Each output type accepts either a single block or a list of blocks, so you
# can drive multiple screens of the same type simultaneously.
#
# Single screen (the common case):
#
#   pixoo:
#     enabled: true
#     ip: 192.168.1.32
#
# Multiple screens of the same type — use a YAML list:
#
#   pixoo:
#     - enabled: true
#       ip: 192.168.1.32
#     - enabled: true
#       ip: 192.168.1.33

# Each image-capable output accepts an optional `transforms` list that is
# applied to every image before it is sent to that output.  Steps run in
# order.  Available transforms:
#
#   fit: [width, height]          — cover-crop (CSS object-fit: cover)
#   pad: [width, height]          — letterbox / pillarbox (contain + fill)
#   pad: {width: W, height: H, color: white}
#   resize: [width, height]       — exact resize, ignores aspect ratio
#   grayscale                     — convert to greyscale (output stays RGB)
#   blur: {radius: 2}
#   brightness: {factor: 1.2}     — >1 brighter, <1 darker
#   contrast: {factor: 1.1}
#   rotate: {degrees: 90}
#   rotate: {degrees: 90, expand: true}  # grow canvas to avoid clipping
#
# Example — letterbox for a 1280×800 Nest Hub, then boost brightness:
#   transforms:
#     - pad: [1280, 800]
#     - brightness: {factor: 1.15}

outputs:

  # Config UI — a web page for editing this entire file (sources, outputs,
  # enrichers, idle wallpaper sources, polling intervals) from the browser.
  # Saved changes are picked up by the running process within a few seconds
  # (same hot-reload used for manual edits) — no restart needed.
  # SECURITY: this output can read AND write config.yaml, including any
  # credentials in it. Only enable it on a trusted local network, or set
  # `auth.enabled: true` (see below) before exposing it beyond one —
  # see SECURITY.md.
  config:
    enabled: true
    # host defaults to 127.0.0.1 (loopback only — not reachable from the LAN).
    # Set to 0.0.0.0 to allow access from other machines. Required when running
    # inside Docker and accessing from the host. See SECURITY.md.
    host: 0.0.0.0
    port: 8094
    # "form" (default): the full editable form above. "dashboard": a
    # status overview of sources/outputs/enrichers instead - filterable
    # by status, with a per-item "Test connection" button and an "Edit"
    # button (same read/write access to config.yaml as the form, just a
    # different layout) - the same SECURITY warning above applies to
    # both. /form and /dashboard are both reachable on this one instance
    # regardless of this setting (with a nav link between them); this
    # just picks the default for "/" - no need to run a second instance
    # on another port to get both.
    ui: form

  # RSS/Atom feed — "now playing" history as a machine-readable feed.
  # Subscribe with any feed reader or home-automation tool (Home Assistant,
  # Node-RED, etc.) to track what has been playing.
  # Two formats are served from the same port:
  #   /rss    — RSS 2.0  (application/rss+xml)
  #   /atom   — Atom 1.0 (application/atom+xml)
  feed:
    enabled: true
    host: 0.0.0.0
    port: 8086
    title: Now Playing               # Channel/feed title shown in feed readers

  # Folder output — writes the current artwork as image files in a directory.
  # Each image is replaced whenever the playing item changes. While nothing
  # is playing, it instead mirrors the current batch of idle wallpapers (see
  # `idle` below); if no idle source is configured, the folder is cleared
  # instead. Useful for digital photo frames or any app that watches a folder.
  folder:
    enabled: true
    dir: ./artwork

  # Multiple folder outputs — e.g. one local and one on a network share:
  # folder:
  #   - enabled: true
  #     dir: ./artwork
  #   - enabled: true
  #     dir: /mnt/photoframe/artwork

  # Info output — a high-resolution web page pairing the current artwork
  # with a bio/plot summary (artist bio, movie info, TV show info — see the
  # `wikipedia` enricher below, which fills in `summary`). No image
  # transforms are applied by default, so artwork is shown at its original
  # resolution rather than scaled down for a small physical display.
  info:
    enabled: true
    host: 0.0.0.0
    port: 8093
    # See outputs.web's transition_exclude above.
    transition_exclude: []

  # MQTT publish — sends now-playing metadata to an MQTT broker.
  # Useful for triggering home-automation flows (Home Assistant, Node-RED, …)
  # or feeding data to other displays.
  #
  # Payload when playing:
  #   {"state": "playing", "source": "kodi", "media_type": "music",
  #    "title": "...", "subtitle": "...", "album": "..."}
  # Payload when idle:
  #   {"state": "idle"}
  mqtt:
    enabled: true
    host: 192.168.1.10           # MQTT broker IP or hostname
    port: 1883
    topic: mediainfo/now_playing
    client_id: mediainfo
    username: ""                  # Leave blank if broker has no auth
    password: ""
    qos: 0                        # 0 = at most once, 1 = at least once
    retain: true                  # New subscribers see the current state immediately
    # Home Assistant MQTT discovery: publish retained discovery configs so
    # a "mediainfo" device appears in HA automatically - no YAML needed on
    # the HA side, just its MQTT integration with discovery on (the
    # default). Includes an availability topic with a last-will, so the
    # entities show "unavailable" when this process is down. Creates:
    #   - sensors: now-playing state (+ full payload as attributes),
    #     title, artist, album, source
    #   - a "Health problem" binary_sensor
    #   - a "Hitster-safe mode" switch (readable AND settable from HA)
    #   - a "Refresh artwork" button
    #   - a "Next image" button (advances rotation immediately, instead of
    #     waiting for rotation_interval_seconds)
    #   - a "Restart" button (sends this process itself SIGTERM - a process
    #     supervisor, e.g. docker-compose's restart: unless-stopped, brings
    #     it back up)
    ha_discovery: false
    # ha_discovery_prefix: homeassistant  # only if HA's discovery_prefix differs

  # Multiple MQTT outputs — e.g. one per room or automation system:
  # mqtt:
  #   - enabled: true
  #     host: 192.168.1.10
  #     topic: living_room/media
  #   - enabled: true
  #     host: 192.168.1.11
  #     topic: bedroom/media

  # Google Nest Hub (or any Google Cast display).
  # The Nest Hub fetches the image over HTTP, so this machine's LAN address
  # must be reachable from the device.
  nest_hub:
    enabled: true
    device_ip: 192.168.1.50     # IP of the Nest Hub
    server_host: 192.168.1.10   # LAN address of THIS machine
    server_port: 8092            # Port for the built-in image server

  # Multiple Nest Hubs — living room and bedroom, each on its own server port:
  # nest_hub:
  #   - enabled: true
  #     device_ip: 192.168.1.50
  #     server_host: 192.168.1.10
  #     server_port: 8092
  #   - enabled: true
  #     device_ip: 192.168.1.51
  #     server_host: 192.168.1.10
  #     server_port: 8093

  # Divoom Pixoo — LED pixel display.
  # Works with the Pixoo64 (64×64, default) and the Pixoo 16×16 Pixel Art
  # LED Frame.  Set `size: 16` for the smaller display.
  pixoo:
    enabled: true
    ip: 192.168.1.32
    size: 64        # 64 for Pixoo64 (default), 16 for Pixoo 16×16

  # LED-preparation settings (optional) — how artwork is cropped, enhanced,
  # and reduced to a small palette before being sent to the display. Shown
  # here with their defaults, which favour bold, readable "pixel art" over a
  # blurred-down photo, especially on the 16×16 frame.
  # pixoo:
  #   enabled: true
  #   ip: 192.168.1.32
  #   size: 16
  #   crop_strategy: automatic    # automatic | center | poster_top
  #   palette_size: 24            # fewer = bolder colour blocks (try 8-16 for 16x16)
  #   dithering: none             # none | ordered | floyd_steinberg
  #   contrast_boost: medium      # off | low | medium | high
  #   saturation_boost: medium    # off | low | medium | high
  #   dark_image_boost: true      # lift brightness on naturally dark artwork
  #   pixel_art_mode: true        # crisp two-stage downsample vs. a single smooth resize

  # Optional text-detection stage (runs before the crop/enhance/downscale
  # steps above) - removes small poster/cover typography (credits,
  # subtitles, track listings) that would otherwise survive downscaling as
  # unreadable noise, while keeping large titles/logos that are still
  # legible at the final size. Off by default: it requires OpenCV's EAST
  # text-detection model, which is NOT bundled or auto-downloaded - you
  # must provide your own `frozen_east_text_detection.pb` file (a
  # well-known pretrained OpenCV DNN model - search for that exact
  # filename) and point `text_detection_model_path` at it. If the model
  # can't be loaded, this stage is silently skipped.
  # pixoo:
  #   enabled: true
  #   ip: 192.168.1.32
  #   text_detection_enabled: true
  #   text_detection_model_path: /path/to/frozen_east_text_detection.pb
  #   remove_small_text: true      # remove small/non-essential detected text
  #   preserve_large_logos: true   # keep large titles/logos if still legible at final size
  #   text_removal_method: inpaint # inpaint | soft_fill | crop_preference
  #   max_logo_area_percent: 25    # regions larger than this % are left alone (likely not text)

  # Multiple Pixoo displays — one in the living room, one on the desk. The
  # optional `label` field (any output type) is purely cosmetic - a display
  # name shown in the config UI (e.g. "Living room") instead of "Instance
  # #2" - it has no effect on behavior.
  # pixoo:
  #   - enabled: true
  #     ip: 192.168.1.32
  #     label: Living room
  #   - enabled: true
  #     ip: 192.168.1.33
  #     label: Desk

  # ---------------------------------------------------------------------------
  # Per-output content filters (optional, applies to every output type)
  # ---------------------------------------------------------------------------
  # Each output accepts six optional filter fields that control which media it
  # receives.  All default to "no restriction" — omit them to keep the current
  # behaviour where every output receives everything.
  #
  # Filter evaluation order (first failing rule blocks the output):
  #   1. deny_media_types  — block if media_type matches any entry
  #   2. deny_sources      — block if source matches any entry
  #   3. allow_media_types — block if non-empty AND media_type not in list
  #   4. allow_sources     — block if non-empty AND source not in list
  #   5. active_hours      — block if current local time is outside window
  #
  # deny always beats allow: a type/source in both lists is denied.
  #
  # Filters also *route*: an output whose rules reject what a higher-priority
  # source is playing shows the highest-priority active item it does accept,
  # instead of going idle. Two sources playing at once (e.g. Kodi in the
  # living room, Sonos in the kitchen) can therefore show on different
  # outputs simultaneously - a music-only display follows Sonos while an
  # unfiltered one follows Kodi. Only when *nothing* an output accepts is
  # playing does it fall back to idle (or blank, with idle_when_filtered).
  # active_hours doesn't participate in routing - it just switches the
  # output off outside the window.
  #
  # Example: Pixoo shows only music from select sources, 08:00–22:00
  # pixoo:
  #   - enabled: true
  #     ip: 192.168.1.32
  #     allow_media_types:
  #       - music
  #     allow_sources:
  #       - sonos
  #       - spotify
  #       - vinyl
  #     idle_when_filtered: true    # go to idle screen when filtered out
  #     active_hours: "08:00-22:00" # only active 08:00–22:00; wraps midnight
  #
  # Example: Nest Hub shows only film and TV, never music
  # nest_hub:
  #   enabled: true
  #   device_ip: 192.168.1.50
  #   server_host: 192.168.1.10
  #   server_port: 8092
  #   allow_media_types:
  #     - movie
  #     - episode
  #   idle_when_filtered: true
  #
  # media_type values: music, movie, episode
  # source values: kodi, plex, jellyfin, emby, sonos, spotify, mopidy, mpd,
  #                lms, vlc, foobar2000, vinyl, browser, appletv,
  #                homeassistant, youtube, shield, chromecast
  # active_hours: "HH:MM-HH:MM" local time; wrap-around supported
  #   e.g. "22:00-06:00" is active from 22:00 through 06:00 the next morning
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Display power/brightness scheduling (pixoo and ulanzi outputs)
  # ---------------------------------------------------------------------------
  # active_hours above only switches an output to idle *content* - the panel
  # stays lit. These two optional fields drive the hardware itself, on the
  # same daily HH:MM-HH:MM window format (wraps midnight):
  #
  #   screen_off_hours: "23:00-07:00"   # panel actually off during the window
  #   brightness_schedule:              # first matching window wins; outside
  #     - "08:00-20:00=90"              # all windows brightness is left alone
  #     - "20:00-23:00=15"
  #
  # Brightness units are device-native: Pixoo 0-100; Ulanzi/AWTRIX3 0-255
  # (and only effective while AWTRIX3's own auto-brightness is off).
  #
  # Example: Pixoo at full brightness by day, dim in the evening, off at night
  # pixoo:
  #   - enabled: true
  #     ip: 192.168.1.32
  #     screen_off_hours: "23:00-07:00"
  #     brightness_schedule:
  #       - "07:00-20:00=90"
  #       - "20:00-23:00=15"
  # ---------------------------------------------------------------------------

  # Ulanzi TC001 (or any AWTRIX3 device) — scrolling text clock.
  # Displays artist and song title as scrolling text. Artwork is not shown
  # (the display is text-only); it shows the clock face when nothing plays.
  ulanzi:
    enabled: true
    device_ip: 192.168.1.60
    app_name: now_playing        # AWTRIX3 custom app slot name
    username: ""                 # HTTP basic auth (leave blank if not set)
    password: ""

  # Multiple Ulanzi clocks — kitchen and office:
  # ulanzi:
  #   - enabled: true
  #     device_ip: 192.168.1.60
  #     app_name: now_playing
  #   - enabled: true
  #     device_ip: 192.168.1.61
  #     app_name: now_playing

  # Video output — full-screen browser page with ambient video wallpapers.
  # Shows artwork when something is playing; switches to looping video clips
  # fetched from Pexels (or Pixabay) when idle.
  # Open http://<this-machine>:8091 on any browser or smart TV.
  video:
    enabled: true
    host: 0.0.0.0
    port: 8091
    source: pexels               # "pexels" or "pixabay"
    # Comma-separated search terms; one is picked at random each refresh.
    queries: nature,ocean,mountains,forests
    # How often (seconds) to fetch a new batch of videos while idle.
    refresh_interval_seconds: 3600
    batch_size: 15               # Number of videos to fetch per batch
    # API key from https://www.pexels.com/api/ (free, requires sign-up)
    pexels_api_key: YOUR_PEXELS_API_KEY
    # API key from https://pixabay.com/api/docs/ (used when source = "pixabay")
    pixabay_api_key: ""
    # See outputs.web's transition_exclude above.
    transition_exclude: []

  # Multiple video outputs — living room TV on 8091, bedroom TV on 8093:
  # video:
  #   - enabled: true
  #     host: 0.0.0.0
  #     port: 8091
  #     source: pexels
  #     queries: nature,ocean,mountains
  #     pexels_api_key: YOUR_PEXELS_API_KEY
  #   - enabled: true
  #     host: 0.0.0.0
  #     port: 8093
  #     source: pexels
  #     queries: cityscapes,architecture
  #     pexels_api_key: YOUR_PEXELS_API_KEY

  # Web output — serves a browser page with full-screen artwork.
  # Open http://<this-machine>:8090 on any browser or smart TV.
  web:
    enabled: true
    host: 0.0.0.0            # Listen on all network interfaces
    port: 8090
    # Each image change picks a random transition: fade, slide-left,
    # slide-right, slide-up, slide-down, or zoom. All are used by default;
    # list any to skip here, e.g. [slide-up, slide-down]. Also available on
    # `info` and `video` below.
    transition_exclude: []

  # Multiple web outputs — e.g. different ports for different rooms:
  # web:
  #   - enabled: true
  #     host: 0.0.0.0
  #     port: 8090
  #   - enabled: true
  #     host: 0.0.0.0
  #     port: 8094

  # Themes output — a completely separate full-screen display from `web`
  # above (its own port, its own page) that layers selectable, combinable
  # Display Themes on top of the current artwork/metadata - e.g. a color
  # palette, a blurred background, a glow. Enabled themes render
  # simultaneously into one combined look, not as alternate single-active
  # skins. Open http://<this-machine>:8097 on any browser or smart TV. More
  # themes are still being added - see the Display Themes roadmap plan.
  themes:
    enabled: false
    host: 0.0.0.0
    port: 8097
    # See outputs.web's transition_exclude above.
    transition_exclude: []
    # One entry per theme, keyed by theme name - only the themes listed
    # below actually exist today; any other name is ignored with a warning.
    themes:
      # Shows the current artwork's dominant colors as a strip of swatches.
      color_palette:
        enabled: true
        # How many swatches to show, most-prevalent color first.
        swatch_count: 5
        # "bottom" (default), "top", or "side".
        swatch_position: bottom

      # Fills the screen behind the sharp foreground artwork with a
      # heavily blurred, darkened copy of it.
      blurred_background:
        enabled: true
        # Gaussian blur radius - higher is softer.
        blur_radius: 40
        # 1.0 = unchanged, below 1 darkens (keeps foreground text/art
        # readable), above 1 brightens.
        brightness: 0.6

      # A word cloud built from the current item's own text, colored from
      # its artwork - lyrics for music (reuses the same cached word cloud
      # `enrichers.mediadata`/`text_enrichers.mediadata` already produce,
      # see mediadata.wordcloud above - needs mediadata enabled with
      # lyrics fetchable for the playing track), or the plot summary for
      # movies/TV (needs `enrichers.wikipedia.enabled: true` for
      # now_playing.summary to be populated at all).
      word_cloud:
        enabled: true
        # "bottom-right" (default), "bottom-left", "top-right",
        # "top-left", or "center".
        corner: bottom-right
        # Width as a percentage of screen width (it's square, so this
        # sets its height too, capped to screen height).
        size_vw: 35

      # A soft, slowly pulsing ambient glow behind the artwork, colored
      # from it by default.
      glow:
        enabled: true
        # How visible the glow is at its peak, 0 (invisible) to 1 (fully
        # visible).
        intensity: 0.6
        # "album_art" (default, colored from the artwork's own dominant
        # color) or "fixed" (always fixed_color below).
        color_source: album_art
        fixed_color: "#ffffff"
        # Slowly grow/shrink the glow on a loop.
        pulse: true

      # A slow, continuous pan/zoom on the artwork - the classic "Ken
      # Burns" documentary effect. Renders its own animated copy behind
      # the static foreground artwork (same letterbox space Blurred
      # Background occupies) - never replaces the sharp foreground image.
      ken_burns:
        enabled: true
        # Seconds for one full pan/zoom cycle - lower is more noticeable.
        duration_seconds: 20
        # How visible the animated layer is, 0 (invisible) to 1 (fully
        # visible).
        opacity: 0.5

      # Shows the album art as a spinning vinyl record. Music only - a
      # record-player metaphor has no equivalent for movies/TV, so this
      # theme produces nothing outside music. Purely decorative rotation:
      # it can't stop on pause, since no source reports that state.
      vinyl:
        enabled: true
        # "bottom-left" (default - opposite corner from word_cloud's
        # default, so they don't collide), "bottom-right", "top-right",
        # "top-left", or "center".
        corner: bottom-left
        # Diameter as a percentage of the shorter screen dimension.
        size_vmin: 40
        # Seconds for one full rotation - lower spins faster.
        rotation_seconds: 8

      # A grid of related artwork alongside the current pick - other
      # albums by the artist, other posters/fanart for the item. Only
      # uses artwork already available for the current item (never
      # fetches anything new); degrades to a single tile when just one
      # candidate image exists, rather than hiding.
      media_mosaic:
        enabled: true
        # "top-right" (default), "bottom-right", "bottom-left",
        # "top-left", or "center".
        corner: top-right
        # Max width as a percentage of screen width.
        size_vw: 30
        # Cap on how many tiles to include.
        max_tiles: 6

      # A grid of top-billed cast headshots for the current movie/TV
      # item. Needs enrichers.tmdb.fetch_cast enabled above - otherwise
      # degrades to nothing (reported on /health). Movie/TV only.
      cast_mosaic:
        enabled: true
        # "top-right" (default), "bottom-right", "bottom-left",
        # "top-left", or "center".
        corner: top-right
        # Max width as a percentage of screen width.
        size_vw: 30
        # Cap on how many cast members to show - further capped by
        # enrichers.tmdb.cast_size above.
        max_cast: 6

      # A portrait card with the current artist's photo and a short bio
      # blurb. Reuses the same artist photo lookup MediaDataStore already
      # does (needs enrichers.mediadata enabled) and NowPlaying.summary
      # (needs enrichers.wikipedia enabled) - no extra setup beyond that.
      # Degrades to nothing (reported on /health) when no photo is found.
      artist_spotlight:
        enabled: true
        # "bottom-left" (default), "bottom-right", "top-right",
        # "top-left", or "center".
        corner: bottom-left
        # Max width as a percentage of screen width.
        size_vw: 25
        # Show a short bio snippet below the artist name.
        show_bio: true

      # A list of the artist's other albums alongside the current one.
      # Music only. Needs enrichers.lidarr configured with the playing
      # artist actually in your Lidarr library to show real other albums
      # - otherwise it degrades to showing just the current album (still
      # shown, not hidden), and reports that degraded state on /health.
      timeline:
        enabled: true
        # "top-left" (default), "bottom-right", "bottom-left",
        # "top-right", or "center".
        corner: top-left
        # Cap on how many albums to list.
        max_albums: 8

      # A decorative bar/wave animation suggesting audio activity. Music
      # only. NOT a real audio visualizer - no source in this project
      # exposes an actual audio signal (PCM/FFT) to react to; this is a
      # continuous, self-driven CSS animation.
      equalizer:
        enabled: true
        # "bars" (default) or "wave".
        style: bars
        # Full-width strip along this edge - "bottom" (default) or "top".
        # All four screen corners are already used by other themes'
        # defaults above.
        position: bottom
        # Number of bars, style="bars" only.
        bar_count: 24
        # How visible the effect is, 0 (invisible) to 1 (fully visible).
        opacity: 0.7

      # A karaoke-style ticker highlighting the current line of
      # time-synced lyrics. Music only - needs NowPlaying.synced_lyrics
      # populated (e.g. by text_enrichers.lrclib) -
      # degrades to nothing (reported on /health) when unavailable.
      lyrics_ticker:
        enabled: true
        # Full-width strip along this edge - "top" (default) or "bottom".
        position: top
        # Show the upcoming line, faded, below the current one.
        show_next_line: true

      # A real-data (not decorative) full-width playback progress border
      # along one screen edge. Works for music, movies, and TV alike,
      # whenever the source reports both position and duration. A
      # separate element from the themes page's own small built-in
      # progress bar under the title/subtitle - this one is a permanent
      # full-width border.
      progress_bar:
        enabled: true
        # Full-width strip along this edge - "bottom" (default) or "top".
        position: bottom
        thickness_px: 6
        # A CSS color for the filled portion.
        color: "#ffffff"

    # Optionally cycle between named subsets of the themes enabled above,
    # instead of always showing every one of them at once. Every enabled
    # theme's CSS/JS still loads and it still runs every tick regardless
    # - only which themes' data actually reaches the browser is filtered
    # by whichever preset is currently active, so switching is instant.
    # Off by default (or on with no presets below) - every enabled theme
    # above just shows simultaneously, same as if this section didn't
    # exist at all.
    auto_rotate:
      enabled: false
      # Seconds between rotating to the next preset.
      interval_seconds: 60
      # preset name -> either a plain list of theme names (unconditioned -
      # takes part in the timer-based rotation above), or a {themes:,
      # when:} mapping - a preset with `when` auto-activates and stays
      # pinned (the timer never rotates away from it) whenever the
      # current media type is in that list, instead of waiting its turn.
      # `when` accepts "music", "movie", "episode", "idle" (nothing
      # playing / idle wallpaper), and a preset can list more than one. A
      # theme name not listed under `themes:` above simply never appears.
      presets:
        minimal:
        - color_palette
        full:
        - color_palette
        - blurred_background
        - glow
        - vinyl
        music:
          themes:
          - vinyl
          - progress_bar
          - equalizer
          when:
          - music


# ---------------------------------------------------------------------------
# Enrichers  (extra artwork from online databases)
# ---------------------------------------------------------------------------
# Enrichers look up additional posters and fanart for movies and TV shows,
# matched via the TMDb/IMDb/TVDB IDs that Kodi and Plex include in metadata.
# The extra images are added to the rotation alongside the local artwork.

enrichers:

  # Unified media-data cache (see `mediadata:` below) — checks the local
  # on-disk cache before any other artwork enricher runs: artist photo +
  # album art for music (falling back to a real Wikipedia [free] /
  # Last.fm [if enrichers.lastfm.api_key is set] lookup for the photo,
  # and MusicBrainz [free] / Discogs [if enrichers.discogs.token is set]
  # for the album art, on a miss), and poster+fanart for movies/TV
  # episodes (via enrichers.tmdb's credential, falling back to
  # enrichers.fanarttv's for movies only - reuses whatever credentials
  # those sections already have configured, no separate key needed).
  # Caches the result for next time either way. Off by default; listed
  # first (like `library:` below) so a cache hit here saves every
  # enricher after it a redundant lookup.
  mediadata:
    enabled: false
    # Renders a lyrics word-cloud PNG for the playing track, colored from
    # its album art, once both are cached locally - stored next to the
    # track's .lrc file and shown on the web output (port 8090) only, not
    # on Pixoo/Nest Hub/etc. Off by default: a separate switch from
    # `enabled` above since it costs real CPU time per newly-seen track
    # and needs the `wordcloud` package (pulls in matplotlib).
    wordcloud:
      enabled: false

  # Local music library — fills in album art for sources that don't
  # report an album at all (e.g. YouTube), by looking up the playing
  # artist+song in the local library (see `library:` below, populated via
  # `python -m mediainfo import-lidarr` or by the other enrichers below as
  # they resolve things by name) and adding cover art for every album the
  # song appears on. Listed first so that if it fills in the album name,
  # the name-based enrichers below get a chance to also contribute art for
  # it (a free cache hit, since the name now matches what's on file).
  library:
    enabled: true

  # SVT Play — poster art for Swedish public broadcaster (SVT) shows, and
  # tvdb-id resolution for shows whose SVT title is a Swedish translation.
  # No API key required for SVT's own API. Listed before thetvdb so that
  # the tvdb-id and/or originalProgramTitle set here can be used by thetvdb
  # and fanarttv in the same enrichment pass.
  #
  # Optional: configure a Sonarr connection to resolve SVT's Swedish titles
  # to their TheTVDB id via Sonarr's alternate-title index. Use the same
  # host / port / api_key as your Sonarr enricher section below.
  svt:
    enabled: true
    sonarr_host: 192.168.1.50
    sonarr_port: 8989
    sonarr_api_key: YOUR_SONARR_API_KEY

  # TheTVDB — TV episode artwork and banners.
  # Get a free project API key at https://thetvdb.com/dashboard/account/apikey
  # Listed after svt: the SVT enricher may resolve a tvdb-id or set an
  # original-language title first; thetvdb uses both as fallback search terms.
  thetvdb:
    enabled: true
    api_key: YOUR_THETVDB_API_KEY
    pin: ""                      # Only needed for "user-supported" API keys
    # When a title search is ambiguous (e.g. several unrelated shows
    # called "Kingdom"), how many search results to check episode-by-
    # episode before giving up rather than guessing wrong. Raise this to
    # catch a correct match that thetvdb's own search ranks further down,
    # at the cost of more API calls for generic titles.
    max_search_candidates: 5

  # fanart.tv — high-quality posters, backgrounds, and disc art.
  # Get a free personal API key at https://fanart.tv/get-an-api-key/
  fanarttv:
    enabled: true
    api_key: YOUR_FANART_TV_API_KEY

  # Sonarr — TV network/studio and poster/fanart, matched against your own
  # Sonarr library (the shows you actually track) rather than a public
  # catalog. Get the api_key from Sonarr's Settings → General → Security.
  sonarr:
    enabled: true
    host: 192.168.1.50
    port: 8989
    api_key: YOUR_SONARR_API_KEY

  # Radarr — movie studio, genres, and poster/fanart, matched against your
  # own Radarr library. Get the api_key from Radarr's Settings → General →
  # Security.
  radarr:
    enabled: true
    host: 192.168.1.50
    port: 7878
    api_key: YOUR_RADARR_API_KEY

  # Last.fm — artist photos for music tracks.
  # Get a free API key at https://www.last.fm/api/account/create
  # Note: Last.fm removed most artist images from their API in 2019–2020.
  # Photos are still available for many popular artists, but may be absent
  # for less well-known ones.  When no photo is available this enricher is
  # a no-op (the placeholder image is filtered out automatically).
  lastfm:
    enabled: true
    api_key: YOUR_LASTFM_API_KEY

  # MusicBrainz Cover Art Archive — album cover scans for music.
  # No API key required; uses the free Cover Art Archive (coverartarchive.org).
  # Complements fanart.tv: fanart.tv provides promotional/poster art while CAA
  # provides scanned physical album covers.
  musicbrainz:
    enabled: true

  # Lidarr — other albums/songs by the playing artist (NowPlaying.discography)
  # and album art, matched against your own Lidarr library. Get the api_key
  # from Lidarr's Settings → General → Security. Distinct from
  # `python -m mediainfo import-lidarr` (see `library:` below), which is a
  # one-off bulk import rather than a live per-play lookup.
  lidarr:
    enabled: true
    host: 192.168.1.50
    port: 8686
    api_key: YOUR_LIDARR_API_KEY
    max_discography_items: 50

  # Wikipedia — artist bio / movie info / TV show info, plus a photo.
  # No API key required; uses the free Wikipedia REST API. Fills in
  # `summary` (shown by the `info` output and included in RSS/Atom feed
  # entries) and adds a thumbnail photo to the image rotation.
  wikipedia:
    enabled: true

  # TMDb — audience rating (0-10) for movies and TV shows, shown by the
  # `info` output. Free credential from
  # https://www.themoviedb.org/settings/api - either the short v3 "API Key"
  # or the long v4 "API Read Access Token" works.
  tmdb:
    enabled: true
    api_key: YOUR_TMDB_API_KEY_OR_READ_ACCESS_TOKEN
    # Off by default - one extra TMDb API call per new movie/TV item, to
    # populate a top-billed cast list (name/character/headshot) for the
    # themes output's Cast/Crew Mosaic below. TV credits are the show's
    # regular cast, not per-episode guest stars.
    fetch_cast: false
    # Cap on how many top-billed cast members to store.
    cast_size: 8

  # OMDb — IMDb rating (0-10) for movies and TV shows, also shown by the
  # `info` output. Free API key from https://www.omdbapi.com/apikey.aspx
  # Can be enabled alongside tmdb above - whichever finds a rating first
  # wins, the other won't overwrite it.
  omdb:
    enabled: true
    api_key: YOUR_OMDB_API_KEY

  # AI-generated artwork — optional, off by default. Generates an album-
  # art-style image via a local Stable-Diffusion-WebUI-API-compatible
  # instance (AUTOMATIC1111 and most SD/SDXL forks; ComfyUI is NOT
  # supported - different API shape). Prompted from a short mood/genre
  # description only - never from lyrics. Adds to the artwork rotation
  # pool alongside whatever else was found; generated images are cached
  # per song under cache.dir/ai_artwork so they're only generated once.
  ai_artwork:
    enabled: false
    host: localhost
    port: 7860
    steps: 20
    width: 512
    height: 512
    timeout_seconds: 120


# ---------------------------------------------------------------------------
# Text enrichers (lyrics, AI-generated text) - added to
# NowPlaying.lyrics/synced_lyrics/ai_text, cached locally under
# cache.dir/text (see below).
# ---------------------------------------------------------------------------

text_enrichers:
  # Unified media-data cache (see `mediadata:` below) — checks the local
  # on-disk lyrics cache before any other lyrics enricher runs, falling
  # back to a real LRCLIB (free) lookup on a miss and caching the result
  # for next time. Off by default; list it before lrclib below if you
  # enable both, so the cache gets first look.
  mediadata:
    enabled: false

  # LRCLIB — free, public lyrics lookup (https://lrclib.net), no API key
  # needed. Looks up both plain and time-synced lyrics for the currently
  # playing music track by artist/title/album/duration. Only ever shows
  # what LRCLIB itself returns - never a guessed or fuzzy-matched result,
  # and instrumental tracks correctly show nothing.
  lrclib:
    enabled: false

  # Ollama — optional, local AI-generated text (mood/description/"did you
  # know"/album-artist context) about the playing song, added to
  # NowPlaying.ai_text. Requires a local Ollama instance
  # (https://ollama.com) already running with `model` already pulled
  # (e.g. `ollama pull llama3.2`) - this enricher only calls it, it
  # doesn't install/manage Ollama or models itself. Only uses metadata
  # (artist/title/album/genres/year) - never sends lyrics to the model.
  # Off by default: local inference can take several seconds, and it's an
  # extra thing to have running.
  ollama_text:
    enabled: false
    host: localhost
    port: 11434
    model: llama3.2
    timeout_seconds: 30


# ---------------------------------------------------------------------------
# Cache
# ---------------------------------------------------------------------------

cache:
  dir: ./cache
  # Delete cached now-playing artwork files that haven't been used in this
  # many days. The check runs once per day in the background.
  max_age_days: 30
  # Idle wallpapers (Unsplash, Last.fm scrobble history, etc. - stored under
  # <dir>/idle) are purged on a much shorter schedule, since they're
  # decorative and easily refetched rather than tied to a specific item.
  idle_max_age_hours: 48
  # Reject downloaded images smaller than this - low-res thumbnails (e.g.
  # a fallback icon some APIs return when they have no real artwork)
  # aren't worth displaying full-screen. Set both to 0 to disable the
  # check entirely. Doesn't apply to manual artwork overrides (see
  # `overrides` below) - those are a deliberate choice, not a downloaded
  # fallback.
  min_width: 640
  min_height: 480

# Unified, human-browsable artwork/lyrics/metadata cache
# (mediainfo/media_data_store.py) that organizes content as
# movies/<Title> (<Year>)/poster.jpg etc. instead of the flat cache/
# directory above. Only read when at least one of enrichers.mediadata /
# text_enrichers.mediadata above is enabled.
mediadata:
  path: ./mediadata
  # Prefer cached content over a fresh external check - a refresh is
  # attempted afterwards (synchronously, for now) rather than blocking.
  cache_first: true
  refresh:
    enabled: true
    # A released movie's poster/fanart rarely changes.
    movies_days: 180
    # Checked more often than movies - a still-airing show's poster/
    # fanart can change when a new season is announced/released.
    series_days: 30
    # An album's art essentially never changes once released.
    music_days: 365
    # (Lyrics are never auto-refreshed by age - only fetched once if
    # missing, or via an explicit manual refresh.)

# Local SQLite database of artist/album/track metadata (MusicBrainz ids,
# cached cover art URLs, artist photos) - queried before the musicbrainz,
# fanarttv, discogs, and lastfm enrichers make an external API call, so
# the same artist/album/song doesn't trigger a repeat lookup across plays
# or process restarts. MusicBrainz is treated as the source of truth for
# canonical ids.
library:
  db_path: ./library/library.db
  # How long a cached result (e.g. a cover art URL, or "no cover art
  # found") stays valid before it's looked up again.
  max_age_days: 30


# ---------------------------------------------------------------------------
# Idle wallpapers  (shown when nothing is playing)
# ---------------------------------------------------------------------------
# When no source is active, image-capable outputs (web, pixoo, nest_hub, etc.)
# show a rotating set of wallpapers downloaded from the configured source.
# Each output independently rotates through the batch in a random order.

# Multiple idle sources can be enabled at once, but they're never mixed
# within the same batch - exactly one supplies any given batch.
# idle_priority controls which: list the enabled source names in the
# order to try them ("local", "pexels", "unsplash", ...) - the first one
# with wallpapers available wins. Any enabled source left off this list
# is tried last, in the order it's listed under `idle:` below. Leave this
# empty (the default) to just use that `idle:` order for everyone.
idle_priority:
  - local
  - pexels
  - unsplash

# "priority" (default): use idle_priority's order as given, every time -
# the first available source always wins. "random": same "exactly one
# source, never mixed" rule, but which source wins is picked at random
# each batch instead of always preferring the highest-priority one.
idle_mode: priority

idle:

  # Local folders — each immediate subdirectory of `dir` is one
  # "destination" (e.g. one folder per trip/location); one destination is
  # picked at random per batch, and batch_size pictures are picked at
  # random from within it (subfolders under a destination are searched
  # too) - never mixed with another destination in the same batch. No API
  # key needed.
  local:
    enabled: false
    dir: ./wallpapers
    rotation_interval_seconds: 300
    batch_size: 15               # Pictures to pick per batch

  # Art — public-domain artworks from the Art Institute of Chicago's open
  # collection (https://api.artic.edu). No API key required. `transforms`
  # is this source's own image styling (same syntax as an output's
  # `transforms` above, e.g. a border/crop suited to art) - applied before
  # whichever output's own transforms, so it stays consistent no matter
  # which display shows it.
  arts:
    enabled: false
    rotation_interval_seconds: 300
    batch_size: 10                # Artworks to fetch per batch
    # transforms:
    #   - pad: {width: 1280, height: 800, color: black}

  # Unsplash — high-resolution photography.
  # Create a free app at https://unsplash.com/oauth/applications and use the
  # "Demo" access key (no approval required).
  unsplash:
    enabled: true
    # Comma-separated search terms; one batch is fetched per rotation cycle.
    queries: nature,architecture,space
    # How often (seconds) to download a fresh batch of wallpapers.
    rotation_interval_seconds: 300
    batch_size: 10               # Images to download per batch
    access_key: YOUR_UNSPLASH_ACCESS_KEY

  # Pexels — stock photography, as an alternative or fallback to Unsplash.
  # Each idle source is fetched independently on its own schedule, so
  # enabling both (with idle_priority above ranking Pexels ahead of or
  # behind Unsplash) means if one is ever unreachable, the other's
  # wallpapers still show instead of nothing - never mixed together,
  # though; whichever one wins supplies the whole batch. Free key from
  # https://www.pexels.com/api/ (same key works for outputs.video's
  # Pexels clips too, if enabled).
  pexels:
    enabled: false
    queries: nature,architecture,space
    rotation_interval_seconds: 300
    batch_size: 10
    api_key: YOUR_PEXELS_API_KEY

  # Last.fm scrobble history — shows album art from your recent scrobbles
  # instead of (or as an alternative to) photography.
  # Get a free API key at https://www.last.fm/api/account/create (same key
  # as enrichers.lastfm, if that's also enabled).
  lastfm:
    enabled: false
    api_key: YOUR_LASTFM_API_KEY
    username: YOUR_LASTFM_USERNAME
    batch_size: 10                # Recent scrobbles to fetch per refresh
    rotation_interval_seconds: 300

  # Local music library — cover art from random albums in your own
  # collection (see `library:` above). No API key required.
  library:
    enabled: false
    batch_size: 10                # Albums to pick per refresh
    rotation_interval_seconds: 300


# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
# Logs are always written to stdout (visible via `docker compose logs`).
# To also write to a rotating file, fill in the path below.

logging:
  # DEBUG, INFO, WARNING, ERROR, or CRITICAL. DEBUG is noisy (e.g. logs
  # every skipped/unsupported Sonos coordinator) but useful when
  # troubleshooting why a source isn't detecting playback.
  level: INFO
  file: ./logs/mediainfo.log
  max_bytes: 1048576             # Rotate at 1 MB
  backup_count: 3               # Keep 3 old log files


# ---------------------------------------------------------------------------
# Optional authentication
# ---------------------------------------------------------------------------
# Off by default - your own LAN keeps working with no login prompt either
# way, since requests from RFC1918 private-use addresses (and loopback)
# are never challenged, regardless of `enabled`. Turn this on if you're
# exposing the web/config/info/feed/video/nest_hub outputs beyond your LAN
# (port-forwarding, a reverse proxy, a VPN you don't fully trust, ...) and
# want anything reaching them from outside that range to need a login.
# Applies to all of those outputs at once (one shared username/password).

auth:
  enabled: false
  username: YOUR_USERNAME
  password: YOUR_PASSWORD


# ---------------------------------------------------------------------------
# Alerting
# ---------------------------------------------------------------------------
# Off by default. When enabled, a webhook is POSTed once a source or
# output (e.g. a Pixoo64/Nest Hub that's become unreachable on the
# network, or a source like vinyl_recognizer that's simply not running)
# has been continuously failing for at least error_threshold_seconds -
# most chat tools (Slack, Discord, ntfy.sh, healthchecks.io, a generic
# HTTP endpoint of your own, ...) accept a plain JSON POST. Re-fires at
# most every repeat_interval_seconds while the outage continues, and
# resets the moment it recovers.

alerts:
  enabled: false
  webhook_url: https://example.com/webhook
  error_threshold_seconds: 300
  repeat_interval_seconds: 3600


# ---------------------------------------------------------------------------
# Manual artwork overrides
# ---------------------------------------------------------------------------
# On by default. Lets you pin a specific image for a title/subtitle that
# never gets a good poster from any enricher, via the config UI's
# "Overrides" page (linked from the main configuration page) - matched by
# exact title + subtitle, case-insensitive. A match replaces whatever
# enrichment found for that item entirely, and bypasses the cache's
# 640x480 minimum-size filter (it's a deliberate choice, not a download).

overrides:
  enabled: true
  dir: ./overrides


# ---------------------------------------------------------------------------
# Playback history
# ---------------------------------------------------------------------------
# On by default. A persistent log of everything that has played - across
# every source, not just music - browsable at the web output's /history
# page (e.g. http://<host>:8090/history), with thumbnails resolved from
# the regular artwork cache. Each genuinely new item gets one row; a
# repeat of the most recent entry within dedupe_window_seconds (e.g. a
# source blip that stops and resumes the same track) is not logged twice.

history:
  enabled: true
  db_path: ./library/history.db
  max_entries: 1000              # oldest rows beyond this are pruned
  dedupe_window_seconds: 600


# ---------------------------------------------------------------------------
# Poster store
# ---------------------------------------------------------------------------
# Static poster images stored in `dir` that are shown for specific TV shows
# or other media titles.  Unlike artwork overrides (which are pinned per
# title+subtitle via the config UI), posters match by show title and
# optionally by source, so the same poster shows for every episode of a
# series without needing a separate override for each one.
#
# When a poster matches, it replaces whatever enrichers found for that item.
# Artwork overrides (above) are applied after posters and therefore win if
# both match.
#
# source:  the source name as it appears in priority (e.g. "shield", "kodi",
#          "appletv").  Omit to match any source.
# file:    filename inside `dir`.

posters:
  enabled: true
  dir: ./posters
  entries: []
    # - title: Morgonstudion
    #   source: shield    # optional: restrict to a specific source
    #   file: SVT-Morgonstudion.png
